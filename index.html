<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಅರ್ಪಿತ್ ಇ-ಶಾಪ್ ಡ್ಯಾಶ್‌ಬೋರ್ಡ್</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 10px; }
        header { background: #1a1a1a; color: #ffcc00; padding: 10px; text-align: center; font-size: 18px; font-weight: bold; }
        .nav-buttons { display: flex; justify-content: center; gap: 5px; margin: 10px 0; }
        .nav-buttons button { padding: 8px 15px; font-weight: bold; cursor: pointer; border: none; border-radius: 5px; }
        .tab-btn.active { background: #ffcc00; color: #000; }
        .container { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 8px; box-sizing: border-box; }
        .btn-submit { background: #28a745; color: white; border: none; padding: 10px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 5px; }
        .product-card { border: 1px solid #ddd; padding: 10px; border-radius: 5px; margin-bottom: 10px; display: flex; gap: 10px; align-items: center; background: #fafafa; }
        .product-card img { width: 70px; height: 70px; object-fit: cover; border-radius: 4px; }
        .product-details { flex-grow: 1; }
        .action-btns { display: flex; gap: 5px; margin-top: 5px; }
        .btn-edit { background: #ffc107; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; font-weight: bold; }
        .btn-delete { background: #dc3545; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; font-weight: bold; }
        .popup-msg { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #28a745; color: white; padding: 10px 20px; border-radius: 5px; font-weight: bold; display: none; z-index: 1000; }
    </style>
</head>
<body>

<div id="popup" class="popup-msg">ವಸ್ತು ಯಶಸ್ವಿಯಾಗಿ ಪ್ರಕಟಿಸಲಾಗಿದೆ!</div>

<header>ಅಂಗಡಿ ಮಾಲೀಕರ ಡ್ಯಾಶ್‌ಬೋರ್ಡ್</header>

<div class="nav-buttons">
    <button class="tab-btn active" onclick="switchTab('owner')">ಅಂಗಡಿ ಮಾಲೀಕರು</button>
    <button class="tab-btn" onclick="switchTab('customer')">ಗ್ರಾಹಕರು</button>
</div>

<!-- ಅಂಗಡಿ ಮಾಲೀಕರ ಸೆಕ್ಷನ್ -->
<div id="owner-section" class="container">
    <h3>ಹೊಸ ವಸ್ತು ಸೇರಿಸಿ / ಎಡಿಟ್ ಮಾಡಿ</h3>
    <input type="hidden" id="edit-index" value="">
    <div class="form-group">
        <label>ವಸ್ತುವಿನ ಹೆಸರು:</label>
        <input type="text" id="p-name" placeholder="ಉದಾ: ಜೀನ್ಸ್ ಪ্যান্ট">
    </div>
    <div class="form-group">
        <label>ಹಳೆಯ ರೇಟ್ (₹):</label>
        <input type="number" id="p-old-price" placeholder="500">
    </div>
    <div class="form-group">
        <label>ಈಗಿನ ಪ್ರೈಸ್ (₹):</label>
        <input type="number" id="p-new-price" placeholder="450">
    </div>
    <div class="form-group">
        <label>ಅಳತೆ / ಸೈಜ್:</label>
        <input type="text" id="p-size" placeholder="XL / M ಅಥವಾ 10">
    </div>
    <div class="form-group">
        <label>ಫೋಟೋ (Front Photo):</label>
        <input type="file" id="p-image" accept="image/*">
    </div>
    <button class="btn-submit" id="save-btn" onclick="saveProduct()">ವಸ್ತು ಪ್ರಕಟಿಸಿ</button>

    <h3>ನಿಮ್ಮ ಅಂಗಡಿಯಲ್ಲಿರುವ ವಸ್ತುಗಳು:</h3>
    <div id="owner-product-list"></div>
</div>

<!-- ಗ್ರಾಹಕರ ಸೆಕ್ಷನ್ -->
<div id="customer-section" class="container" style="display:none;">
    <h3>ಅರ್ಪಿತ್ ಇ-ಶಾಪ್ (ಗ್ರಾಹಕರು)</h3>
    <div id="customer-product-list"></div>
</div>

<script>
    let products = JSON.parse(localStorage.getItem('arpit_products')) || [];

    function switchTab(tab) {
        if(tab === 'owner') {
            document.getElementById('owner-section').style.display = 'block';
            document.getElementById('customer-section').style.display = 'none';
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.querySelectorAll('.tab-btn')[1].classList.remove('active');
        } else {
            document.getElementById('owner-section').style.display = 'none';
            document.getElementById('customer-section').style.display = 'block';
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.querySelectorAll('.tab-btn')[0].classList.remove('active');
            loadCustomerProducts();
        }
    }

    function showPopup(msg) {
        const pop = document.getElementById('popup');
        pop.innerText = msg;
        pop.style.display = 'block';
        setTimeout(() => { pop.style.display = 'none'; }, 2000);
    }

    function saveProduct() {
        const name = document.getElementById('p-name').value;
        const oldPrice = document.getElementById('p-old-price').value;
        const newPrice = document.getElementById('p-new-price').value;
        const size = document.getElementById('p-size').value;
        const imageInput = document.getElementById('p-image');
        const editIndex = document.getElementById('edit-index').value;

        if(!name || !newPrice) {
            alert("ದಯವಿಟ್ಟು ವಸ್ತುವಿನ ಹೆಸರು ಮತ್ತು ಬೆಲೆ ಹಾಕಿ!");
            return;
        }

        const reader = new FileReader();
        if (imageInput.files && imageInput.files[0]) {
            reader.onload = function(e) {
                processSave(e.target.result, editIndex, name, oldPrice, newPrice, size);
            };
            reader.readAsDataURL(imageInput.files[0]);
        } else {
            let existingImage = editIndex !== "" ? products[editIndex].image : '';
            processSave(existingImage, editIndex, name, oldPrice, newPrice, size);
        }
    }

    function processSave(imgData, editIndex, name, oldPrice, newPrice, size) {
        const productData = { name, oldPrice, newPrice, size, image: imgData };

        try {
            if (editIndex !== "") {
                products[editIndex] = productData;
                document.getElementById('edit-index').value = "";
                document.getElementById('save-btn').innerText = "ವಸ್ತು ಪ್ರಕಟಿಸಿ";
                showPopup("ವಸ್ತು ಯಶಸ್ವಿಯಾಗಿ ಅಪ್‌ಡೇಟ್ ಆಗಿದೆ!");
            } else {
                products.push(productData);
                showPopup("ವಸ್ತು ಯಶಸ್ವಿಯಾಗಿ ಪ್ರಕಟಿಸಲಾಗಿದೆ!");
            }

            localStorage.setItem('arpit_products', JSON.stringify(products));
            clearForm();
            loadOwnerProducts();
        } catch (e) {
            alert("ಮೆಮೊರಿ ಭರ್ತಿಯಾಗಿದೆ! ದಯವಿಟ್ಟು ಹಳೆಯ ವಸ್ತುಗಳನ್ನು ಡಿಲೀಟ್ ಮಾಡಿ.");
        }
    }

    function clearForm() {
        document.getElementById('p-name').value = '';
        document.getElementById('p-old-price').value = '';
        document.getElementById('p-new-price').value = '';
        document.getElementById('p-size').value = '';
        document.getElementById('p-image').value = '';
    }

    function loadOwnerProducts() {
        const listDiv = document.getElementById('owner-product-list');
        listDiv.innerHTML = products.length === 0 ? '<p>ಯಾವುದೇ ವಸ್ತುಗಳಿಲ್ಲ.</p>' : '';

        products.forEach((p, index) => {
            listDiv.innerHTML += `
                <div class="product-card">
                    <img src="${p.image || 'https://via.placeholder.com/70'}" alt="Product">
                    <div class="product-details">
                        <strong>${p.name} (${p.size})</strong><br>
                        <span style="color:green; font-weight:bold;">₹${p.newPrice}</span> 
                        <span style="text-decoration:line-through; color:gray;">₹${p.oldPrice}</span>
                        <div class="action-btns">
                            <button class="btn-edit" onclick="editProduct(${index})">ಎಡಿಟ್</button>
                            <button class="btn-delete" onclick="deleteProduct(${index})">ಡಿಲೀಟ್</button>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    function loadCustomerProducts() {
        const listDiv = document.getElementById('customer-product-list');
        listDiv.innerHTML = products.length === 0 ? '<p>ಯಾವುದೇ ವಸ್ತುಗಳು ಲಭ್ಯವಿಲ್ಲ.</p>' : '';

        products.forEach((p) => {
            listDiv.innerHTML += `
                <div class="product-card">
                    <img src="${p.image || 'https://via.placeholder.com/70'}" alt="Product">
                    <div class="product-details">
                        <strong>${p.name} (ಸೈಜ್: ${p.size})</strong><br>
                        <span style="color:green; font-weight:bold; font-size:16px;">₹${p.newPrice}</span> 
                        <span style="text-decoration:line-through; color:gray;">₹${p.oldPrice}</span>
                    </div>
                </div>
            `;
        });
    }

    function editProduct(index) {
        const p = products[index];
        document.getElementById('p-name').value = p.name;
        document.getElementById('p-old-price').value = p.oldPrice;
        document.getElementById('p-new-price').value = p.newPrice;
        document.getElementById('p-size').value = p.size;
        document.getElementById('edit-index').value = index;
        document.getElementById('save-btn').innerText = "ಬೆಲೆ / ಮಾಹಿತಿ ಅಪ್‌ಡೇಟ್ ಮಾಡಿ";
        window.scrollTo(0, 0);
    }

    function deleteProduct(index) {
        if(confirm("ಖಚಿತವಾಗಿ ಈ ವಸ್ತುವನ್ನು ಡಿಲೀಟ್ ಮಾಡಲು ಬಯಸುತ್ತೀರಾ?")) {
            products.splice(index, 1);
            localStorage.setItem('arpit_products', JSON.stringify(products));
            loadOwnerProducts();
            showPopup("ವಸ್ತು ಡಿಲೀಟ್ ಮಾಡಲಾಗಿದೆ!");
        }
    }

    // Initial load
    loadOwnerProducts();
</script>

</body>
</html>
