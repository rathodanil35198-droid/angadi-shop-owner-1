<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shahapur Local Market</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #222;
}

header {
  background: #087f5b;
  color: white;
  padding: 20px 14px;
  text-align: center;
}

header h1 {
  margin: 0 0 8px;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 15px;
}

input, select, textarea, button {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 16px;
}

button {
  background: #087f5b;
  color: white;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  opacity: 0.9;
}

.secondary {
  background: #34495e;
}

.danger {
  background: #c0392b;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
  gap: 12px;
}

.card, .panel {
  background: white;
  padding: 14px;
  border-radius: 12px;
  box-shadow: 0 2px 8px #0000000c;
  margin-bottom: 14px;
}

.product-icon {
  font-size: 48px;
  text-align: center;
}

.price {
  color: #087f5b;
  font-size: 19px;
  font-weight: bold;
}

nav {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 15px;
}

nav button {
  flex: 1;
  min-width: 100px;
}

.hidden {
  display: none;
}

small {
  color: #666;
}

.order-item {
  border-bottom: 1px solid #ddd;
  padding: 12px 0;
}
</style>
</head>

<body>

<header>
  <h1>🛒 Shahapur Local Market</h1>
  <p>ನಿಮ್ಮ ಊರಿನ ಅಂಗಡಿ — ನಿಮ್ಮ ಮನೆಗೆ ಡೆಲಿವರಿ</p>
</header>

<div class="container">

<nav>
  <button onclick="showPage('home')">ಅಂಗಡಿಗಳು</button>
  <button onclick="showPage('cart')">🛒 Cart <span id="cartCount">0</span></button>
  <button onclick="showPage('orders')">ನನ್ನ ಆರ್ಡರ್</button>
  <button class="secondary" onclick="showPage('owner')">Shop Owner</button>
</nav>

<section id="home">

  <input
    id="search"
    placeholder="🔍 ವಸ್ತು ಅಥವಾ ಅಂಗಡಿ ಹುಡುಕಿ..."
    oninput="renderProducts()"
  >

  <select id="category" onchange="renderProducts()">
    <option value="all">ಎಲ್ಲಾ ಕ್ಯಾಟಗರಿಗಳು</option>
    <option value="Grocery">ಕಿರಾಣಿ ಅಂಗಡಿ</option>
    <option value="Vegetables">ತರಕಾರಿ</option>
    <option value="Fruits">ಹಣ್ಣುಗಳು</option>
    <option value="Medical">ಮೆಡಿಕಲ್</option>
  </select>

  <h2>ನಮ್ಮ ಅಂಗಡಿಗಳ ವಸ್ತುಗಳು</h2>

  <div id="productList" class="products"></div>

</section>

<section id="cart" class="hidden">

  <h2>🛒 ನಿಮ್ಮ ಕಾರ್ಟ್</h2>

  <div id="cartList"></div>

  <h3>ಒಟ್ಟು: ₹<span id="total">0</span></h3>

  <div class="panel">
    <h3>ಡೆಲಿವರಿ ವಿವರಗಳು</h3>

    <input id="customerName" placeholder="ನಿಮ್ಮ ಹೆಸರು">

    <input
      id="customerPhone"
      type="tel"
      maxlength="10"
      placeholder="10 ಅಂಕಿಯ ಮೊಬೈಲ್ ನಂಬರ್"
    >

    <textarea
      id="customerAddress"
      placeholder="ಮನೆ ವಿಳಾಸ, ಏರಿಯಾ, ಊರು"
    ></textarea>

    <select id="payment">
      <option value="COD">Cash on Delivery</option>
      <option value="ONLINE">Online Payment (Demo ಮಾತ್ರ)</option>
    </select>

    <button onclick="placeOrder()">ಆರ್ಡರ್ ಮಾಡಿ</button>

    <small>
      ಸೂಚನೆ: Online Payment ಆಯ್ಕೆ ಮಾಡಿದರೂ ಈ Demo ಹಣ ಪಾವತಿಸುವುದಿಲ್ಲ.
    </small>
  </div>

</section>

<section id="orders" class="hidden">

  <h2>ನಿಮ್ಮ ಆರ್ಡರ್‌ಗಳು</h2>

  <div id="myOrders"></div>

</section>

<section id="owner" class="hidden">

  <h2>🏪 Shop Owner Panel</h2>

  <p>
    ಈ Demoಯಲ್ಲಿ ಬ್ರೌಸರ್‌ನಲ್ಲಿ ಉಳಿಸಿದ ಆರ್ಡರ್‌ಗಳನ್ನು ಇಲ್ಲಿ ನೋಡಬಹುದು.
  </p>

  <div id="ownerOrders"></div>

</section>

</div>

<script>
const products = [
  {
    id: 1,
    name: "ಅಕ್ಕಿ 1 KG",
    price: 60,
    category: "Grocery",
    shop: "ಶ್ರೀ ಲಕ್ಷ್ಮಿ ಕಿರಾಣಿ",
    icon: "🍚"
  },
  {
    id: 2,
    name: "ಸಕ್ಕರೆ 1 KG",
    price: 48,
    category: "Grocery",
    shop: "ಶ್ರೀ ಲಕ್ಷ್ಮಿ ಕಿರಾಣಿ",
    icon: "🛍️"
  },
  {
    id: 3,
    name: "ಟೊಮೇಟೊ 1 KG",
    price: 35,
    category: "Vegetables",
    shop: "ರೈತ ತರಕಾರಿ ಅಂಗಡಿ",
    icon: "🍅"
  },
  {
    id: 4,
    name: "ಆಲೂಗಡ್ಡೆ 1 KG",
    price: 40,
    category: "Vegetables",
    shop: "ರೈತ ತರಕಾರಿ ಅಂಗಡಿ",
    icon: "🥔"
  },
  {
    id: 5,
    name: "ಸೇಬು 1 KG",
    price: 160,
    category: "Fruits",
    shop: "ಫ್ರೂಟ್ಸ್ ಕಾರ್ನರ್",
    icon: "🍎"
  },
  {
    id: 6,
    name: "ಬಾಳೆಹಣ್ಣು",
    price: 50,
    category: "Fruits",
    shop: "ಫ್ರೂಟ್ಸ್ ಕಾರ್ನರ್",
    icon: "🍌"
  },
  {
    id: 7,
    name: "ಫಸ್ಟ್ ಏಯ್ಡ್ ವಸ್ತುಗಳು",
    price: 80,
    category: "Medical",
    shop: "ಹೆಲ್ತ್ ಮೆಡಿಕಲ್",
    icon: "🩺"
  }
];

let cart = JSON.parse(localStorage.getItem("marketCart") || "{}");

let orders = JSON.parse(
  localStorage.getItem("marketOrders") || "[]"
);

function saveData() {
  localStorage.setItem("marketCart", JSON.stringify(cart));
  localStorage.setItem("marketOrders", JSON.stringify(orders));
}

function showPage(page) {
  ["home", "cart", "orders", "owner"].forEach(id => {
    document.getElementById(id).classList.add("hidden");
  });

  document.getElementById(page).classList.remove("hidden");

  if (page === "cart") renderCart();
  if (page === "orders") renderMyOrders();
  if (page === "owner") renderOwnerOrders();
}

function renderProducts() {
  const search = document.getElementById("search")
    .value.toLowerCase().trim();

  const category = document.getElementById("category").value;

  const filtered = products.filter(p => {
    const matchesSearch =
      p.name.toLowerCase().includes(search) ||
      p.shop.toLowerCase().includes(search);

    const matchesCategory =
      category === "all" || p.category === category;

    return matchesSearch && matchesCategory;
  });

  document.getElementById("productList").innerHTML =
    filtered.map(p => `
      <div class="card">
        <div class="product-icon">${p.icon}</div>
        <h3>${p.name}</h3>
        <small>${p.shop}</small>
        <p class="price">₹${p.price}</p>
        <button onclick="addToCart(${p.id})">
          ಕಾರ್ಟ್‌ಗೆ ಸೇರಿಸಿ
        </button>
      </div>
    `).join("") || "<p>ವಸ್ತುಗಳು ಸಿಗಲಿಲ್ಲ.</p>";
}

function addToCart(id) {
  cart[id] = (cart[id] || 0) + 1;
  saveData();
  updateCartCount();
  alert("ವಸ್ತು ಕಾರ್ಟ್‌ಗೆ ಸೇರಿಸಲಾಗಿದೆ!");
}

function updateCartCount() {
  const count = Object.values(cart).reduce(
    (sum, qty) => sum + qty, 0
  );

  document.getElementById("cartCount").textContent = count;
}

function changeQty(id, amount) {
  cart[id] = (cart[id] || 0) + amount;

  if (cart[id] <= 0) delete cart[id];

  saveData();
  renderCart();
  updateCartCount();
}

function renderCart() {
  const items = products.filter(p => cart[p.id]);

  document.getElementById("cartList").innerHTML =
    items.map(p => `
      <div class="card">
        <b>${p.name}</b>
        <p>₹${p.price} × ${cart[p.id]}</p>

        <button onclick="changeQty(${p.id}, 1)">+</button>
        <button class="secondary"
          onclick="changeQty(${p.id}, -1)">−</button>

        <p>ಮೊತ್ತ: ₹${p.price * cart[p.id]}</p>
      </div>
    `).join("") || "<p>ನಿಮ್ಮ ಕಾರ್ಟ್ ಖಾಲಿಯಾಗಿದೆ.</p>";

  const total = items.reduce(
    (sum, p) => sum + p.price * cart[p.id], 0
  );

  document.getElementById("total").textContent = total;
}

function placeOrder() {
  const name = document.getElementById("customerName")
    .value.trim();

  const phone = document.getElementById("customerPhone")
    .value.trim();

  const address = document.getElementById("customerAddress")
    .value.trim();

  const payment = document.getElementById("payment").value;

  const items = products.filter(p => cart[p.id]);

  if (!items.length) {
    alert("ಮೊದಲು ಕಾರ್ಟ್‌ಗೆ ವಸ್ತುಗಳನ್ನು ಸೇರಿಸಿ.");
    return;
  }

  if (!name || !/^[6-9]\d{9}$/.test(phone) || !address) {
    alert("ಸರಿಯಾದ ಹೆಸರು, 10 ಅಂಕಿಯ ಮೊಬೈಲ್ ನಂಬರ್ ಮತ್ತು ವಿಳಾಸ ನೀಡಿ.");
    return;
  }

  const orderItems = items.map(p => ({
    productId: p.id,
    name: p.name,
    price: p.price,
    quantity: cart[p.id],
    shop: p.shop
  }));

  const total = orderItems.reduce(
    (sum, item) => sum + item.price * item.quantity, 0
  );

  const order = {
    id: "ORD" + Date.now(),
    name,
    phone,
    address,
    payment,
    items: orderItems,
    total,
    status: "ಹೊಸ ಆರ್ಡರ್",
    createdAt: new Date().toLocaleString("en-IN")
  };

  orders.unshift(order);
  cart = {};

  saveData();
  updateCartCount();
  renderCart();

  alert("Demo ಆರ್ಡರ್ ರಚಿಸಲಾಗಿದೆ! ಆರ್ಡರ್ ID: " + order.id);

  showPage("orders");
}

function renderMyOrders() {
  const html = orders.map(o => `
    <div class="card">
      <h3>ಆರ್ಡರ್: ${o.id}</h3>
      <p>ದಿನಾಂಕ: ${o.createdAt}</p>
      <p>ಒಟ್ಟು: ₹${o.total}</p>
      <p>ಸ್ಥಿತಿ: <b>${o.status}</b></p>
      <p>${o.items.map(i =>
        `${i.name} × ${i.quantity}`
      ).join("<br>")}</p>
    </div>
  `).join("");

  document.getElementById("myOrders").innerHTML =
    html || "<p>ಇನ್ನೂ ಯಾವುದೇ ಆರ್ಡರ್ ಇಲ್ಲ.</p>";
}

function renderOwnerOrders() {
  const html = orders.map(o => `
    <div class="card">
      <h3>${o.id}</h3>
      <p>ಗ್ರಾಹಕ: ${o.name}</p>
      <p>ಮೊಬೈಲ್: ${o.phone}</p>
      <p>ವಿಳಾಸ: ${o.address}</p>
      <p>ಪಾವತಿ ವಿಧಾನ: ${o.payment}</p>
      <p>ಒಟ್ಟು: ₹${o.total}</p>
      <p>ಸ್ಥಿತಿ: <b>${o.status}</b></p>

      ${o.items.map(i =>
        `<p>${i.shop} — ${i.name} × ${i.quantity}</p>`
      ).join("")}

      <button onclick="updateStatus('${o.id}', 'ಆರ್ಡರ್ ಸ್ವೀಕರಿಸಲಾಗಿದೆ')">
        Accept Order
      </button>

      <button class="secondary"
        onclick="updateStatus('${o.id}', 'ಡೆಲಿವರಿಗೆ ಸಿದ್ಧ')">
        Ready for Delivery
      </button>

      <button class="secondary"
        onclick="updateStatus('${o.id}', 'ಡೆಲಿವರಿ ಪೂರ್ಣ')">
        Delivered
      </button>
    </div>
  `).join("");

  document.getElementById("ownerOrders").innerHTML =
    html || "<p>ಇನ್ನೂ ಯಾವುದೇ ಆರ್ಡರ್ ಬಂದಿಲ್ಲ.</p>";
}

function updateStatus(id, status) {
  const order = orders.find(o => o.id === id);

  if (!order) return;

  order.status = status;

  saveData();
  renderOwnerOrders();
  renderMyOrders();

  alert("ಆರ್ಡರ್ ಸ್ಥಿತಿ ಬದಲಾಯಿಸಲಾಗಿದೆ.");
}

renderProducts();
updateCartCount();
</script>

</body>
</html>
