<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ಅಕ್ವಿಕ್ ಇ-ಶಾಪ್ & ಶಾಪ್ ಓನರ್ ಆ್ಯಪ್</title>
    <style>
        :root {
            --primary-yellow: #ffd814;
            --dark-bg: #131921;
            --light-gray: #f2f2f2;
            --green-success: #2e7d32;
            --red-cancel: #d9534f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--light-gray);
            color: #111;
            padding-bottom: 40px;
        }

        header {
            background-color: var(--dark-bg);
            color: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 16px;
            color: var(--primary-yellow);
        }

        .header-btns {
            display: flex;
            gap: 6px;
        }

        .screen {
            display: none;
            max-width: 500px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
        }

        .screen.active {
            display: block;
        }

        .card-box {
            padding: 16px;
            border-bottom: 8px solid #f0f0f0;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 4px;
            color: #333;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .btn-publish {
            background-color: #2e7d32;
            width: 100%;
            padding: 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            color: white;
        }

        /* Full Product Image display without cropping */
        .product-full-img {
            width: 100%;
            max-height: 380px;
            object-fit: contain;
            background: #fafafa;
            border-radius: 6px;
            display: block;
            margin-bottom: 10px;
        }

        /* Owner Item Row */
        .item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            gap: 10px;
        }

        .item-imgs {
            display: flex;
            gap: 5px;
        }

        .item-imgs img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            border-radius: 4px;
            border: 1px solid #ccc;
            background: #f9f9f9;
        }

        .item-info {
            flex: 1;
        }

        .delete-btn {
            background: var(--red-cancel);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Customer View */
        .cust-product-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
        }

        .btn-buy-now {
            background-color: var(--primary-yellow);
            color: #111;
            width: 100%;
            padding: 12px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 8px;
        }

        .owner-order-card {
            background: #fffde7;
            border: 1px solid #fbc02d;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <!-- 1. ಗ್ರಾಹಕರ ಅಕ್ವಿಕ್ ಇ-ಶಾಪ್ ಪುಟ (ಮುಖ್ಯ ಪುಟ) -->
    <div id="screen-customer-shop" class="screen active">
        <header>
            <h1 onclick="switchScreen('screen-customer-shop')">ಅಕ್ವಿಕ್ ಇ-ಶಾಪ್</h1>
            <div class="header-btns">
                <button onclick="switchScreen('screen-owner-app')" style="background:#232f3e; color:white; border:1px solid #485769; padding:5px 8px; border-radius:4px; font-weight:bold; cursor:pointer; font-size:11px;">👨‍💼 ಶಾಪ್ ಓನರ್ ಆ್ಯಪ್</button>
                <button onclick="openMyOrders()" style="background:#232f3e; color:white; border:1px solid #485769; padding:5px 8px; border-radius:4px; font-weight:bold; cursor:pointer; font-size:11px;">📦 ನನ್ನ ಆರ್ಡರ್‌ಗಳು</button>
            </div>
        </header>

        <div style="padding: 16px;" id="customer-products-container">
            <!-- Dynamic products published by shop owner will show here -->
        </div>
    </div>

    <!-- 2. ಶಾಪ್ ಓನರ್ ಆ್ಯಪ್ ಪೇಜ್ -->
    <div id="screen-owner-app" class="screen">
        <header>
            <h1>ಶಹಾಪುರ ಮಾರ್ಕೆಟ್ (ಶಾಪ್ ಓನರ್)</h1>
            <div class="header-btns">
                <button onclick="openOrdersListModal()" style="background:#28a745; color:white; border:none; padding:5px 8px; border-radius:4px; font-weight:bold; cursor:pointer; font-size:11px;">📦 ಆರ್ಡರ್ ನೋಡಿ</button>
                <button onclick="switchScreen('screen-customer-shop')" style="background:#ffc107; color:#111; border:none; padding:5px 8px; border-radius:4px; font-weight:bold; cursor:pointer; font-size:11px;">← ಗ್ರಾಹಕ ಆ್ಯಪ್‌ಗೆ</button>
            </div>
        </header>

        <div class="card-box">
            <h3 style="font-size: 15px; margin-bottom: 12px; color:#0d47a1;">➕ ಹೊಸ ವಸ್ತು ಪ್ರಕಟಿಸಿ (Publish Product)</h3>
            <form id="upload-product-form" onsubmit="handleProductPublish(event)">
                <div class="form-group">
                    <label>ವಸ್ತುವಿನ ಹೆಸರು:</label>
                    <input type="text" id="prod-name" required placeholder="ಉದಾ: ಜೀನ್ಸ್ ಪ್ಯಾಂಟ್ / ಶರ್ಟ್">
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex:1;">
                        <label>ಹಳೆಯ ರೇಟ್ (₹):</label>
                        <input type="number" id="prod-old-price" required placeholder="600">
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>ಈಗಿನ ಪ್ರೈಸ್ (₹):</label>
                        <input type="number" id="prod-curr-price" required placeholder="350">
                    </div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex:1;">
                        <label>ಎಷ್ಟು ಪೀಸ್ ಕೊಡ್ತಾ ಇದ್ದೀರಾ?:</label>
                        <select id="prod-pieces" required>
                            <option value="1 ಪೀಸ್">1 ಪೀಸ್</option>
                            <option value="2 ಪೀಸ್">2 ಪೀಸ್</option>
                            <option value="3 ಪೀಸ್">3 ಪೀಸ್</option>
                            <option value="4 ಪೀಸ್">4 ಪೀಸ್</option>
                            <option value="5 ಪೀಸ್">5 ಪೀಸ್</option>
                            <option value="6 ಪೀಸ್">6 ಪೀಸ್</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>ಸೈಜ್ / ನಂಬರ್ / ಅಳತೆ:</label>
                        <input type="text" id="prod-size" required placeholder="XL / 8 / M">
                    </div>
                </div>
                <div class="form-group">
                    <label>ಮುಂಭಾಗದ ಫೋಟೋ ಅಪ್ಲೋಡ್ ಮಾಡಿ:</label>
                    <input type="file" id="prod-front-img" accept="image/*" required>
                </div>
                <div class="form-group">
                    <label>ಹಿಂಭಾಗದ ಫೋಟೋ ಅಪ್ಲೋಡ್ ಮಾಡಿ:</label>
                    <input type="file" id="prod-back-img" accept="image/*">
                </div>
                <button type="submit" class="btn-publish">ವಸ್ತು ಪ್ರಕಟಿಸಿ (Publish)</button>
            </form>
        </div>

        <div style="padding: 16px;">
            <h3 style="font-size: 15px; margin-bottom: 10px;">🖼️ ನಿಮ್ಮ ಅಂಗಡಿಯಲ್ಲಿರುವ ವಸ್ತುಗಳು:</h3>
            <div id="owner-uploaded-products-list">
                <!-- Uploaded items list -->
            </div>
        </div>
    </div>

    <!-- 3. ಬಂದಿರುವ ಆರ್ಡರ್‌ಗಳನ್ನು ವೀಕ್ಷಿಸುವ Modal -->
    <div id="orders-list-modal" class="screen" style="position:fixed; top:0; left:0; right:0; bottom:0; z-index:200; background:white; display:none; max-width:500px; margin:0 auto; overflow-y:auto;">
        <header>
            <h1>ಬಂದಿರುವ ಆರ್ಡರ್‌ಗಳು</h1>
            <button onclick="closeOrdersListModal()" style="background:none; border:none; color:white; font-size:22px; cursor:pointer;">&times;</button>
        </header>
        <div style="padding: 16px;" id="owner-incoming-orders-list">
            <!-- Incoming orders -->
        </div>
    </div>

    <!-- 4. ನನ್ನ ಆರ್ಡರ್‌ಗಳು (Customer Side Orders View) -->
    <div id="screen-my-orders" class="screen">
        <header>
            <h1>ನನ್ನ ಆರ್ಡರ್‌ಗಳು</h1>
            <button onclick="switchScreen('screen-customer-shop')" style="background:#232f3e; color:white; border:1px solid #485769; padding:5px 8px; border-radius:4px; font-weight:bold; cursor:pointer; font-size:11px;">← ಶಾಪಿಂಗ್‌ಗೆ ಮರಳಿ</button>
        </header>
        <div style="padding: 16px;" id="customer-orders-list">
            <!-- Customer placed orders -->
        </div>
    </div>

    <script>
        // Default product if empty
        let defaultProducts = [
            {
                id: 101,
                name: 'ನೋಫಿಲ್ಟರ್ ಚೆಕ್ಡ್ ಕ್ಯಾಶುವಲ್ ಶರ್ಟ್',
                oldPrice: '1899',
                currPrice: '442',
                pieces: '1 ಪೀಸ್',
                size: 'M',
                frontImg: 'https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?w=600',
                backImg: 'https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?w=600'
            }
        ];

        let shopProducts = JSON.parse(localStorage.getItem('ar_shop_products')) || defaultProducts;
        let ownerOrders = JSON.parse(localStorage.getItem('ar_owner_orders')) || [];

        window.onload = function() {
            renderCustomerProducts();
            renderOwnerProducts();
        };

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            window.scrollTo(0,0);
            if(screenId === 'screen-customer-shop') renderCustomerProducts();
            if(screenId === 'screen-owner-app') renderOwnerProducts();
        }

        function openOrdersListModal() {
            renderIncomingOrders();
            document.getElementById('orders-list-modal').style.display = 'block';
        }

        function closeOrdersListModal() {
            document.getElementById('orders-list-modal').style.display = 'none';
        }

        function handleProductPublish(event) {
            event.preventDefault();
            let name = document.getElementById('prod-name').value;
            let oldPrice = document.getElementById('prod-old-price').value;
            let currPrice = document.getElementById('prod-curr-price').value;
            let pieces = document.getElementById('prod-pieces').value;
            let size = document.getElementById('prod-size').value;

            let frontFileInput = document.getElementById('prod-front-img').files[0];
            let backFileInput = document.getElementById('prod-back-img').files[0];

            let reader = new FileReader();
            reader.onload = function(e) {
                let frontImgUrl = e.target.result;

                let createAndSave = function(backImgUrl) {
                    let newProd = {
                        id: Date.now(),
                        name: name,
                        oldPrice: oldPrice,
                        currPrice: currPrice,
                        pieces: pieces,
                        size: size,
                        frontImg: frontImgUrl,
                        backImg: backImgUrl || frontImgUrl
                    };

                    shopProducts.unshift(newProd); // New published item comes to top
                    localStorage.setItem('ar_shop_products', JSON.stringify(shopProducts));

                    renderOwnerProducts();
                    renderCustomerProducts();
                    document.getElementById('upload-product-form').reset();
                    alert("ನಿಮ್ಮ ವಸ್ತು ಯಶಸ್ವಿಯಾಗಿ ಪ್ರಕಟವಾಗಿದೆ ಹಾಗೂ ಗ್ರಾಹಕರ ಆ್ಯಪ್‌ಗೆ ತಲುಪಿದೆ!");
                };

                if (backFileInput) {
                    let backReader = new FileReader();
                    backReader.onload = function(eBack) {
                        createAndSave(eBack.target.result);
                    };
                    backReader.readAsDataURL(backFileInput);
                } else {
                    createAndSave(frontImgUrl);
                }
            };

            if (frontFileInput) {
                reader.readAsDataURL(frontFileInput);
            }
        }

        function renderOwnerProducts() {
            let list = document.getElementById('owner-uploaded-products-list');
            list.innerHTML = '';
            if (shopProducts.length === 0) {
                list.innerHTML = '<p style="color:#666; font-size:13px;">ಯಾವುದೇ ವಸ್ತುಗಳನ್ನು ಅಪ್‌ಲೋಡ್ ಮಾಡಿಲ್ಲ.</p>';
                return;
            }
            shopProducts.forEach((p) => {
                list.innerHTML += `
                    <div class="item-row">
                        <div class="item-imgs">
                            <img src="${p.frontImg}" alt="Front">
                            <img src="${p.backImg}" alt="Back">
                        </div>
                        <div class="item-info">
                            <strong>${p.name} (${p.size})</strong><br>
                            <span style="color:#b12704; font-weight:bold;">₹${p.currPrice}</span> 
                            <span style="text-decoration:line-through; color:#777; font-size:12px;">₹${p.oldPrice}</span><br>
                            <span style="font-size:12px; color:#555;">${p.pieces}</span>
                        </div>
                        <button class="delete-btn" onclick="deleteProduct(${p.id})">ಡಿಲೀಟ್</button>
                    </div>
                `;
            });
        }

        function deleteProduct(id) {
            if (confirm("ಈ ವಸ್ತುವನ್ನು ಡಿಲೀಟ್ ಮಾಡಲು ಬಯಸುತ್ತೀರಾ?")) {
                shopProducts = shopProducts.filter(p => p.id !== id);
                localStorage.setItem('ar_shop_products', JSON.stringify(shopProducts));
                renderOwnerProducts();
                renderCustomerProducts();
                alert("ವಸ್ತು ಯಶಸ್ವಿಯಾಗಿ ಡಿಲೀಟ್ ಆಗಿದೆ.");
            }
        }

        function renderCustomerProducts() {
            let container = document.getElementById('customer-products-container');
            container.innerHTML = '';
            if (shopProducts.length === 0) {
                container.innerHTML = '<p style="color:#666; text-align:center; padding:20px;">ಯಾವುದೇ ವಸ್ತುಗಳು ಲಭ್ಯವಿಲ್ಲ.</p>';
                return;
            }
            shopProducts.forEach((p) => {
                container.innerHTML += `
                    <div class="cust-product-card">
                        <img src="${p.frontImg}" alt="${p.name}" class="product-full-img">
                        <h2 style="font-size:18px; font-weight:600; margin-bottom:6px;">${p.name}</h2>
                        <div style="font-size:22px; font-weight:700; color:#0F1111; margin-bottom:8px;">
                            ₹${p.currPrice} 
                            <span style="text-decoration:line-through; color:#565959; font-size:14px; font-weight:normal;">₹${p.oldPrice}</span>
                        </div>
                        <p style="color:#007600; font-size:14px; font-weight:bold; margin-bottom:10px;">ಉಚಿತ ಡೆಲಿವರಿ ಲಭ್ಯವಿದೆ (${p.size} - ${p.pieces})</p>
                        <button class="btn-buy-now" onclick="placeCustomerOrder('${p.name}', '${p.currPrice}', '${p.size}')">₹${p.currPrice} ಗೆ ಈಗಲೇ ಖರೀದಿಸಿ</button>
                    </div>
                `;
            });
        }

        function placeCustomerOrder(prodName, price, size) {
            let newOrder = {
                id: 'ORD' + Math.floor(100000 + Math.random() * 900000),
                title: prodName,
                size: size,
                amount: price,
                customer: {
                    name: 'ಅನಿಲ್ ರಾಥೋಡ್',
                    phone: '8105010768',
                    village: 'ಶಹಾಪುರ',
                    taluk: 'ಶಹಾಪುರ',
                    district: 'ಯಾದಗಿರಿ',
                    gps: 'Lat: 16.7390, Lng: 76.7977'
                },
                status: 'ಆರ್ಡರ್ ಕನ್ಫರ್ಮ್ ಆಗಿದೆ'
            };

            ownerOrders.unshift(newOrder); // New order on top
            localStorage.setItem('ar_owner_orders', JSON.stringify(ownerOrders));
            alert("ಆರ್ಡರ್ ಯಶಸ್ವಿಯಾಗಿ ಕನ್ಫರ್ಮ್ ಆಗಿದೆ ಹಾಗೂ ಅಂಗಡಿ ಮಾಲೀಕರಿಗೆ ಕಳುಹಿಸಲಾಗಿದೆ!");
        }

        function renderIncomingOrders() {
            let container = document.getElementById('owner-incoming-orders-list');
            container.innerHTML = '';
            if (ownerOrders.length === 0) {
                container.innerHTML = '<p style="color:#666; font-size:13px;">ಯಾವುದೇ ಹೊಸ ಆರ್ಡರ್‌ಗಳು ಬಂದಿಲ್ಲ.</p>';
                return;
            }
            ownerOrders.forEach((ord) => {
                container.innerHTML += `
                    <div class="owner-order-card">
                        <strong>ಗ್ರಾಹಕರು: ${ord.customer.name} (${ord.customer.phone})</strong><br>
                        <span style="font-size:13px;">ವಿಳಾಸ: ${ord.customer.village}, ${ord.customer.taluk}</span><br>
                        <span style="font-size:13px; color:#007bff;">GPS: ${ord.customer.gps}</span><br>
                        <span style="font-size:13px; font-weight:bold;">ವಸ್ತು: ${ord.title} (ಮೊತ್ತ: ₹${ord.amount})</span><br>
                        <span style="font-size:13px; color:var(--green-success); font-weight:bold;">ಸ್ಥಿತಿ: ${ord.status}</span>
                    </div>
                `;
            });
        }

        function openMyOrders() {
            let container = document.getElementById('customer-orders-list');
            container.innerHTML = '';
            if (ownerOrders.length === 0) {
                container.innerHTML = '<p style="color:#666; text-align:center; padding:20px;">ಯಾವುದೇ ಆರ್ಡರ್‌ಗಳು ಮಾಡಿಲ್ಲ.</p>';
            } else {
                ownerOrders.forEach(ord => {
                    container.innerHTML += `
                        <div class="card-box" style="background:#fff; border-radius:8px; margin-bottom:10px;">
                            <strong>${ord.title}</strong><br>
                            <span style="font-size:13px; color:#555;">ಆರ್ಡರ್ ಐಡಿ: ${ord.id} | ಸೈಜ್: ${ord.size}</span><br>
                            <span style="font-size:14px; font-weight:bold;">ಮೊತ್ತ: ₹${ord.amount}</span><br>
                            <span style="font-size:12px; color:var(--green-success); font-weight:bold;">ಸ್ಥಿತಿ: ${ord.status}</span>
                        </div>
                    `;
                });
            }
            switchScreen('screen-my-orders');
        }
    </script>
</body>
</html>
