<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಶಹಾಪುರ ಮಾರ್ಕೆಟ್ - ಅಂಗಡಿ ಮಾಲೀಕರ ಆಪ್</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- ಫೋಟೋ ಜೂಮ್ ಪಾಪ್‌ಅಪ್ -->
    <div id="image-modal" class="fixed inset-0 bg-black bg-opacity-80 z-50 hidden flex items-center justify-center p-4">
        <div class="relative bg-white p-2 rounded-2xl max-w-sm w-full text-center">
            <button onclick="closeImageModal()" class="absolute top-2 right-2 bg-red-500 text-white w-8 h-8 rounded-full font-bold">✕</button>
            <img id="zoomed-img" src="" class="w-full h-96 object-contain rounded-xl">
        </div>
    </div>

    <!-- ಸಕ್ಸಸ್ ಪಾಪ್‌ಅಪ್ -->
    <div id="custom-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-2xl shadow-2xl max-w-sm w-full text-center space-y-3">
            <div id="modal-icon" class="text-4xl">🎉</div>
            <h3 id="modal-title" class="text-lg font-bold text-gray-800">ಯಶಸ್ವಿ!</h3>
            <p id="modal-message" class="text-xs text-gray-600"></p>
            <button onclick="closeModal()" class="w-full bg-indigo-600 text-white py-2 rounded-xl font-bold text-xs">ಸರಿ (OK)</button>
        </div>
    </div>

    <!-- ಹೆಡರ್ -->
    <header class="bg-indigo-700 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-40">
        <h1 class="text-sm font-bold">🏪 ಶಹಾಪುರ ಮಾರ್ಕೆಟ್ (ಅಂಗಡಿ ಮಾಲೀಕರು)</h1>
        <div id="user-info" class="text-xs hidden items-center gap-2">
            <span id="logged-user-name" class="font-semibold"></span>
            <button onclick="logout()" class="bg-red-500 px-2 py-1 rounded">ಲಾಗ್‌ಔಟ್</button>
        </div>
    </header>

    <main class="container mx-auto p-4 max-w-md">

        <!-- ೧. ನೋಂದಣಿ ಅಥವಾ ಲಾಗಿನ್ ಪೇಜ್ -->
        <div id="auth-screen" class="bg-white p-6 rounded-2xl shadow-lg space-y-4 page-section">
            <h2 class="text-xl font-bold text-gray-800 border-b pb-2">ಅಂಗಡಿ ಮಾಲೀಕರ ನೋಂದಣಿ</h2>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-gray-700">ನಿಮ್ಮ ಹೆಸರು</label>
                    <input type="text" id="reg-name" placeholder="ಮಾಲೀಕರ ಹೆಸರು ನಮೂದಿಸಿ" class="w-full p-2 border rounded-lg text-sm mt-1">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700">ಮೊಬೈಲ್ ನಂಬರ್</label>
                    <input type="tel" id="reg-phone" placeholder="10 ಅಂಕಿಯ ಮೊಬೈಲ್ ನಂಬರ್" maxlength="10" class="w-full p-2 border rounded-lg text-sm mt-1">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700">ಅಂಗಡಿಯ ಹೆಸರು</label>
                    <input type="text" id="reg-shopname" placeholder="ಉದಾ: ಶ್ರೀ ಸಾಯಿ ಬಟ್ಟೆ ಅಂಗಡಿ" class="w-full p-2 border rounded-lg text-sm mt-1">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700">ಅಂಗಡಿಯ ವಿಧ (Shop Category)</label>
                    <select id="reg-category" class="w-full p-2 border rounded-lg text-sm mt-1">
                        <option value="Clothing">ಬಟ್ಟೆ ಅಂಗಡಿ (Clothing)</option>
                        <option value="Footwear">ಶೂಸ್ & ಚಪ್ಪಲಿ ಅಂಗಡಿ (Footwear)</option>
                        <option value="Gifts">ಗಿಫ್ಟ್ ಅಂಗಡಿ (Gift Shop)</option>
                        <option value="General">ಜನರಲ್ ಸ್ಟೋರ್ / ಇತರೆ</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">ಅಂಗಡಿಯ ಮುಂಭಾಗದ ಫೋಟೋ (Shop Photo)</label>
                    <input type="file" id="reg-shopphoto" accept="image/*" capture="environment" class="w-full p-1 border rounded-lg text-xs">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="reg-district" placeholder="ಜಿಲ್ಲೆ" class="p-2 border rounded-lg text-sm" value="ಯಾದಗಿರಿ">
                    <input type="text" id="reg-taluk" placeholder="ತಾಲೂಕು" class="p-2 border rounded-lg text-sm" value="ಶಹಾಪುರ">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="reg-city" placeholder="ಊರು / ಗ್ರಾಮ" class="p-2 border rounded-lg text-sm" value="ಶಹಾಪುರ">
                    <input type="text" id="reg-pincode" placeholder="ಪಿನ್ ಕೋಡ್" maxlength="6" class="p-2 border rounded-lg text-sm" value="585223">
                </div>
                <div>
                    <button onclick="getLocation()" class="w-full bg-teal-600 text-white py-2 rounded-xl text-xs font-bold mb-2">📍 ಜಿಪಿಎಸ್ ಲೊಕೇಶನ್ ಟ್ರ್ಯಾಕ್ ಮಾಡಿ</button>
                    <p id="loc-status" class="text-[11px] text-gray-500 text-center">ಲೊಕೇಶನ್ ಸಿಕ್ಕಿಲ್ಲ</p>
                </div>

                <button onclick="registerVendor()" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-bold text-sm shadow">ಖಾತೆ ಸೃಷ್ಟಿಸಿ & ಮುಂದುವರಿಸಿ</button>
            </div>
        </div>

        <!-- ೨. ಅಂಗಡಿ ಮಾಲೀಕರ ಮುಖ್ಯ ಡ್ಯಾಶ್‌ಬೋರ್ಡ್ -->
        <div id="dashboard-vendor" class="space-y-4 hidden page-section">
            
            <!-- ಟ್ಯಾಬ್ ಬಟನ್‌ಗಳು -->
            <div class="flex gap-2 mb-2">
                <button onclick="switchVendorTab('upload')" id="tab-upload" class="flex-1 bg-indigo-600 text-white py-2 rounded-xl text-xs font-bold">📸 ಫೋಟೋ ಅಪ್ಲೋಡ್ ಮಾಡಿ</button>
                <button onclick="switchVendorTab('orders')" id="tab-orders" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded-xl text-xs font-bold">📦 ಹೊಸ ಆರ್ಡರ್‌ಗಳು ನೋಡಿ</button>
            </div>

            <!-- ಸೆಕ್ಷನ್ 1: ಫೋಟೋ ಅಪ್ಲೋಡ್ -->
            <div id="vendor-upload-section" class="space-y-4">
                <div class="bg-white p-4 rounded-xl shadow space-y-3">
                    <h3 class="font-bold text-base text-gray-800 border-b pb-1">➕ ಹೊಸ ವಸ್ತುವಿನ ವಿವರ ಮತ್ತು ಫೋಟೋ ಅಪ್ಲೋಡ್</h3>
                    
                    <input type="text" id="v-p-name" placeholder="ವಸ್ತುವಿನ ಹೆಸರು (ಉದಾ: ಜೀನ್ಸ್ ಪ್ಯಾಂಟ್ / ಶೂ)" class="w-full p-2 border rounded-lg text-sm">
                    
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="v-p-orig" placeholder="ಹಿಂದಿನ ಬೆಲೆ (₹)" class="p-2 border rounded-lg text-sm">
                        <input type="number" id="v-p-disc" placeholder="ಡಿಸ್ಕೌಂಟ್ ಬೆಲೆ (₹)" class="p-2 border rounded-lg text-sm">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="v-p-colors" placeholder="ಬಣ್ಣಗಳು (ಉದಾ: Red, Blue)" class="p-2 border rounded-lg text-xs">
                        <input type="number" id="v-p-stock" placeholder="ಸ್ಟಾಕ್ (ಎಷ್ಟು ಪೀಸ್)" class="p-2 border rounded-lg text-xs">
                    </div>

                    <div>
                        <label class="block text-xs text-gray-600 mb-1">ಲಭ್ಯವಿರುವ ಸೈಜ್‌ಗಳು:</label>
                        <div class="flex gap-1">
                            <span onclick="toggleSize('XS')" id="sz-XS" class="px-3 py-1 border rounded text-xs cursor-pointer bg-gray-100">XS</span>
                            <span onclick="toggleSize('S')" id="sz-S" class="px-3 py-1 border rounded text-xs cursor-pointer bg-gray-100">S</span>
                            <span onclick="toggleSize('M')" id="sz-M" class="px-3 py-1 border rounded text-xs cursor-pointer bg-indigo-600 text-white">M</span>
                            <span onclick="toggleSize('L')" id="sz-L" class="px-3 py-1 border rounded text-xs cursor-pointer bg-gray-100">L</span>
                            <span onclick="toggleSize('XL')" id="sz-XL" class="px-3 py-1 border rounded text-xs cursor-pointer bg-gray-100">XL</span>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs text-gray-600 mb-1">ಮುಂಭಾಗದ ಫೋಟೋ (Front Camera)</label>
                        <input type="file" id="v-p-front" accept="image/*" capture="environment" class="w-full p-1 border rounded-lg text-xs">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-600 mb-1">ಹಿಂಭಾಗದ ಫೋಟೋ (Back Camera)</label>
                        <input type="file" id="v-p-back" accept="image/*" capture="environment" class="w-full p-1 border rounded-lg text-xs">
                    </div>

                    <button onclick="addVendorProduct()" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-bold text-xs shadow">ವಸ್ತು ಅಪ್‌ಲೋಡ್ ಮಾಡಿ</button>
                </div>

                <div class="bg-white p-4 rounded-xl shadow space-y-3">
                    <h3 class="font-bold text-sm text-gray-800 border-b pb-1">🖼️ ನೀವು ಅಪ್‌ಲೋಡ್ ಮಾಡಿದ ವಸ್ತುಗಳು (ಸ್ಟಾಕ್ / ಡಿಲೀಟ್)</h3>
                    <div id="vendor-my-products" class="space-y-2 text-xs text-gray-600">ಯಾವುದೇ ವಸ್ತುಗಳಿಲ್ಲ.</div>
                </div>
            </div>

            <!-- ಸೆಕ್ಷನ್ 2: ಹೊಸ ಆರ್ಡರ್‌ಗಳು ಮತ್ತು ಡೆಲಿವರಿ ಮ್ಯಾನೇಜ್‌ಮೆಂಟ್ -->
            <div id="vendor-orders-section" class="space-y-4 hidden">
                <div class="bg-white p-4 rounded-xl shadow space-y-3">
                    <h3 class="font-bold text-sm text-gray-800 border-b pb-1">📦 ಗ್ರಾಹಕರ ಹೊಸ ಆರ್ಡರ್‌ಗಳು ಹಾಗೂ ಡೆಲಿವರಿ ಸ್ಟೇಟಸ್</h3>
                    <div id="vendor-orders-list" class="text-xs text-gray-600">ಯಾವುದೇ ಹೊಸ ಆರ್ಡರ್‌ಗಳಿಲ್ಲ.</div>
                </div>
            </div>

        </div>

    </main>

    <script>
        let currentVendor = JSON.parse(localStorage.getItem('currentVendor')) || null;
        let products = JSON.parse(localStorage.getItem('market_products')) || [];
        let selectedProductSize = 'M';
        let gpsLocation = { lat: '', lng: '' };

        function playSiren() {
            try {
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch (e) {
                console.log("Audio not supported");
            }
        }

        function showModal(title, message, icon = '🎉') {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal-icon').innerText = icon;
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
            checkLogin();
        }

        function zoomImage(src) {
            document.getElementById('zoomed-img').src = src;
            document.getElementById('image-modal').classList.remove('hidden');
        }

        function closeImageModal() {
            document.getElementById('image-modal').classList.add('hidden');
        }

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    gpsLocation.lat = position.coords.latitude;
                    gpsLocation.lng = position.coords.longitude;
                    let statEl = document.getElementById('loc-status');
                    statEl.innerText = `ಲೊಕೇಶನ್ ಸಿಕ್ಕಿದೆ (Lat: ${gpsLocation.lat.toFixed(2)}, Lng: ${gpsLocation.lng.toFixed(2)})`;
                    statEl.className = "text-[11px] text-green-600 text-center font-bold";
                }, error => {
                    alert('ಲೊಕೇಶನ್ ಪಡೆಯಲು ಸಾಧ್ಯವಾಗಿಲ್ಲ. ಜಿಪಿಎಸ್ ಆನ್ ಮಾಡಿ.');
                });
            } else {
                alert('ನಿಮ್ಮ ಬ್ರೌಸರ್ ಜಿಪಿಎಸ್ ಸಪೋರ್ಟ್ ಮಾಡುವುದಿಲ್ಲ.');
            }
        }

        function toggleSize(size) {
            selectedProductSize = size;
            ['XS', 'S', 'M', 'L', 'XL'].forEach(s => {
                let el = document.getElementById(`sz-${s}`);
                if (s === size) {
                    el.className = "px-3 py-1 border rounded text-xs cursor-pointer bg-indigo-600 text-white";
                } else {
                    el.className = "px-3 py-1 border rounded text-xs cursor-pointer bg-gray-100";
                }
            });
        }

        function switchVendorTab(tab) {
            if (tab === 'upload') {
                document.getElementById('vendor-upload-section').classList.remove('hidden');
                document.getElementById('vendor-orders-section').classList.add('hidden');
                document.getElementById('tab-upload').className = "flex-1 bg-indigo-600 text-white py-2 rounded-xl text-xs font-bold";
                document.getElementById('tab-orders').className = "flex-1 bg-gray-200 text-gray-700 py-2 rounded-xl text-xs font-bold";
            } else {
                document.getElementById('vendor-upload-section').classList.add('hidden');
                document.getElementById('vendor-orders-section').classList.remove('hidden');
                document.getElementById('tab-orders').className = "flex-1 bg-indigo-600 text-white py-2 rounded-xl text-xs font-bold";
                document.getElementById('tab-upload').className = "flex-1 bg-gray-200 text-gray-700 py-2 rounded-xl text-xs font-bold";
                renderVendorOrders();
            }
        }

        function checkLogin() {
            if (!currentVendor) {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('dashboard-vendor').classList.add('hidden');
                document.getElementById('user-info').classList.add('hidden');
            } else {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('dashboard-vendor').classList.remove('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('logged-user-name').innerText = `${currentVendor.name} (${currentVendor.shopName})`;
                renderVendorProducts();
            }
        }

        function compressImage(file, callback) {
            let reader = new FileReader();
            reader.onload = function (e) {
                let img = new Image();
                img.onload = function () {
                    let canvas = document.createElement('canvas');
                    let ctx = canvas.getContext('2d');
                    let MAX_WIDTH = 500;
                    let MAX_HEIGHT = 500;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.7));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function registerVendor() {
            let name = document.getElementById('reg-name').value;
            let phone = document.getElementById('reg-phone').value;
            let shopName = document.getElementById('reg-shopname').value;
            let category = document.getElementById('reg-category').value;
            let district = document.getElementById('reg-district').value;
            let taluk = document.getElementById('reg-taluk').value;
            let city = document.getElementById('reg-city').value;
            let pincode = document.getElementById('reg-pincode').value;
            let shopPhotoFile = document.getElementById('reg-shopphoto').files[0];

            if (!name || !phone || !shopName || phone.length < 10) {
                alert('ದಯವಿಟ್ಟು ಎಲ್ಲಾ ಸರಿಯಾದ ವಿವರಗಳನ್ನು ಭರ್ತಿ ಮಾಡಿ!');
                return;
            }

            if (!shopPhotoFile) {
                showModal("ಎಚ್ಚರಿಕೆ!", "ದಯವಿಟ್ಟು ನಿಮ್ಮ ಅಂಗಡಿಯ ಫೋಟೋ ಅಪ್ಲೋಡ್ ಮಾಡಿ!", "⚠️");
                return;
            }

            compressImage(shopPhotoFile, function(compressedShopPhoto) {
                currentVendor = { 
                    name, phone, shopName, category, district, taluk, city, pincode, 
                    shopPhoto: compressedShopPhoto, gps: gpsLocation 
                };
                localStorage.setItem('currentVendor', JSON.stringify(currentVendor));
                showModal("ಯಶಸ್ವಿ!", "ನಿಮ್ಮ ಅಂಗಡಿ ಖಾತೆ ಯಶಸ್ವಿಯಾಗಿ ಸೃಷ್ಟಿಯಾಗಿದೆ!", "🏪");
            });
        }

        function logout() {
            localStorage.removeItem('currentVendor');
            currentVendor = null;
            checkLogin();
        }

        function addVendorProduct() {
            let name = document.getElementById('v-p-name').value;
            let origPrice = document.getElementById('v-p-orig').value;
            let discPrice = document.getElementById('v-p-disc').value;
            let colors = document.getElementById('v-p-colors').value;
            let stock = document.getElementById('v-p-stock').value;
            let frontFile = document.getElementById('v-p-front').files[0];
            let backFile = document.getElementById('v-p-back').files[0];

            if (!name || !origPrice || !discPrice) {
                alert('ದಯವಿಟ್ಟು ವಸ್ತುವಿನ ಹೆಸರು ಮತ್ತು ಬೆಲೆಗಳನ್ನು ಭರ್ತಿ ಮಾಡಿ!');
                return;
            }

            if (!frontFile || !backFile) {
                showModal("ಎಚ್ಚರಿಕೆ!", "ದಯವಿಟ್ಟು ಮುಂಭಾಗ ಮತ್ತು ಹಿಂಭಾಗದ ಎರಡೂ ಫೋಟೋಗಳನ್ನು ಅಪ್‌ಲೋಡ್ ಮಾಡಿ!", "⚠️");
                return;
            }

            compressImage(frontFile, function(frontCompressed) {
                compressImage(backFile, function(backCompressed) {
                    let newProd = {
                        id: Date.now(),
                        name: name,
                        category: currentVendor.category,
                        origPrice: Number(origPrice),
                        discPrice: Number(discPrice),
                        colors: colors || 'Standard',
                        size: selectedProductSize,
                        stock: Number(stock) || 1,
                        vendorShop: currentVendor.shopName,
                        vendorPhone: currentVendor.phone,
                        frontPhoto: frontCompressed,
                        backPhoto: backCompressed
                    };

                    products.push(newProd);
                    localStorage.setItem('market_products', JSON.stringify(products));
                    
                    document.getElementById('v-p-name').value = '';
                    document.getElementById('v-p-orig').value = '';
                    document.getElementById('v-p-disc').value = '';
                    document.getElementById('v-p-colors').value = '';
                    document.getElementById('v-p-stock').value = '';
                    document.getElementById('v-p-front').value = '';
                    document.getElementById('v-p-back').value = '';

                    renderVendorProducts();
                    showModal("ಯಶಸ್ವಿ!", "ನಿಮ್ಮ ಫೋಟೋ ಅಪ್ಲೋಡ್ ಆಗಿದೆ! ವಸ್ತು ಗ್ರಾಹಕರಿಗೆ ಈಗ ಲಭ್ಯವಿದೆ.", "📸");
                });
            });
        }

        function renderVendorProducts() {
            let listDiv = document.getElementById('vendor-my-products');
            let myProducts = products.filter(p => p.vendorPhone === currentVendor.phone);

            if (myProducts.length === 0) {
                listDiv.innerHTML = "ನೀವು ಯಾವುದೇ ವಸ್ತುಗಳನ್ನು ಅಪ್‌ಲೋಡ್ ಮಾಡಿಲ್ಲ.";
                return;
            }

            listDiv.innerHTML = myProducts.map(p => `
                <div class="border p-2 rounded-lg bg-gray-50 flex items-center justify-between gap-2">
                    <div class="flex gap-1">
                        <img src="${p.frontPhoto}" onclick="zoomImage('${p.frontPhoto}')" class="w-10 h-10 object-cover rounded border cursor-pointer">
                        <img src="${p.backPhoto}" onclick="zoomImage('${p.backPhoto}')" class="w-10 h-10 object-cover rounded border cursor-pointer">
                    </div>
                    <div class="flex-1">
                        <p class="font-bold text-xs">${p.name} (${p.size})</p>
                        <p class="text-[10px] text-green-600">₹${p.discPrice} | ಸ್ಟಾಕ್: ${p.stock}</p>
                    </div>
                    <button onclick="deleteProduct(${p.id})" class="bg-red-500 text-white px-2 py-1 rounded text-[10px] font-bold">ಡಿಲೀಟ್</button>
                </div>
            `).join('');
        }

        function deleteProduct(id) {
            if (confirm('ಈ ವಸ್ತುವನ್ನು ಡಿಲೀಟ್ ಮಾಡಲು ಬಯಸುತ್ತೀರಾ?')) {
                products = products.filter(p => p.id !== id);
                localStorage.setItem('market_products', JSON.stringify(products));
                renderVendorProducts();
                showModal("ಯಶಸ್ವಿ!", "ವಸ್ತು ಯಶಸ್ವಿಯಾಗಿ ಡಿಲೀಟ್ ಆಗಿದೆ.", "🗑️");
            }
        }

        function renderVendorOrders() {
            let ordDiv = document.getElementById('vendor-orders-list');
            let savedOrders = JSON.parse(localStorage.getItem('market_orders')) || [];
            let myOrders = savedOrders.filter(o => !o.acceptedByVendor || o.acceptedByVendor === currentVendor.shopName);

            myOrders.reverse();

            if (myOrders.length === 0) {
                ordDiv.innerHTML = "ಯಾವುದೇ ಹೊಸ ಆರ್ಡರ್‌ಗಳಿಲ್ಲ.";
            } else {
                ordDiv.innerHTML = myOrders.map(o => `
                    <div class="border p-3 rounded-xl bg-amber-50 space-y-2 mb-2">
                        <div class="flex justify-between items-center border-b pb-1">
                            <span class="font-bold text-xs text-indigo-700">ಆರ್ಡರ್ ID: ${o.id}</span>
                            <span class="text-[10px] bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded font-bold">ಪಾವತಿ: ${o.paymentMethod}</span>
                        </div>

                        ${o.items.map(i => `
                            <div class="flex gap-2 items-center">
                                <img src="${i.frontPhoto}" onclick="zoomImage('${i.frontPhoto}')" class="w-12 h-12 object-cover rounded border cursor-pointer">
                                <div>
                                    <p class="font-bold text-xs">${i.name} (<span class="text-red-600 font-bold">ಸೈಜ್: ${i.size}</span>) x${i.quantity}</p>
                                    <p class="text-[11px] text-green-600 font-bold">₹${i.discPrice * i.quantity}</p>
                                </div>
                            </div>
                        `).join('')}

                        <div class="text-[11px] text-gray-700 space-y-0.5 pt-1 border-t">
                            <p><b>ಗ್ರಾಹಕರ ಹೆಸರು:</b> ${o.customerName} (<a href="tel:${o.phone}" class="text-blue-600 underline font-bold">📞 ${o.phone}</a>)</p>
                            <p><b>ಪೂರ್ಣ ವಿಳಾಸ:</b> ${o.city}, ${o.taluk} ತಾಲೂಕು, ${o.district} ಜಿಲ್ಲೆ (Pin: ${o.pincode})</p>
                        </div>

                        <p><b>ಪಾವತಿ ಸ್ಥಿತಿ:</b> <span class="${o.paymentSuccess ? 'text-green-600 font-bold' : 'text-orange-600 font-bold'}">${o.paymentSuccess ? 'ಪಾವತಿ ಯಶಸ್ವಿ (Success)' : 'ಪೇಮೆಂಟ್ ಪೆಂಡಿಂಗ್ (Pending)'}</span></p>
                        <p><b>ಸ್ಥಿತಿ (Status):</b> <span class="text-orange-600 font-bold">${o.status}</span></p>
                        
                        ${o.isReturned ? `<div class="bg-red-100 p-2 rounded text-red-700 font-bold text-xs">🔄 ರಿಟರ್ನ್ ಬಂದಿದೆ: ${o.returnReason}</div>` : ''}

                        <div class="flex flex-wrap gap-2 pt-1">
                            <a href="https://maps.google.com/?q=${encodeURIComponent(o.address)}" target="_blank" class="bg-indigo-600 text-white px-3 py-1.5 rounded text-xs font-bold">🗺️ ಮ್ಯಾಪ್ ಲೊಕೇಶನ್</a>
                            
                            ${!o.acceptedByVendor ? `<button onclick="acceptOrder(${o.id})" class="bg-green-600 text-white px-3 py-1.5 rounded text-xs font-bold">✅ ಆರ್ಡರ್ ಸ್ವೀಕರಿಸಿ</button>` : ''}
                            
                            ${o.acceptedByVendor && !o.packingReady ? `<button onclick="markPackingReady(${o.id})" class="bg-blue-600 text-white px-3 py-1.5 rounded text-xs font-bold">📦 ಪ್ಯಾಕಿಂಗ್ ಆಗಿದೆ (OK)</button>` : ''}
                            
                            ${o.packingReady && !o.delivered ? `<button onclick="markDispatched(${o.id})" class="bg-purple-600 text-white px-3 py-1.5 rounded text-xs font-bold">🚀 ಡೆಲಿವರಿಗೆ ಕಳುಹಿಸಲಾಗಿದೆ (OK)</button>` : ''}

                            ${o.delivered && !o.paymentSuccess ? `<button onclick="markPaymentSuccess(${o.id})" class="bg-green-700 text-white px-3 py-1.5 rounded text-xs font-bold">💰 ಪೇಮೆಂಟ್ ಸಕ್ಸಸ್ (OK)</button>` : ''}
                            
                            ${o.paymentSuccess ? `<span class="text-green-700 font-bold text-xs">✨ ಪಾವತಿ & ಡೆಲಿವರಿ ಯಶಸ್ವಿ (Success)</span>` : ''}
                        </div>
                    </div>
                `).join('');
            }
        }

        function acceptOrder(id) {
            playSiren();
            let savedOrders = JSON.parse(localStorage.getItem('market_orders')) || [];
            let o = savedOrders.find(x => x.id === id);
            if (o) {
                o.acceptedByVendor = currentVendor.shopName;
                o.status = 'ಸ್ವೀಕರಿಸಲಾಗಿದೆ - ಪ್ಯಾಕಿಂಗ್ ನಡೆಯುತ್ತಿದೆ';
                localStorage.setItem('market_orders', JSON.stringify(savedOrders));
                renderVendorOrders();
                showModal("ಯಶಸ್ವಿ!", "ಬುಕಿಂಗ್ ಸ್ವೀಕರಿಸಲಾಗಿದೆ!", "👍");
            }
        }

        function markPackingReady(id) {
            let savedOrders = JSON.parse(localStorage.getItem('market_orders')) || [];
            let o = savedOrders.find(x => x.id === id);
            if (o) {
                o.packingReady = true;
                o.status = 'ಪ್ಯಾಕಿಂಗ್ ಆಗಿದೆ - ಡೆಲಿವರಿ ಬಾಯ್‌ಗೆ ತಿಳಿಸಲಾಗಿದೆ';
                localStorage.setItem('market_orders', JSON.stringify(savedOrders));
                renderVendorOrders();
                showModal("ಸಿದ್ಧವಾಗಿದೆ!", "ಪ್ಯಾಕಿಂಗ್ ಆಗಿದೆ ಎಂದು ಡೆಲಿವರಿ ಬಾಯ್‌ಗೆ ಸಂದೇಶ ಕಳುಹಿಸಲಾಗಿದೆ!", "📦");
            }
        }

        function markDispatched(id) {
            let savedOrders = JSON.parse(localStorage.getItem('market_orders')) || [];
            let o = savedOrders.find(x => x.id === id);
            if (o) {
                o.status = 'ಡೆಲಿವರಿಗೆ ಕಳುಹಿಸಲಾಗಿದೆ (Out for Delivery)';
                localStorage.setItem('market_orders', JSON.stringify(savedOrders));
                renderVendorOrders();
                showModal("ಯಶಸ್ವಿ!", "ಡೆಲಿವರಿಗೆ ಕಳುಹಿಸಲಾಗಿದೆ ಎಂದು ಅಪ್‌ಡೇಟ್ ಮಾಡಲಾಗಿದೆ!", "🚀");
            }
        }

        function markPaymentSuccess(id) {
            let savedOrders = JSON.parse(localStorage.getItem('market_orders')) || [];
            let o = savedOrders.find(x => x.id === id);
            if (o) {
                o.paymentSuccess = true;
                o.status = 'ಪಾವತಿ & ಡೆಲಿವರಿ ಯಶಸ್ವಿಯಾಗಿದೆ (Success)';
                localStorage.setItem('market_orders', JSON.stringify(savedOrders));
                renderVendorOrders();
                showModal("ಯಶಸ್ವಿ!", "ಪೇಮೆಂಟ್ ಸಕ್ಸಸ್ ಮಾಡಲಾಗಿದೆ!", "💰");
            }
        }

        checkLogin();
    </script>
</body>
</html>
