<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಶಹಾಪುರ ಮಾರ್ಕೆಟ್ (ಅಂಗಡಿ ಮಾಲೀಕರು)</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding-bottom: 30px;
        }

        /* Header */
        .header {
            background-color: #4a3aff;
            color: white;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            position: relative;
        }

        .header h2 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .logout-btn {
            position: absolute;
            right: 15px;
            top: 15px;
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            display: none;
        }

        .container {
            max-width: 500px;
            margin: 15px auto;
            padding: 0 15px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 18px;
            color: #2c3e50;
            margin-bottom: 15px;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .row .form-group {
            flex: 1;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-primary {
            background-color: #4a3aff;
            color: white;
        }

        .btn-success {
            background-color: #2ed573;
            color: white;
        }

        /* Nav Buttons */
        .dashboard-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .nav-action-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            background: #e4e7eb;
            color: #333;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: 0.2s;
        }

        .nav-action-btn.active {
            background: #4a3aff;
            color: white;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: #e4e7eb;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            color: #555;
        }

        .tab-btn.active {
            background: #4a3aff;
            color: white;
        }

        /* Product Cards */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .product-card {
            background: white;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            position: relative;
            text-align: center;
            border: 1px solid #eee;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .img-box {
            width: 100%;
            height: 130px;
            background-color: #f8fafc;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 6px;
            border: 1px dashed #cbd5e1;
        }

        .product-card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 4px;
        }

        .product-title {
            font-weight: bold;
            font-size: 14px;
            margin: 5px 0;
            word-break: break-word;
        }

        .product-price {
            font-size: 12px;
            color: #2ed573;
            font-weight: bold;
        }

        .product-old-price {
            text-decoration: line-through;
            color: #888;
            font-size: 11px;
            margin-right: 5px;
        }

        .delete-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 8px;
            width: 100%;
            font-weight: bold;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            max-width: 350px;
            width: 85%;
        }

        .modal-content h3 {
            color: #2ed573;
            margin-bottom: 10px;
        }

        .id-badge {
            background: #4a3aff;
            color: white;
            font-size: 24px;
            font-weight: bold;
            padding: 10px;
            border-radius: 8px;
            margin: 15px 0;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>🏪 ಶಹಾಪುರ ಮಾರ್ಕೆಟ್</h2>
        <p style="font-size: 12px;">ಅಂಗಡಿ ಮಾಲೀಕರ ಆಪ್</p>
        <button class="logout-btn" id="logoutBtn" onclick="logout()">ಬಾಹಿರ (Logout)</button>
    </div>

    <div class="container">

        <!-- SECTION 1: LOGIN & REGISTRATION -->
        <div id="authSection">
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchAuthTab('register')">ಹೊಸ ನೋಂದಣಿ</button>
                <button class="tab-btn" onclick="switchAuthTab('login')">ಐಡಿ ಮೂಲಕ ಲಾಗಿನ್</button>
            </div>

            <!-- Registration Form -->
            <div id="registerForm" class="card">
                <h3 class="card-title">ಅಂಗಡಿ ಮಾಲೀಕರ ನೋಂದಣಿ</h3>
                
                <div class="form-group">
                    <label>ಮಾಲೀಕರ ಹೆಸರು:</label>
                    <input type="text" id="regName" placeholder="ನಿಮ್ಮ ಹೆಸರು ನಮೂದಿಸಿ">
                </div>

                <div class="form-group">
                    <label>ಮೊಬೈಲ್ ಸಂಖ್ಯೆ:</label>
                    <input type="tel" id="regPhone" placeholder="10 ಅಂಕಿಗಳ ಮೊಬೈಲ್ ಸಂಖ್ಯೆ">
                </div>

                <div class="form-group">
                    <label>ಅಂಗಡಿಯ ಹೆಸರು:</label>
                    <input type="text" id="regShopName" placeholder="ಅಂಗಡಿಯ ಹೆಸರು ಹಾಕಿ">
                </div>

                <div class="form-group">
                    <label>ಅಂಗಡಿಯ ವಿಧ (Category):</label>
                    <select id="regCategory">
                        <option value="ಬಟ್ಟೆ ಅಂಗಡಿ">ಬಟ್ಟೆ ಅಂಗಡಿ (Clothing)</option>
                        <option value="ಚಪ್ಪಲಿ & ಶೂಸ್ ಅಂಗಡಿ">ಚಪ್ಪಲಿ & ಶೂಸ್ ಅಂಗಡಿ</option>
                        <option value="ಗಿಫ್ಟ್ ಅಂಗಡಿ">ಗಿಫ್ಟ್ ಅಂಗಡಿ</option>
                        <option value="ಎಲೆಕ್ಟ್ರಿಸಿಟಿ & ಇಲೆಕ್ಟ್ರಾನಿಕ್ಸ್">ಎಲೆಕ್ಟ್ರಿಸಿಟಿ & ಇಲೆಕ್ಟ್ರಾನಿಕ್ಸ್</option>
                        <option value="ಇತರೆ">ಇತರೆ</option>
                    </select>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label>ಜಿಲ್ಲೆ:</label>
                        <input type="text" id="regDistrict" value="ಯಾದಗಿರಿ">
                    </div>
                    <div class="form-group">
                        <label>ತಾಲೂಕು:</label>
                        <input type="text" id="regTaluk" value="ಶಹಾಪುರ">
                    </div>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label>ಊರು/ಗ್ರಾಮ:</label>
                        <input type="text" id="regVillage" placeholder="ಊರಿನ ಹೆಸರು">
                    </div>
                    <div class="form-group">
                        <label>ಪಿನ್ ಕೋಡ್:</label>
                        <input type="number" id="regPincode" placeholder="585223">
                    </div>
                </div>

                <div class="form-group">
                    <label>ಅಂಗಡಿಯ ಫೋಟೋ (ಕ್ಯಾಮೆರಾ/ಗ್ಯಾಲರಿ):</label>
                    <input type="file" id="regShopPhoto" accept="image/*" capture="environment">
                </div>

                <button class="btn btn-primary" onclick="handleRegister()">ಖಾತೆ ಸೃಷ್ಟಿಸಿ & ಮುಂದುವರಿಸಿ</button>
            </div>

            <!-- Login Form -->
            <div id="loginForm" class="card" style="display: none;">
                <h3 class="card-title">ಹಳೆಯ ಐಡಿ ಮೂಲಕ ಲಾಗಿನ್ ಆಗಿ</h3>
                <div class="form-group">
                    <label>ನಿಮ್ಮ ೪ ಅಂಕಿಗಳ ಡಿಜಿಟಲ್ ಐಡಿ:</label>
                    <input type="number" id="loginId" placeholder="ಉದಾ: 4821">
                </div>
                <button class="btn btn-primary" onclick="handleLogin()">ಲಾಗಿನ್ ಆಗಿ</button>
            </div>
        </div>

        <!-- SECTION 2: DASHBOARD -->
        <div id="dashboardSection" style="display: none;">
            
            <div class="dashboard-nav">
                <button class="nav-action-btn active" id="btnUploadTab" onclick="switchDashboardTab('upload')">➕ ವಸ್ತು ಅಪ್ಲೋಡ್</button>
                <button class="nav-action-btn" id="btnOrdersTab" onclick="switchDashboardTab('orders')">📦 ಆರ್ಡರ್ ನೋಡಿ</button>
            </div>

            <!-- UPLOAD TAB -->
            <div id="uploadTabContent">
                <div class="card">
                    <h3 class="card-title">➕ ಹೊಸ ವಸ್ತುವಿನ ಹೆಸರು ಮತ್ತು ಬೆಲೆ ಹಾಕಿ</h3>

                    <div class="form-group">
                        <label>ವಸ್ತುವಿನ ಹೆಸರು:</label>
                        <input type="text" id="prodName" placeholder="ಉದಾ: ಶರ್ಟ್, ಚಪ್ಪಲಿ, ವಾಚ್">
                    </div>

                    <div class="row">
                        <div class="form-group">
                            <label>ಹಳೆಯ ರೇಟ್ (₹):</label>
                            <input type="number" id="prodOldPrice" placeholder="500">
                        </div>
                        <div class="form-group">
                            <label>ಈಗಿನ ರೇಟ್ (₹):</label>
                            <input type="number" id="prodNewPrice" placeholder="350">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>ಎಷ್ಟು ಪೀಸ್ ಕೊಡ್ತಾ ಇದ್ದೀರಾ (ಕ್ವಾಂಟಿಟಿ)?</label>
                        <select id="prodQuantity">
                            <option value="1 ಪೀಸ್">1 ಪೀಸ್</option>
                            <option value="2 ಪೀಸ್">2 ಪೀಸ್</option>
                            <option value="3 ಪೀಸ್">3 ಪೀಸ್</option>
                            <option value="4 ಪೀಸ್">4 ಪೀಸ್</option>
                            <option value="10 ಪೀಸ್">10 ಪೀಸ್</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>ಮುಂಭಾಗದ ಫೋಟೋ (Front):</label>
                        <input type="file" id="prodFrontImg" accept="image/*">
                    </div>

                    <div class="form-group">
                        <label>ಹಿಂಭಾಗದ ಫೋಟೋ (Back):</label>
                        <input type="file" id="prodBackImg" accept="image/*">
                    </div>

                    <button class="btn btn-success" id="publishBtn" onclick="uploadProduct()">ವಸ್ತು ಪ್ರಕಟಿಸಿ (Publish)</button>
                </div>

                <div class="card">
                    <h3 class="card-title">📦 ನಿಮ್ಮ ಅಂಗಡಿಯಲ್ಲಿರುವ ವಸ್ತುಗಳು</h3>
                    <div id="productGrid" class="product-grid"></div>
                </div>
            </div>

            <!-- ORDERS TAB -->
            <div id="ordersTabContent" style="display: none;">
                <div class="card">
                    <h3 class="card-title">📥 ಗ್ರಾಹಕರಿಂದ ಬಂದಿರುವ ಹೊಸ ಆರ್ಡರ್‌ಗಳು</h3>
                    <div id="ordersListContainer">
                        <p style="text-align: center; color: #777; padding: 20px;">ಸದ್ಯಕ್ಕೆ ಯಾವುದೇ ಹೊಸ ಆರ್ಡರ್‌ಗಳಿಲ್ಲ.</p>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <!-- POPUP MODAL -->
    <div id="customModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">ಸಂದೇಶ</h3>
            <p id="modalMessage"></p>
            <div id="modalExtra"></div>
            <button class="btn btn-primary" style="margin-top: 15px;" onclick="closeModal()">ಓಕೆ (OK)</button>
        </div>
    </div>

    <script>
        let currentShopId = localStorage.getItem('activeShopId');
        let db = null;

        // INDEXEDDB SETUP FOR UNLIMITED STORAGE
        const dbRequest = indexedDB.open("ShahapurMarketDB", 1);

        dbRequest.onupgradeneeded = function(e) {
            db = e.target.result;
            if (!db.objectStoreNames.contains("products")) {
                db.createObjectStore("products", { keyPath: "id" });
            }
        };

        dbRequest.onsuccess = function(e) {
            db = e.target.result;
            if (currentShopId) {
                showDashboard();
            }
        };

        dbRequest.onerror = function(e) {
            console.error("IndexedDB Error: ", e);
        };

        function switchAuthTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if(tab === 'register') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('registerForm').style.display = 'block';
                document.getElementById('loginForm').style.display = 'none';
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('registerForm').style.display = 'none';
                document.getElementById('loginForm').style.display = 'block';
            }
        }

        function switchDashboardTab(tab) {
            const btnUpload = document.getElementById('btnUploadTab');
            const btnOrders = document.getElementById('btnOrdersTab');
            const uploadContent = document.getElementById('uploadTabContent');
            const ordersContent = document.getElementById('ordersTabContent');

            if(tab === 'upload') {
                btnUpload.classList.add('active');
                btnOrders.classList.remove('active');
                uploadContent.style.display = 'block';
                ordersContent.style.display = 'none';
            } else {
                btnOrders.classList.add('active');
                btnUpload.classList.remove('active');
                uploadContent.style.display = 'none';
                ordersContent.style.display = 'block';
            }
        }

        function handleRegister() {
            const name = document.getElementById('regName').value;
            const phone = document.getElementById('regPhone').value;
            const shopName = document.getElementById('regShopName').value;

            if(!name || !phone || !shopName) {
                alert("ದಯವಿಟ್ಟು ಎಲ್ಲಾ ಅಗತ್ಯ ವಿವರಗಳನ್ನು ಭರ್ತಿ ಮಾಡಿ!");
                return;
            }

            const digitalId = Math.floor(1000 + Math.random() * 9000);
            localStorage.setItem('activeShopId', digitalId);
            currentShopId = digitalId;

            showModal(
                "ನೋಂದಣಿ ಯಶಸ್ವಿಯಾಗಿದೆ! 🎉",
                "ನಿಮ್ಮ ಸಕ್ಸೆಸ್‌ಫುಲ್ ಡಿಜಿಟಲ್ ಐಡಿಯಾಗಿದೆ. ಈ ೪ ಅಂಕಿಗಳ ಐಡಿಯನ್ನು ಗಮನದಲ್ಲಿ ಇಟ್ಟುಕೊಳ್ಳಿ:",
                `<div class="id-badge">${digitalId}</div>`
            );
        }

        function handleLogin() {
            const enteredId = document.getElementById('loginId').value;
            if(!enteredId || enteredId.length !== 4) {
                alert("ದಯವಿಟ್ಟು ಸರಿಯಾದ ೪ ಅಂಕಿಗಳ ಐಡಿ ನಮೂದಿಸಿ!");
                return;
            }

            localStorage.setItem('activeShopId', enteredId);
            currentShopId = enteredId;
            showDashboard();
        }

        function showDashboard() {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'block';
            document.getElementById('logoutBtn').style.display = 'block';
            renderProducts();
        }

        function logout() {
            localStorage.removeItem('activeShopId');
            currentShopId = null;
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('dashboardSection').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'none';
        }

        // Image Compressor
        function compressAndConvertImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 400;
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    callback(compressedBase64);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Upload Product via IndexedDB (Unlimited)
        function uploadProduct() {
            const name = document.getElementById('prodName').value;
            const oldPrice = document.getElementById('prodOldPrice').value;
            const newPrice = document.getElementById('prodNewPrice').value;
            const qty = document.getElementById('prodQuantity').value;
            const frontImgInput = document.getElementById('prodFrontImg');

            if(!name || !newPrice) {
                alert("ದಯವಿಟ್ಟು ವಸ್ತುವಿನ ಹೆಸರು ಮತ್ತು ಹೊಸ ಬೆಲೆಯನ್ನು ನಮೂದಿಸಿ!");
                return;
            }

            const saveToDatabase = (imgData) => {
                const newProduct = {
                    id: Date.now(),
                    shopId: currentShopId,
                    name: name,
                    oldPrice: oldPrice,
                    newPrice: newPrice,
                    qty: qty,
                    img: imgData
                };

                const tx = db.transaction("products", "readwrite");
                const store = tx.objectStore("products");
                store.add(newProduct);

                tx.oncomplete = function() {
                    document.getElementById('prodName').value = '';
                    document.getElementById('prodOldPrice').value = '';
                    document.getElementById('prodNewPrice').value = '';
                    document.getElementById('prodFrontImg').value = '';
                    document.getElementById('prodBackImg').value = '';

                    showModal(
                        "ಸಕ್ಸೆಸ್‌ಫುಲ್! 🟢",
                        "ನಿಮ್ಮ ಫೋಟೋ ಹಾಗೂ ವಸ್ತುವಿನ ವಿವರಗಳನ್ನು ಯಶಸ್ವಿಯಾಗಿ ಅಪ್ಲೋಡ್ ಮಾಡಲಾಗಿದೆ ಮತ್ತು ಗ್ರಾಹಕರ ಪೇಜ್‌ಗೆ ಕಳುಹಿಸಲಾಗಿದೆ.",
                        ""
                    );

                    renderProducts();
                };
            };

            if (frontImgInput.files && frontImgInput.files[0]) {
                compressAndConvertImage(frontImgInput.files[0], function(compressedBase64) {
                    saveToDatabase(compressedBase64);
                });
            } else {
                saveToDatabase("https://via.placeholder.com/150");
            }
        }

        // Fetch & Render Products from IndexedDB
        function renderProducts() {
            if (!db) return;

            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            const tx = db.transaction("products", "readonly");
            const store = tx.objectStore("products");
            const request = store.getAll();

            request.onsuccess = function() {
                const allProducts = request.result;
                const shopProducts = allProducts.filter(p => p.shopId == currentShopId);

                if(shopProducts.length === 0) {
                    grid.innerHTML = '<p style="grid-column: span 2; text-align: center; color: #777;">ಯಾವ ವಸ್ತುಗಳೂ ಅಪ್ಲೋಡ್ ಆಗಿಲ್ಲ.</p>';
                    return;
                }

                shopProducts.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <div class="img-box">
                            <img src="${p.img}" alt="${p.name}">
                        </div>
                        <div class="product-title">${p.name}</div>
                        <div>
                            ${p.oldPrice ? `<span class="product-old-price">₹${p.oldPrice}</span>` : ''}
                            <span class="product-price">₹${p.newPrice}</span>
                        </div>
                        <div style="font-size: 11px; color: #555; margin-top:2px;">(${p.qty})</div>
                        <button class="delete-btn" onclick="deleteProduct(${p.id})">ಡಿಲೀಟ್ (Delete)</button>
                    `;
                    grid.appendChild(card);
                });
            };
        }

        // Delete Product from IndexedDB
        function deleteProduct(id) {
            const tx = db.transaction("products", "readwrite");
            const store = tx.objectStore("products");
            store.delete(id);

            tx.oncomplete = function() {
                renderProducts();
            };
        }

        function showModal(title, msg, extraHtml) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = msg;
            document.getElementById('modalExtra').innerHTML = extraHtml || '';
            document.getElementById('customModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('customModal').style.display = 'none';
            if(currentShopId && document.getElementById('dashboardSection').style.display === 'none') {
                showDashboard();
            }
        }
    </script>
</body>
</html>
