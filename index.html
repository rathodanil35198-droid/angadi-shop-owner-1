<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಶಹಾಪುರ ಮಾರ್ಕೆಟ್ - ಅಂಗಡಿ ಮಾಲೀಕರ ಆಪ್</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans pb-24">

    <!-- ಫೋಟೋ ಜೂಮ್ ಪಾಪ್‌ಅಪ್ -->
    <div id="image-modal" class="fixed inset-0 bg-black bg-opacity-80 z-50 hidden flex items-center justify-center p-4">
        <div class="relative bg-white p-2 rounded-2xl max-w-sm w-full text-center">
            <button type="button" onclick="closeImageModal()" class="absolute top-2 right-2 bg-red-500 text-white w-8 h-8 rounded-full font-bold cursor-pointer">✕</button>
            <img id="zoomed-img" src="" class="w-full h-96 object-contain rounded-xl">
        </div>
    </div>

    <!-- ಸಕ್ಸಸ್ ಪಾಪ್‌ಅಪ್ -->
    <div id="custom-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-2xl shadow-2xl max-w-sm w-full text-center space-y-3">
            <div id="modal-icon" class="text-4xl">🎉</div>
            <h3 id="modal-title" class="text-lg font-bold text-gray-800">ಯಶಸ್ವಿ!</h3>
            <p id="modal-message" class="text-xs text-gray-600"></p>
            <button type="button" onclick="closeModal()" class="w-full bg-indigo-600 text-white py-2 rounded-xl font-bold text-xs cursor-pointer">ಸರಿ (OK)</button>
        </div>
    </div>

    <!-- ಹೆಡರ್ -->
    <header class="bg-indigo-700 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-40">
        <div>
            <h1 class="text-sm font-bold">🏪 ಶಹಾಪುರ ಮಾರ್ಕೆಟ್</h1>
            <p class="text-[10px] text-indigo-200">ಅಂಗಡಿ ಮಾಲೀಕರ ಆಪ್</p>
        </div>
        <div class="flex items-center gap-2">
            <span id="header-shop-name" class="text-xs bg-indigo-800 px-2 py-1 rounded-lg">ಅಂಗಡಿ</span>
            <button type="button" onclick="logoutVendor()" class="bg-red-500 text-white px-2 py-1 rounded-lg text-xs font-bold cursor-pointer">ಬಾಹಿರ (Logout)</button>
        </div>
    </header>

    <main class="container mx-auto p-4 max-w-md space-y-4">

        <!-- ಟ್ಯಾಬ್ ಬಟನ್‌ಗಳು -->
        <div class="grid grid-cols-2 gap-2 bg-white p-2 rounded-2xl shadow-sm border">
            <button type="button" onclick="switchTab('upload')" id="tab-upload" class="bg-indigo-600 text-white py-2.5 rounded-xl text-xs font-bold shadow cursor-pointer text-center">➕ ವಸ್ತು ಅಪ್ಲೋಡ್</button>
            <button type="button" onclick="switchTab('orders')" id="tab-orders" class="bg-gray-100 text-gray-700 py-2.5 rounded-xl text-xs font-bold cursor-pointer text-center">📦 ಆರ್ಡರ್ ನೋಡಿ</button>
        </div>

        <!-- ಸೆಕ್ಷನ್ 1: ವಸ್ತು ಅಪ್ಲೋಡ್ -->
        <div id="section-upload" class="bg-white p-4 rounded-2xl shadow-sm border space-y-3">
            <h3 class="font-bold text-xs text-indigo-700 border-b pb-2">➕ ಹೊಸ ವಸ್ತುವಿನ ಹೆಸರು ಮತ್ತು ಬೆಲೆ ಹಾಕಿ</h3>
            
            <div class="space-y-2 text-xs">
                <div>
                    <label class="font-bold text-gray-700">ವಸ್ತುವಿನ ಹೆಸರು:</label>
                    <input type="text" id="prod-name" placeholder="ಉದಾ: ನೀರಿನ ಬಾಟಲ್, ಚಪ್ಪಲಿ" class="w-full p-2.5 border rounded-xl mt-1 bg-gray-50">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="font-bold text-gray-700">ಹಳೆಯ ರೇಟ್ (ಮೂಲ ಬೆಲೆ):</label>
                        <input type="number" id="prod-old-price" placeholder="₹500" class="w-full p-2.5 border rounded-xl mt-1 bg-gray-50">
                    </div>
                    <div>
                        <label class="font-bold text-gray-700">ಈಗಿನ ಪ್ರೈಸ್ (ಡಿಸ್ಕೌಂಟ್ ರೇಟ್):</label>
                        <input type="number" id="prod-new-price" placeholder="₹350" class="w-full p-2.5 border rounded-xl mt-1 bg-gray-50">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="font-bold text-gray-700">ಎಷ್ಟು ಪೀಸ್ ಕೊಡ್ತಾ ಇದ್ದೀರಾ?</label>
                        <input type="text" id="prod-stock" placeholder="ಉದಾ: 1 ಪೀಸ್" class="w-full p-2.5 border rounded-xl mt-1 bg-gray-50">
                    </div>
                    <div>
                        <label class="font-bold text-gray-700">ಸೈಜ್ / ನಂಬರ್ ಆಯ್ಕೆ:</label>
                        <select id="prod-size" class="w-full p-2.5 border rounded-xl mt-1 bg-gray-50">
                            <option value="Standard">Standard</option>
                            <option value="S (Small)">S (Small)</option>
                            <option value="M (Medium)">M (Medium)</option>
                            <option value="L (Large)">L (Large)</option>
                            <option value="XL (Extra Large)">XL (Extra Large)</option>
                            <option value="6">ನಂಬರ್ 6</option>
                            <option value="7">ನಂಬರ್ 7</option>
                            <option value="8">ನಂಬರ್ 8</option>
                            <option value="9">ನಂಬರ್ 9</option>
                            <option value="10">ನಂಬರ್ 10</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="font-bold text-gray-700">ಮುಂಭಾಗದ ಫೋಟೋ:</label>
                    <input type="file" id="prod-img1" accept="image/*" class="w-full p-2 border rounded-xl mt-1 bg-gray-50">
                </div>
                <div>
                    <label class="font-bold text-gray-700">ಹಿಂಭಾಗದ ಫೋಟೋ:</label>
                    <input type="file" id="prod-img2" accept="image/*" class="w-full p-2 border rounded-xl mt-1 bg-gray-50">
                </div>

                <button type="button" onclick="publishProduct()" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold shadow cursor-pointer">ವಸ್ತು ಪ್ರಕಟಿಸಿ (Publish)</button>
            </div>

            <div class="pt-4 border-t space-y-2">
                <h4 class="font-bold text-xs text-gray-800">ನಿಮ್ಮ ಅಂಗಡಿಯಲ್ಲಿರುವ ವಸ್ತುಗಳು:</h4>
                <div id="vendor-products-list" class="space-y-2">
                    <!-- ವಸ್ತುಗಳ ಪಟ್ಟಿ ಇಲ್ಲಿ ಬರುತ್ತದೆ -->
                </div>
            </div>
        </div>

        <!-- ಸೆಕ್ಷನ್ 2: ಆರ್ಡರ್ ನೋಡಿ -->
        <div id="section-orders" class="bg-white p-4 rounded-2xl shadow-sm border space-y-3 hidden">
            <h3 class="font-bold text-xs text-indigo-700 border-b pb-2">📦 ಗ್ರಾಹಕರ ಆರ್ಡರ್‌ಗಳು</h3>
            <div id="vendor-orders-list" class="space-y-3 text-xs">
                ಯಾವುದೇ ಆರ್ಡರ್‌ಗಳಿಲ್ಲ.
            </div>
        </div>

    </main>

    <script>
        let currentVendor = JSON.parse(localStorage.getItem('currentVendor')) || { shopName: "ಶಹಾಪುರ ಅಂಗಡಿ", name: "ಅನಿಲ್", phone: "9353444070" };

        document.getElementById('header-shop-name').innerText = `${currentVendor.shopName} (${currentVendor.name})`;

        function switchTab(tab) {
            if (tab === 'upload') {
                document.getElementById('section-upload').classList.remove('hidden');
                document.getElementById('section-orders').classList.add('hidden');
                document.getElementById('tab-upload').className = "bg-indigo-600 text-white py-2.5 rounded-xl text-xs font-bold shadow cursor-pointer text-center";
                document.getElementById('tab-orders').className = "bg-gray-100 text-gray-700 py-2.5 rounded-xl text-xs font-bold cursor-pointer text-center";
                loadVendorProducts();
            } else {
                document.getElementById('section-upload').classList.add('hidden');
                document.getElementById('section-orders').classList.remove('hidden');
                document.getElementById('tab-orders').className = "bg-indigo-600 text-white py-2.5 rounded-xl text-xs font-bold shadow cursor-pointer text-center";
                document.getElementById('tab-upload').className = "bg-gray-100 text-gray-700 py-2.5 rounded-xl text-xs font-bold cursor-pointer text-center";
                loadVendorOrders();
            }
        }

        function showModal(title, message, icon = '🎉', callback = null) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerHTML = message;
            document.getElementById('modal-icon').innerText = icon;
            document.getElementById('custom-modal').classList.remove('hidden');
            window.modalCallback = callback;
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
            if (typeof window.modalCallback === 'function') {
                window.modalCallback();
                window.modalCallback = null;
            }
        }

        function zoomImage(src) {
            document.getElementById('zoomed-img').src = src;
            document.getElementById('image-modal').classList.remove('hidden');
        }

        function closeImageModal() {
            document.getElementById('image-modal').classList.add('hidden');
        }

        function logoutVendor() {
            localStorage.removeItem('currentVendor');
            window.location.reload();
        }

        // ಫೋಟೋಗಳನ್ನು ಕಂಪ್ರೆಸ್ ಮಾಡಿ ಬೇಸ್‌64 ಗೆ ಬದಲಾಯಿಸುವ ಸುರಕ್ಷಿತ ಫಂಕ್ಷನ್
        function convertImageToBase64(file, callback) {
            if (!file) {
                callback("");
                return;
            }
            let reader = new FileReader();
            reader.onload = function (e) {
                let img = new Image();
                img.onload = function () {
                    let canvas = document.createElement('canvas');
                    let ctx = canvas.getContext('2d');
                    let max_size = 800;
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > height) {
                        if (width > max_size) { height *= max_size / width; width = max_size; }
                    } else {
                        if (height > max_size) { width *= max_size / height; height = max_size; }
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.7));
                };
                img.onerror = function () { callback(e.target.result); };
                img.src = e.target.result;
            };
            reader.onerror = function () { callback(""); };
            reader.readAsDataURL(file);
        }

        function publishProduct() {
            let name = document.getElementById('prod-name').value.trim();
            let oldPrice = document.getElementById('prod-old-price').value.trim();
            let newPrice = document.getElementById('prod-new-price').value.trim();
            let stock = document.getElementById('prod-stock').value.trim();
            let size = document.getElementById('prod-size').value;
            let img1File = document.getElementById('prod-img1').files[0];
            let img2File = document.getElementById('prod-img2').files[0];

            if (!name || !newPrice) {
                alert('ದಯವಿಟ್ಟು ವಸ್ತುವಿನ ಹೆಸರು ಮತ್ತು ಪ್ರೈಸ್ ನಮೂದಿಸಿ!');
                return;
            }

            convertImageToBase64(img1File, function(img1Url) {
                convertImageToBase64(img2File, function(img2Url) {
                    let newProduct = {
                        id: 'PROD-' + Date.now(),
                        name,
                        oldPrice: oldPrice || newPrice,
                        newPrice,
                        stock: stock || '1 ಪೀಸ್',
                        size,
                        img1: img1Url || 'https://via.placeholder.com/150',
                        img2: img2Url || '',
                        vendorShop: currentVendor.shopName,
                        vendorPhone: currentVendor.phone,
                        vendorName: currentVendor.name
                    };

                    let products = JSON.parse(localStorage.getItem('market_products')) || [];
                    products.unshift(newProduct);
                    localStorage.setItem('market_products', JSON.stringify(products));

                    // ಫಾರ್ಮ್ ಖಾಲಿ ಮಾಡುವುದು
                    document.getElementById('prod-name').value = '';
                    document.getElementById('prod-old-price').value = '';
                    document.getElementById('prod-new-price').value = '';
                    document.getElementById('prod-stock').value = '';
                    document.getElementById('prod-img1').value = '';
                    document.getElementById('prod-img2').value = '';

                    loadVendorProducts();
                    showModal("ಯಶಸ್ವಿ!", "ನಿಮ್ಮ ವಸ್ತು ಯಶಸ್ವಾಗಿ ಪ್ರಕಟಿಸಲಾಗಿದೆ!", "🎉");
                });
            });
        }

        function loadVendorProducts() {
            let container = document.getElementById('vendor-products-list');
            let products = JSON.parse(localStorage.getItem('market_products')) || [];
            let myProducts = products.filter(p => p.vendorShop === currentVendor.shopName);

            if (myProducts.length === 0) {
                container.innerHTML = "<p class='text-gray-500 text-xs py-2'>ಯಾವುದೇ ವಸ್ತುಗಳನ್ನು ಅಪ್ಲೋಡ್ ಮಾಡಿಲ್ಲ.</p>";
                return;
            }

            container.innerHTML = myProducts.map(p => `
                <div class="border p-2.5 rounded-xl flex items-center justify-between bg-gray-50 text-xs">
                    <div class="flex items-center gap-2">
                        <img src="${p.img1}" onclick="zoomImage(this.src)" class="w-12 h-12 object-cover rounded-lg border cursor-pointer">
                        <div>
                            <p class="font-bold text-indigo-700">${p.name} (${p.size})</p>
                            <p class="text-[11px] text-gray-600">ಬೆಲೆ: ₹${p.newPrice} <span class="line-through text-gray-400">₹${p.oldPrice}</span> | ${p.stock}</p>
                        </div>
                    </div>
                    <button type="button" onclick="deleteProduct('${p.id}')" class="bg-red-500 text-white px-2.5 py-1 rounded-lg text-[10px] font-bold cursor-pointer">ಡಿಲೀಟ್</button>
                </div>
            `).join('');
        }

        function deleteProduct(id) {
            let products = JSON.parse(localStorage.getItem('market_products')) || [];
            products = products.filter(p => p.id !== id);
            localStorage.setItem('market_products', JSON.stringify(products));
            loadVendorProducts();
        }

        // ಆರ್ಡರ್ಸ್ ಮ್ಯಾನೇಜ್‌ಮೆಂಟ್ & ಪ್ಯಾಕಿಂಗ್ ಆಗಿದೆ ಬಟನ್ ಫಿಕ್ಸ್
        function loadVendorOrders() {
            let container = document.getElementById('vendor-orders-list');
            let orders = JSON.parse(localStorage.getItem('market_orders')) || [];
            let myOrders = orders.filter(o => o.acceptedByVendor === currentVendor.shopName || (o.items && o.items.some(i => i.vendorShop === currentVendor.shopName)));

            if (myOrders.length === 0) {
                container.innerHTML = "<p class='text-gray-500 text-center py-6'>ಯಾವುದೇ ಹೊಸ ಆರ್ಡರ್‌ಗಳಿಲ್ಲ.</p>";
                return;
            }

            container.innerHTML = myOrders.map(o => `
                <div class="border p-3 rounded-2xl bg-white space-y-3 shadow-sm border-indigo-100">
                    <div class="flex justify-between items-center border-b pb-2">
                        <span class="font-bold text-indigo-700">ಆರ್ಡರ್ ID: ${o.id}</span>
                        <span class="bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded text-[10px] font-bold">ಪಾವತಿ: ${o.paymentMethod || 'COD'}</span>
                    </div>

                    <div class="space-y-1 text-xs">
                        <p><b>ಗ್ರಾಹಕರ ಹೆಸರು:</b> ${o.customerName} (<a href="tel:${o.phone}" class="text-blue-600 underline">ಕರೆಯಿರಿ: ${o.phone}</a>)</p>
                        <p><b>ವಿಳಾಸ:</b> ${o.address || o.city || 'ಶಹಾಪುರ'}</p>
                    </div>

                    <div class="border-t pt-2 space-y-1">
                        <p class="font-bold text-[11px] text-gray-700">ವಸ್ತುಗಳು:</p>
                        ${o.items ? o.items.map(i => `
                            <div class="flex justify-between text-[11px] bg-gray-50 p-1.5 rounded">
                                <span>${i.name} (${i.size \vert{}\vert{} 'Standard'}) x${i.qty || 1}</span>
                                <span class="font-bold text-green-600">₹${i.price * (i.qty || 1)}</span>
                            </div>
                        `).join('') : `<p>ಒಟ್ಟು ಮೊತ್ತ: ₹${o.total}</p>`}
                    </div>

                    <!-- ಲೈವ್ ರೂಟ್ ಟ್ರ್ಯಾಕರ್ & ಪ್ಯಾಕಿಂಗ್ ಬಟನ್ -->
                    <div class="bg-indigo-50/50 p-3 rounded-xl space-y-2 border">
                        <p class="font-bold text-[11px] text-indigo-800">📍 ಲೈವ್ ರೂಟ್ ಟ್ರ್ಯಾಕರ್ ಹಾಗೂ ಜಿಪಿಎಸ್ ಮ್ಯಾಪ್:</p>
                        <div class="flex justify-between text-center text-[10px] font-bold text-gray-600 px-2">
                            <span class="${o.confirmed ? 'text-green-600' : ''}">1. ಕನ್ಫರ್ಮ್</span>
                            <span class="${o.packed ? 'text-green-600' : ''}">2. ಪ್ಯಾಕಿಂಗ್</span>
                            <span class="${o.outForDelivery ? 'text-green-600' : ''}">3. ಡೆಲಿವರಿ</span>
                            <span class="${o.delivered ? 'text-green-600' : ''}">4. ತಲುಪಿದೆ</span>
                        </div>
                        <div class="w-full bg-gray-200 h-2 rounded-full overflow-hidden">
                            <div class="bg-green-600 h-full transition-all duration-300" style="width: ${o.delivered ? '100%' : o.outForDelivery ? '75%' : o.packed ? '50%' : o.confirmed ? '25%' : '10%'}"></div>
                        </div>
                    </div>

                    <div class="flex gap-2 pt-1">
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.address || 'Shahapur Karnataka')}" target="_blank" class="flex-1 bg-indigo-600 text-white py-2 rounded-xl text-center font-bold text-[11px]">🗺️ ಮ್ಯಾಪ್ ಲೊಕೇಶನ್</a>
                        <a href="tel:${o.phone}" class="flex-1 bg-teal-600 text-white py-2 rounded-xl text-center font-bold text-[11px]">📞 ಗ್ರಾಹಕರಿಗೆ ಕಾಲ್ ಮಾಡಿ</a>
                    </div>

                    <!-- ಪ್ಯಾಕಿಂಗ್ ಆಗಿದೆ ಬಟನ್ (ಸಂಪೂರ್ಣ ವರ್ಕ್ ಆಗುತ್ತದೆ) -->
                    <div class="space-y-2 pt-1">
                        <button type="button" onclick="markOrderPacked('${o.id}')" class="w-full ${o.packed ? 'bg-gray-400 cursor-not-allowed' : 'bg-amber-600 hover:bg-amber-700'} text-white py-2.5 rounded-xl font-bold text-xs shadow cursor-pointer">
                            📦 ${o.packed ? 'ಪ್ಯಾಕಿಂಗ್ ಪೂರ್ಣಗೊಂಡಿದೆ (Packed)' : 'ಪ್ಯಾಕಿಂಗ್ ಆಗಿದೆ (OK)'}
                        </button>

                        <button type="button" onclick="verifyOrderPayment('${o.id}')" class="w-full ${o.paymentVerified ? 'bg-green-700' : 'bg-green-600'} text-white py-2.5 rounded-xl font-bold text-xs shadow cursor-pointer">
                            💰 ${o.paymentVerified ? 'ಪೇಮೆಂಟ್ ಪರಿಶೀಲಿಸಲಾಗಿದೆ (Success)' : 'ಪೇಮೆಂಟ್ ಬಂದಿದೆ - ಚೆಕ್ ಮಾಡಿ ಸಕ್ಸಸ್ ಮಾಡಿ (OK)'}
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function markOrderPacked(orderId) {
            let orders = JSON.parse(localStorage.getItem('market_orders')) || [];
            let order = orders.find(o => o.id === orderId);
            if (order) {
                order.packed = true;
                order.confirmed = true;
                localStorage.setItem('market_orders', JSON.stringify(orders));
                loadVendorOrders();
                showModal("ಯಶಸ್ವಿ!", "ಆರ್ಡರ್ ಪ್ಯಾಕಿಂಗ್ ಯಶಸ್ವಿಯಾಗಿ ಅಪ್‌ಡೇಟ್ ಆಗಿದೆ ಮತ್ತು ಡೆಲಿವರಿ ಬಾಯ್ ಪ್ಯಾನಲ್‌ಗೆ ರವಾನೆಯಾಗಿದೆ!", "📦");
            }
        }

        function verifyOrderPayment(orderId) {
            let orders = JSON.parse(localStorage.getItem('market_orders')) || [];
            let order = orders.find(o => o.id === orderId);
            if (order) {
                order.paymentVerified = true;
                localStorage.setItem('market_orders', JSON.stringify(orders));
                loadVendorOrders();
                showModal("ಪೇಮೆಂಟ್ ಸಕ್ಸಸ್!", "ಪಾವತಿ ಯಶಸ್ವಿಯಾಗಿ ಪರಿಶೀಲಿಸಲಾಗಿದೆ (Payment Success)!", "✨");
            }
        }

        // ಆಪ್ ಲೋಡ್ ಆದ ತಕ್ಷಣ ವಸ್ತುಗಳ ಪಟ್ಟಿ ಲೋಡ್ ಮಾಡುವುದು
        loadVendorProducts();
    </script>
</body>
</html>
