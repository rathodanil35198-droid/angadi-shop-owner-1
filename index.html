<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಅಂಗಡಿ ಓನರ್ ಆ್ಯಪ್ (Shop Owner Panel)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            min-height: 90vh;
            padding: 20px;
        }

        h2, h3 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            background-color: #27ae60;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        button:hover {
            background-color: #219150;
        }

        .btn-secondary {
            background-color: #2980b9;
        }

        .btn-danger {
            background-color: #e74c3c;
            padding: 5px 10px;
            margin-top: 5px;
            font-size: 12px;
        }

        .toggle-link {
            text-align: center;
            color: #3498db;
            margin-top: 12px;
            cursor: pointer;
            font-size: 13px;
            text-decoration: underline;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .nav-buttons button {
            flex: 1;
        }

        .section {
            display: none;
        }

        .active {
            display: block;
        }

        .product-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .product-card {
            background: #fafafa;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 8px;
            text-align: center;
        }

        .img-container {
            display: flex;
            gap: 4px;
            justify-content: center;
            margin-bottom: 6px;
        }

        .img-container img {
            width: 48%;
            height: 70px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .price-old {
            text-decoration: line-through;
            color: #888;
            font-size: 12px;
        }

        .price-new {
            color: #e74c3c;
            font-weight: bold;
            font-size: 14px;
        }

        .qty-badge {
            background: #e8f8f5;
            color: #16a085;
            font-size: 11px;
            padding: 2px 5px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 3px;
        }

        .order-card {
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            background: #fff;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- 1. Registration / Login Section -->
    <div id="loginSection" class="section active">
        <h2>ಅಂಗಡಿ ಓನರ್ ಲಾಗಿನ್</h2>
        
        <form id="regForm">
            <div class="form-group">
                <label>ನಿಮ್ಮ ಹೆಸರು:</label>
                <input type="text" id="ownerName" required placeholder="ಹೆಸರು ಹಾಕಿ">
            </div>
            <div class="form-group">
                <label>ಮೊಬೈಲ್ ನಂಬರ್:</label>
                <input type="tel" id="mobile" required pattern="[0-9]{10}" placeholder="10 ಅಂಕಿಯ ಮೊಬೈಲ್ ನಂಬರ್">
            </div>
            <div class="form-group">
                <label>ಅಂಗಡಿಯ ಹೆಸರು:</label>
                <input type="text" id="shopName" required placeholder="ಅಂಗಡಿ ಹೆಸರು">
            </div>
            <div class="form-group">
                <label>ಜಿಲ್ಲೆಯ ಹೆಸರು:</label>
                <input type="text" id="district" required placeholder="ಜಿಲ್ಲೆ">
            </div>
            <div class="form-group">
                <label>ತಾಲ್ಲೂಕಿನ ಹೆಸರು:</label>
                <input type="text" id="taluk" required placeholder="ತಾಲ್ಲೂಕು">
            </div>
            <div class="form-group">
                <label>ಪಿನ್ ಕೋಡ್ ನಂಬರ್:</label>
                <input type="text" id="pincode" required pattern="[0-9]{6}" placeholder="6 ಅಂಕಿಯ ಪಿನ್ ಕೋಡ್">
            </div>
            <button type="submit">ಸಬ್ಮಿಟ್ (Register)</button>
        </form>

        <form id="oldIdForm" style="display: none;">
            <div class="form-group">
                <label>ನಿಮ್ಮ 4-ಡಿಜಿಟ್ ಐಡಿ (ID) ಹಾಕಿ:</label>
                <input type="text" id="oldIdInput" maxlength="4" placeholder="ಉದಾ: 4821">
            </div>
            <button type="submit" class="btn-secondary">ಲಾಗಿನ್ ಆಗಿ</button>
        </form>

        <div class="toggle-link" id="toggleLoginType">ನಿಮ್ಮ ಹಳೆಯ ಐಡಿ ಹಾಕಿ ಲಾಗಿನ್ ಆಗಲು ಇಲ್ಲಿ ಕ್ಲಿಕ್ ಮಾಡಿ</div>
    </div>

    <!-- 2. Main Dashboard Section -->
    <div id="mainDashboard" class="section">
        <h3 id="welcomeShopName">ಅಂಗಡಿ ಡ್ಯಾಶ್‌ಬೋರ್ಡ್</h3>
        
        <div class="nav-buttons">
            <button class="btn-secondary" onclick="showTab('uploadTab')">ಫೋಟೋ ಅಪ್ಲೋಡ್</button>
            <button class="btn-secondary" onclick="showTab('orderTab')">ಆರ್ಡರ್ ನೋಡಿ</button>
        </div>

        <!-- Tab 1: Upload Product -->
        <div id="uploadTab" class="tab-content">
            <h3>ಹೊಸ ವಸ್ತು ಅಪ್ಲೋಡ್ ಮಾಡಿ</h3>
            <form id="productForm">
                <div class="form-group">
                    <label>ವಸ್ತುವಿನ ಹೆಸರು:</label>
                    <input type="text" id="prodName" required placeholder="ಉದಾ: ಚಪ್ಪಲಿ">
                </div>
                <div class="form-group">
                    <label>ಹಳೆಯ ಪ್ರೈಸ್ ರೇಟ್ (₹):</label>
                    <input type="number" id="oldPrice" placeholder="ಉದಾ: 600">
                </div>
                <div class="form-group">
                    <label>ಹೊಸ ಪ್ರೆಸೆಂಟ್ ರೇಟ್ (₹):</label>
                    <input type="number" id="newPrice" required placeholder="ಉದಾ: 450">
                </div>
                <div class="form-group">
                    <label>ಎಷ್ಟು ಪೀಸ್ ಕೊಡ್ತಾ ಇದ್ದೀರಾ (Quantity):</label>
                    <select id="pieceQty" required>
                        <option value="1 Pcs">1 Pcs</option>
                        <option value="2 Pcs">2 Pcs</option>
                        <option value="3 Pcs">3 Pcs</option>
                        <option value="4 Pcs">4 Pcs</option>
                        <option value="5 Pcs">5 Pcs</option>
                        <option value="6 Pcs">6 Pcs</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>ವಸ್ತುವಿನ ಮುಂಭಾಗದ ಫೋಟೋ (Front):</label>
                    <input type="file" id="frontImg" accept="image/*" required>
                </div>
                <div class="form-group">
                    <label>ವಸ್ತುವಿನ ಹಿಂಭಾಗದ ಫೋಟೋ (Back):</label>
                    <input type="file" id="backImg" accept="image/*" required>
                </div>
                <button type="submit">ಸಕ್ಸಸ್‌ಫುಲ್ (Upload Product)</button>
            </form>

            <h3 style="margin-top: 25px;">ಅಪ್ಲೋಡ್ ಮಾಡಲಾದ ವಸ್ತುಗಳು</h3>
            <div id="productList" class="product-grid"></div>
        </div>

        <!-- Tab 2: View Orders -->
        <div id="orderTab" class="tab-content" style="display: none;">
            <h3>ಬಂದಿರುವ ಆರ್ಡರ್‌ಗಳು</h3>
            <div id="ordersList">
                <p style="text-align: center; color: #777;">ಯಾವುದೇ ಆರ್ಡರ್‌ಗಳು ಬಂದಿಲ್ಲ.</p>
            </div>
        </div>

        <button onclick="logout()" class="btn-danger" style="margin-top:20px; width:100%;">ಲಾಗಿನ್‌ಯಿಂದ ಹೊರಬನ್ನಿ (Logout)</button>
    </div>

</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const loggedInOwner = JSON.getItem("ownerData");
        if (loggedInOwner) {
            openMainDashboard(JSON.parse(loggedInOwner));
        }
    });

    let isOldLogin = false;
    const regForm = document.getElementById("regForm");
    const oldIdForm = document.getElementById("oldIdForm");
    const toggleBtn = document.getElementById("toggleLoginType");

    toggleBtn.addEventListener("click", () => {
        isOldLogin = !isOldLogin;
        if (isOldLogin) {
            regForm.style.display = "none";
            oldIdForm.style.display = "block";
            toggleBtn.innerText = "ಹೊಸಬರಿದ್ದರೆ? ಇಲ್ಲಿ ಕ್ಲಿಕ್ ಮಾಡಿ ನೋಂದಾಯಿಸಿ";
        } else {
            regForm.style.display = "block";
            oldIdForm.style.display = "none";
            toggleBtn.innerText = "ನಿಮ್ಮ ಹಳೆಯ ಐಡಿ ಹಾಕಿ ಲಾಗಿನ್ ಆಗಲು ಇಲ್ಲಿ ಕ್ಲಿಕ್ ಮಾಡಿ";
        }
    });

    regForm.addEventListener("submit", function(e) {
        e.preventDefault();
        const generatedId = Math.floor(1000 + Math.random() * 9000).toString();

        const ownerData = {
            id: generatedId,
            name: document.getElementById("ownerName").value,
            mobile: document.getElementById("mobile").value,
            shopName: document.getElementById("shopName").value,
            district: document.getElementById("district").value,
            taluk: document.getElementById("taluk").value,
            pincode: document.getElementById("pincode").value
        };

        localStorage.setItem("ownerData", JSON.stringify(ownerData));
        
        let allOwners = JSON.parse(localStorage.getItem("allOwnersList")) || {};
        allOwners[generatedId] = ownerData;
        localStorage.setItem("allOwnersList", JSON.stringify(allOwners));

        alert("ನಿಮ್ಮ ನೋಂದಣಿ ಯಶಸ್ವಿಯಾಗಿದೆ!\n\nನಿಮ್ಮ 4-ಡಿಜಿಟ್ ಐಡಿ: " + generatedId);
        openMainDashboard(ownerData);
    });

    oldIdForm.addEventListener("submit", function(e) {
        e.preventDefault();
        const inputId = document.getElementById("oldIdInput").value;
        const allOwners = JSON.parse(localStorage.getItem("allOwnersList")) || {};

        if (allOwners[inputId]) {
            localStorage.setItem("ownerData", JSON.stringify(allOwners[inputId]));
            alert("ಲಾಗಿನ್ ಯಶಸ್ವಿಯಾಗಿದೆ!");
            openMainDashboard(allOwners[inputId]);
        } else {
            alert("ತಪ್ಪು ಐಡಿ! ದಯವಿಟ್ಟು ಸರಿಯಾದ 4-ಡಿಜಿಟ್ ಐಡಿ ಹಾಕಿ.");
        }
    });

    function openMainDashboard(data) {
        document.getElementById("loginSection").classList.remove("active");
        document.getElementById("mainDashboard").classList.add("active");
        document.getElementById("welcomeShopName").innerText = data.shopName + " - (ID: " + data.id + ")";
        renderProducts();
        renderOrders();
    }

    function showTab(tabId) {
        document.getElementById("uploadTab").style.display = "none";
        document.getElementById("orderTab").style.display = "none";
        document.getElementById(tabId).style.display = "block";
    }

    // Helper function to compress and resize image for fast upload
    function compressImage(file, callback) {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function(e) {
            const img = new Image();
            img.src = e.target.result;
            img.onload = function() {
                const canvas = document.createElement("canvas");
                const MAX_WIDTH = 400; // Resize width to 400px for speed
                const scaleFactor = MAX_WIDTH / img.width;
                canvas.width = MAX_WIDTH;
                canvas.height = img.height * scaleFactor;

                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                const compressedBase64 = canvas.toDataURL("image/jpeg", 0.7);
                callback(compressedBase64);
            };
        };
    }

    // Handle Product Upload
    document.getElementById("productForm").addEventListener("submit", function(e) {
        e.preventDefault();

        const frontImgFile = document.getElementById("frontImg").files[0];
        const backImgFile = document.getElementById("backImg").files[0];

        if (!frontImgFile || !backImgFile) {
            alert("ದಯವಿಟ್ಟು ಎರಡೂ ಫೋಟೋಗಳನ್ನು ಆಯ್ಕೆ ಮಾಡಿ!");
            return;
        }

        compressImage(frontImgFile, function(frontBase64) {
            compressImage(backImgFile, function(backBase64) {
                const ownerData = JSON.parse(localStorage.getItem("ownerData"));

                const newProduct = {
                    id: Date.now(),
                    shopId: ownerData.id,
                    shopName: ownerData.shopName,
                    name: document.getElementById("prodName").value,
                    oldPrice: document.getElementById("oldPrice").value,
                    newPrice: document.getElementById("newPrice").value,
                    qty: document.getElementById("pieceQty").value,
                    frontImg: frontBase64,
                    backImg: backBase64
                };

                let products = JSON.parse(localStorage.getItem("products")) || [];
                products.push(newProduct);
                
                try {
                    localStorage.setItem("products", JSON.stringify(products));
                    alert("ನಿಮ್ಮ ಫೋಟೋ ಅಪ್ಲೋಡ್ ಆಗಿ ಗ್ರಾಹಕರ ಪೇಜ್ ಗೆ ಹೋಗಿದೆ");
                    document.getElementById("productForm").reset();
                    renderProducts();
                } catch (err) {
                    alert("ಫೋಟೋಗಳ ಸೈಜ್ ಹೆಚ್ಚಾಗಿದೆ, ದಯವಿಟ್ಟು ಬೇರೆ ಫೋಟೋ ಪ್ರಯತ್ನಿಸಿ.");
                }
            });
        });
    });

    function renderProducts() {
        const productList = document.getElementById("productList");
        productList.innerHTML = "";

        const ownerData = JSON.parse(localStorage.getItem("ownerData"));
        let products = JSON.parse(localStorage.getItem("products")) || [];
        const myProducts = products.filter(p => p.shopId === ownerData.id);

        if (myProducts.length === 0) {
            productList.innerHTML = "<p style='grid-column: span 2; text-align:center; color:#777;'>ಇನ್ನೂ ಯಾವುದೇ ವಸ್ತುಗಳನ್ನು ಅಪ್ಲೋಡ್ ಮಾಡಿಲ್ಲ.</p>";
            return;
        }

        myProducts.forEach(product => {
            const card = document.createElement("div");
            card.className = "product-card";
            card.innerHTML = `
                <div class="img-container">
                    <img src="${product.frontImg}" alt="Front">
                    <img src="${product.backImg}" alt="Back">
                </div>
                <strong style="font-size:13px;">${product.name}</strong><br>
                <span class="price-old">₹${product.oldPrice || '0'}</span> 
                <span class="price-new">₹${product.newPrice}</span><br>
                <span class="qty-badge">${product.qty}</span><br>
                <button class="btn-danger" onclick="deleteProduct(${product.id})">ಡಿಲೀಟ್</button>
            `;
            productList.appendChild(card);
        });
    }

    function deleteProduct(productId) {
        if (confirm("ಈ ವಸ್ತುವನ್ನು ಡಿಲೀಟ್ ಮಾಡಲು ಬಯಸುತ್ತೀರಾ?")) {
            let products = JSON.parse(localStorage.getItem("products")) || [];
            products = products.filter(p => p.id !== productId);
            localStorage.setItem("products", JSON.stringify(products));
            renderProducts();
        }
    }

    function renderOrders() {
        const ordersList = document.getElementById("ordersList");
        const ownerData = JSON.parse(localStorage.getItem("ownerData"));
        let orders = JSON.parse(localStorage.getItem("orders")) || [];
        const myOrders = orders.filter(o => o.shopId === ownerData.id);

        if (myOrders.length === 0) {
            ordersList.innerHTML = "<p style='text-align: center; color: #777;'>ಯಾವುದೇ ಆರ್ಡರ್‌ಗಳು ಬಂದಿಲ್ಲ.</p>";
            return;
        }

        ordersList.innerHTML = "";
        myOrders.forEach(order => {
            const div = document.createElement("div");
            div.className = "order-card";
            div.innerHTML = `
                <h4>ಆರ್ಡರ್ ID: #${order.id}</h4>
                <p><strong>ಗ್ರಾಹಕರ ಹೆಸರು:</strong> ${order.customerName}</p>
                <p><strong>ಮೊಬೈಲ್:</strong> ${order.customerMobile}</p>
                <p><strong>ವಸ್ತು:</strong> ${order.productName} (${order.qty})</p>
                <p><strong>ಒಟ್ಟು ಮೊತ್ತ:</strong> ₹${order.totalPrice}</p>
            `;
            ordersList.appendChild(div);
        });
    }

    function logout() {
        if (confirm("ನೀವು ಲಾಗಿನ್‌ನಿಂದ ಹೊರಬರಲು ಬಯಸುತ್ತೀರಾ?")) {
            localStorage.removeItem("ownerData");
            location.reload();
        }
    }
</script>

</body>
</html>
