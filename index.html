<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ಶಹಾಪುರ ಮಾರ್ಕೆಟ್ - ಶಾಪ್ ಓನರ್ & ಗ್ರಾಹಕ ಆ್ಯಪ್</title>
    <style>
        :root {
            --primary-yellow: #ffd814;
            --dark-bg: #131921;
            --light-gray: #f2f2f2;
            --green-success: #2e7d32;
            --red-cancel: #d9534f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--light-gray);
            color: #111;
            padding-bottom: 40px;
        }

        header {
            background-color: var(--dark-bg);
            color: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 15px;
            color: var(--primary-yellow);
        }

        .header-btns {
            display: flex;
            gap: 6px;
        }

        .screen {
            display: none;
            max-width: 500px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
        }

        .screen.active {
            display: block;
        }

        .card-box {
            padding: 16px;
            border-bottom: 8px solid #f0f0f0;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 4px;
            color: #333;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .btn-primary {
            background-color: #2e7d32;
            width: 100%;
            padding: 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 15px;
            color: white;
        }

        /* Owner Uploaded Item Row */
        .item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            gap: 10px;
        }

        .item-imgs {
            display: flex;
            gap: 5px;
        }

        .item-imgs img {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .item-info {
            flex: 1;
        }

        .delete-btn {
            background: var(--red-cancel);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Customer Product Grid */
        .cust-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            padding: 15px;
        }

        .cust-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .cust-card-imgs {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 8px;
        }

        .cust-card-imgs img {
            width: 48%;
            height: 180px;
            object-fit: cover;
            border-radius: 6px;
        }

        .owner-order-card {
            background: #fffde7;
            border: 1px solid #fbc02d;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <!-- 1. ಶಾಪ್ ಓನರ್ ಡ್ಯಾಶ್‌ಬೋರ್ಡ್ (ಮುಖ್ಯ ಪುಟ) -->
    <div id="screen-owner-dashboard" class="screen active">
        <header>
            <h1 id="header-shop-title">ಶಹಾಪುರ ಮಾರ್ಕೆಟ್ (ಅಂಗಡಿ ಮಾಲೀಕರ ಆ್ಯಪ್)</h1>
            <div class="header-btns">
                <button onclick="openOrdersListModal()" style="background:#28a745; color:white; border:none; padding:5px 8px; border-radius:4px; font-weight:bold; cursor:pointer; font-size:11px;">📦 ಆರ್ಡರ್ ನೋಡಿ</button>
                <button onclick="switchScreen('screen-customer-view')" style="background:#ffc107; color:#111; border:none; padding:5px 8px; border-radius:4px; font-weight:bold; cursor:pointer; font-size:11px;">👤 ಗ್ರಾಹಕ ವ್ಯೂ</button>
            </div>
        </header>

        <div class="card-box">
            <h3 style="font-size: 15px; margin-bottom: 12px; color:#0d47a1;">➕ ಹೊಸ ವಸ್ತು ಪ್ರಕಟಿಸಿ (Publish Product)</h3>
            <form id="upload-product-form" onsubmit="submitNewProduct(event)">
                <div class="form-group">
                    <label>ವಸ್ತುವಿನ ಹೆಸರು:</label>
                    <input type="text" id="prod-name" required placeholder="ಉದಾ: ಚಪ್ಪಲಿ / ಜೀನ್ಸ್ ಪ್ಯಾಂಟ್">
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex:1;">
                        <label>ಹಳೆಯ ರೇಟ್ (₹):</label>
                        <input type="number" id="prod-old-price" required placeholder="350">
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>ಈಗಿನ ಪ್ರೈಸ್ (₹):</label>
                        <input type="number" id="prod-curr-price" required placeholder="200">
                    </div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex:1;">
                        <label>ಎಷ್ಟು ಪೀಸ್ ಕೊಡ್ತಾ ಇದ್ದೀರಾ?:</label>
                        <select id="prod-pieces" required>
                            <option value="1 ಪೀಸ್">1 ಪೀಸ್</option>
                            <option value="2 ಪೀಸ್">2 ಪೀಸ್</option>
                            <option value="3 ಪೀಸ್">3 ಪೀಸ್</option>
                            <option value="4 ಪೀಸ್">4 ಪೀಸ್</option>
                            <option value="5 ಪೀಸ್">5 ಪೀಸ್</option>
                            <option value="6 ಪೀಸ್">6 ಪೀಸ್</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>ಸೈಜ್ / ನಂಬರ್ / ಅಳತೆ:</label>
                        <input type="text" id="prod-size" required placeholder="M / 8 / L">
                    </div>
                </div>
                <div class="form-group">
                    <label>ಮುಂಭಾಗದ ಫೋಟೋ ಅಪ್ಲೋಡ್ ಮಾಡಿ:</label>
                    <input type="file" id="prod-front-img" accept="image/*" required>
                </div>
                <div class="form-group">
                    <label>ಹಿಂಭಾಗದ ಫೋಟೋ ಅಪ್ಲೋಡ್ ಮಾಡಿ:</label>
                    <input type="file" id="prod-back-img" accept="image/*" required>
                </div>
                <button type="submit" class="btn-primary">ವಸ್ತು ಪ್ರಕಟಿಸಿ (Publish)</button>
            </form>
        </div>

        <div style="padding: 16px;">
            <h3 style="font-size: 15px; margin-bottom: 10px;"> ನಿಮ್ಮ ಅಂಗಡಿಯಲ್ಲಿರುವ ವಸ್ತುಗಳು:</h3>
            <div id="owner-uploaded-products-list">
                <!-- Uploaded items list with small images and delete button -->
            </div>
        </div>
    </div>

    <!-- 2. ಆರ್ಡರ್‌ಗಳನ್ನು ವೀಕ್ಷಿಸುವ ಪೇಜ್ (Modal) -->
    <div id="orders-list-modal" class="screen" style="position:fixed; top:0; left:0; right:0; bottom:0; z-index:200; background:white; display:none; max-width:500px; margin:0 auto; overflow-y:auto;">
        <header>
            <h1>ಬಂದಿರುವ ಆರ್ಡರ್‌ಗಳು (ಹೊಸದು ಮೇಲೆ)</h1>
            <button onclick="closeOrdersListModal()" style="background:none; border:none; color:white; font-size:22px; cursor:pointer;">&times;</button>
        </header>
        <div style="padding: 16px;" id="owner-incoming-orders-list">
            <!-- Incoming orders (new on top) -->
        </div>
    </div>

    <!-- 3. ಗ್ರಾಹಕರ ಮುಖಪುಟ (Customer View Page) -->
    <div id="screen-customer-view" class="screen">
        <header>
            <h1>ಗ್ರಾಹಕರ ಶಾಪಿಂಗ್ ಪುಟ</h1>
            <button onclick="switchScreen('screen-owner-dashboard')" style="background:#ffc107; border:none; padding:5px 10px; border-radius:4px; font-weight:bold; cursor:pointer; font-size:11px;">← ಓನರ್ ಡ್ಯಾಶ್‌ಬೋರ್ಡ್</button>
        </header>
        <div id="customer-products-grid" class="cust-grid">
            <!-- Products from owner will automatically appear here -->
        </div>
    </div>

    <script>
        let shopProducts = JSON.parse(localStorage.getItem('ar_shop_products')) || [];
        let ownerOrders = JSON.parse(localStorage.getItem('ar_owner_orders')) || [];

        window.onload = function() {
            renderOwnerProducts();
            renderCustomerProducts();
        };

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            window.scrollTo(0,0);
            if(screenId === 'screen-customer-view') renderCustomerProducts();
        }

        function openOrdersListModal() {
            renderIncomingOrders();
            document.getElementById('orders-list-modal').style.display = 'block';
        }

        function closeOrdersListModal() {
            document.getElementById('orders-list-modal').style.display = 'none';
        }

        function submitNewProduct(event) {
            event.preventDefault();
            let name = document.getElementById('prod-name').value;
            let oldPrice = document.getElementById('prod-old-price').value;
            let currPrice = document.getElementById('prod-curr-price').value;
            let pieces = document.getElementById('prod-pieces').value;
            let size = document.getElementById('prod-size').value;

            let frontFile = document.getElementById('prod-front-img').files[0];
            let backFile = document.getElementById('prod-back-img').files[0];

            let frontImgUrl = frontFile ? URL.createObjectURL(frontFile) : 'https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?w=600';
            let backImgUrl = backFile ? URL.createObjectURL(backFile) : 'https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?w=600';

            let newProd = {
                id: Date.now(),
                name: name,
                oldPrice: oldPrice,
                currPrice: currPrice,
                pieces: pieces,
                size: size,
                frontImg: frontImgUrl,
                backImg: backImgUrl
            };

            shopProducts.unshift(newProd); // Add new product to top
            localStorage.setItem('ar_shop_products', JSON.stringify(shopProducts));
            
            renderOwnerProducts();
            renderCustomerProducts();
            document.getElementById('upload-product-form').reset();
            alert("ನಿಮ್ಮ ಫೋಟೋ ಅಪ್ಲೋಡ್ ಆಗಿ ಗ್ರಾಹಕರ ಪೇಜಿಗೆ ಕಳುಹಿಸಲಾಗಿದೆ!");
        }

        function renderOwnerProducts() {
            let list = document.getElementById('owner-uploaded-products-list');
            list.innerHTML = '';
            if (shopProducts.length === 0) {
                list.innerHTML = '<p style="color:#666; font-size:13px;">ಯಾವುದೇ ವಸ್ತುಗಳನ್ನು ಅಪ್‌ಲೋಡ್ ಮಾಡಿಲ್ಲ.</p>';
                return;
            }
            shopProducts.forEach((p) => {
                list.innerHTML += `
                    <div class="item-row">
                        <div class="item-imgs">
                            <img src="${p.frontImg}" alt="Front">
                            <img src="${p.backImg}" alt="Back">
                        </div>
                        <div class="item-info">
                            <strong>${p.name} (${p.size})</strong><br>
                            <span style="color:#b12704; font-weight:bold;">₹${p.currPrice}</span> 
                            <span style="text-decoration:line-through; color:#777; font-size:12px;">₹${p.oldPrice}</span><br>
                            <span style="font-size:12px; color:#555;">${p.pieces}</span>
                        </div>
                        <button class="delete-btn" onclick="deleteProduct(${p.id})">ಡಿಲೀಟ್</button>
                    </div>
                `;
            });
        }

        function deleteProduct(id) {
            if (confirm("ಈ ವಸ್ತುವನ್ನು ಡಿಲೀಟ್ ಮಾಡಲು ಬಯಸುತ್ತೀರಾ?")) {
                shopProducts = shopProducts.filter(p => p.id !== id);
                localStorage.setItem('ar_shop_products', JSON.stringify(shopProducts));
                renderOwnerProducts();
                renderCustomerProducts();
                alert("ವಸ್ತು ಯಶಸ್ವಿಯಾಗಿ ಡಿಲೀಟ್ ಆಗಿದೆ.");
            }
        }

        function renderCustomerProducts() {
            let grid = document.getElementById('customer-products-grid');
            grid.innerHTML = '';
            if (shopProducts.length === 0) {
                grid.innerHTML = '<p style="color:#666; text-align:center; padding:20px;">ಯಾವುದೇ ವಸ್ತುಗಳು ಲಭ್ಯವಿಲ್ಲ.</p>';
                return;
            }
            shopProducts.forEach((p) => {
                grid.innerHTML += `
                    <div class="cust-card">
                        <div class="cust-card-imgs">
                            <img src="${p.frontImg}" alt="Front">
                            <img src="${p.backImg}" alt="Back">
                        </div>
                        <h3 style="font-size:16px; margin-bottom:4px;">${p.name}</h3>
                        <p style="font-size:13px; color:#555;">ಸೈಜ್: ${p.size} | ${p.pieces}</p>
                        <p style="font-size:18px; font-weight:bold; color:#0F1111; margin:6px 0;">₹${p.currPrice} <span style="text-decoration:line-through; color:#777; font-size:13px;">₹${p.oldPrice}</span></p>
                        <button onclick="simulateCustomerOrder('${p.name}', '${p.currPrice}')" style="background:var(--primary-yellow); border:none; width:100%; padding:10px; border-radius:20px; font-weight:bold; cursor:pointer;">ಈಗಲೇ ಖರೀದಿಸಿ (Order)</button>
                    </div>
                `;
            });
        }

        function simulateCustomerOrder(prodName, price) {
            let newOrder = {
                id: 'ORD' + Math.floor(1000 + Math.random() * 9000),
                title: prodName,
                size: 'M',
                qty: '1 ಪೀಸ್',
                amount: price,
                customer: { name: 'ಅನಿಲ್ ರಾಥೋಡ್', phone: '8105010768', village: 'ಶಹಾಪುರ', taluk: 'ಶಹಾಪುರ', district: 'ಯಾದಗಿರಿ', gps: 'Lat: 16.7390, Lng: 76.7977' },
                status: 'ಆರ್ಡರ್ ಕನ್ಫರ್ಮ್ ಆಗಿದೆ'
            };
            ownerOrders.unshift(newOrder); // New orders on top
            localStorage.setItem('ar_owner_orders', JSON.stringify(ownerOrders));
            alert("ಆರ್ಡರ್ ಯಶಸ್ವಿಯಾಗಿ ಅಂಗಡಿ ಮಾಲೀಕರಿಗೆ ಕಳುಹಿಸಲಾಗಿದೆ!");
        }

        function renderIncomingOrders() {
            let container = document.getElementById('owner-incoming-orders-list');
            container.innerHTML = '';
            if (ownerOrders.length === 0) {
                container.innerHTML = '<p style="color:#666; font-size:13px;">ಯಾವುದೇ ಹೊಸ ಆರ್ಡರ್‌ಗಳು ಬಂದಿಲ್ಲ.</p>';
                return;
            }
            ownerOrders.forEach((ord) => {
                container.innerHTML += `
                    <div class="owner-order-card">
                        <strong>ಗ್ರಾಹಕರು: ${ord.customer.name} (${ord.customer.phone})</strong><br>
                        <span style="font-size:13px;">ವಿಳಾಸ: ${ord.customer.village}, ${ord.customer.taluk}</span><br>
                        <span style="font-size:13px; color:#007bff;">GPS: ${ord.customer.gps}</span><br>
                        <span style="font-size:13px; font-weight:bold;">ವಸ್ತು: ${ord.title} (ಮೊತ್ತ: ₹${ord.amount})</span><br>
                        <span style="font-size:13px; color:var(--green-success); font-weight:bold;">ಸ್ಥಿತಿ: ${ord.status}</span>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
