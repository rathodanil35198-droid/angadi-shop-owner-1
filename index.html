<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಶಹಾಪುರ ಮಾರ್ಕೆಟ್ - ಅಂಗಡಿ ಮಾಲೀಕರ ಪೇಜ್</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding-bottom: 30px;
        }

        .header {
            background-color: #4a3aff;
            color: white;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            position: relative;
        }

        .header h2 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .logout-btn {
            position: absolute;
            right: 15px;
            top: 15px;
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            display: none;
        }

        .container {
            max-width: 500px;
            margin: 15px auto;
            padding: 0 15px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 18px;
            color: #2c3e50;
            margin-bottom: 15px;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .row .form-group {
            flex: 1;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-primary {
            background-color: #4a3aff;
            color: white;
        }

        .btn-success {
            background-color: #2ed573;
            color: white;
        }

        /* Category & Dynamic Size Buttons */
        .size-box-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 5px;
        }

        .size-btn {
            padding: 8px 14px;
            border: 1px solid #007185;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            color: #0f1111;
        }

        .size-btn.selected {
            border: 2px solid #007185;
            background-color: #edfdff;
            color: #007185;
        }

        .dashboard-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .nav-action-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            background: #e4e7eb;
            color: #333;
        }

        .nav-action-btn.active {
            background: #4a3aff;
            color: white;
        }

        /* Product Card & Full Image Display */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 15px;
        }

        .product-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            position: relative;
            text-align: center;
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .image-container {
            width: 100%;
            height: 140px;
            background-color: #f8fafc;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px dashed #cbd5e1;
            margin-bottom: 8px;
        }

        .product-card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* ಫೋಟೋ ಕತ್ತರಿಸದೆ ಪೂರ್ತಿಯಾಗಿ ಕಾಣಲು */
            border-radius: 4px;
            cursor: pointer;
        }

        .product-title {
            font-weight: bold;
            font-size: 14px;
            margin: 4px 0;
            color: #1e293b;
        }

        .product-price {
            font-size: 13px;
            color: #16a34a;
            font-weight: bold;
        }

        .product-old-price {
            text-decoration: line-through;
            color: #94a3b8;
            font-size: 12px;
            margin-right: 5px;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 8px;
            width: 100%;
            font-weight: bold;
        }

        /* Modal / Popup */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .id-badge {
            background: #4a3aff;
            color: white;
            font-size: 22px;
            font-weight: bold;
            padding: 10px;
            border-radius: 8px;
            margin: 15px 0;
            letter-spacing: 2px;
        }

        /* Full Zoom Modal */
        .zoom-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .zoom-modal img {
            max-width: 95%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 8px;
        }

        .close-zoom {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 32px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>🏪 ಶಹಾಪುರ ಮಾರ್ಕೆಟ್</h2>
        <p style="font-size: 12px;" id="headerSubtitle">ಅಂಗಡಿ ಮಾಲೀಕರ ಆಪ್</p>
        <button class="logout-btn" id="logoutBtn" onclick="logout()">ಬಾಹಿರ (Logout)</button>
    </div>

    <div class="container">

        <!-- AUTHENTICATION -->
        <div id="authSection">
            <div id="vendorAuthBox" class="card">
                <h3 class="card-title">ಅಂಗಡಿ ಮಾಲೀಕರ ನೋಂದಣಿ / ಲಾಗಿನ್</h3>
                
                <div class="form-group">
                    <label>ಮಾಲೀಕರ ಹೆಸರು:</label>
                    <input type="text" id="regName" placeholder="ನಿಮ್ಮ ಹೆಸರು ನಮೂದಿಸಿ">
                </div>

                <div class="form-group">
                    <label>ಮೊಬೈಲ್ ಸಂಖ್ಯೆ:</label>
                    <input type="tel" id="regPhone" placeholder="10 ಅಂಕಿಗಳ ಮೊಬೈಲ್ ಸಂಖ್ಯೆ">
                </div>

                <div class="form-group">
                    <label>ಅಂಗಡಿಯ ಹೆಸರು:</label>
                    <input type="text" id="regShopName" placeholder="ಅಂಗಡಿಯ ಹೆಸರು ಹಾಕಿ">
                </div>

                <div class="form-group">
                    <label>ಅಂಗಡಿಯ ವಿಧ (Category):</label>
                    <select id="regCategory">
                        <option value="ಬಟ್ಟೆ ಅಂಗಡಿ">ಬಟ್ಟೆ ಅಂಗಡಿ (Clothing)</option>
                        <option value="ಚಪ್ಪಲಿ & ಶೂಸ್ ಅಂಗಡಿ">ಚಪ್ಪಲಿ & ಶೂಸ್ ಅಂಗಡಿ</option>
                        <option value="ಗಿಫ್ಟ್ ಅಂಗಡಿ">ಗಿಫ್ಟ್ & ಜನರಲ್ ಸ್ಟೋರ್</option>
                        <option value="ಎಲೆಕ್ಟ್ರಿಸಿಟಿ & ಇಲೆಕ್ಟ್ರಾನಿಕ್ಸ್">ಎಲೆಕ್ಟ್ರಿಸಿಟಿ & ಇಲೆಕ್ಟ್ರಾನಿಕ್ಸ್</option>
                        <option value="ಇತರೆ">ಇತರೆ</option>
                    </select>
                </div>

                <button class="btn btn-primary" onclick="handleVendorRegister()">ಖಾತೆ ಸೃಷ್ಟಿಸಿ & ಮುಂದುವರಿಸಿ</button>
                
                <div style="margin-top: 15px; text-align: center; border-top: 1px solid #eee; padding-top: 10px;">
                    <p style="font-size: 13px; margin-bottom: 8px;">ಹಳೆಯ ಮಾಲೀಕರ ಐಡಿ ಇದ್ದರೆ ಲಾಗಿನ್ ಆಗಿ:</p>
                    <input type="number" id="vendorLoginId" placeholder="4 ಅಂಕಿಗಳ ವೆಂಡರ್ ಕೋಡ್" style="margin-bottom: 8px; padding: 8px; width: 100%; border: 1px solid #ccc; border-radius: 6px;">
                    <button class="btn btn-success" style="padding: 8px;" onclick="handleVendorLogin()">ವೆಂಡರ್ ಕೋಡ್ ಮೂಲಕ ಲಾಗಿನ್</button>
                </div>
            </div>
        </div>

        <!-- VENDOR DASHBOARD -->
        <div id="vendorDashboardSection" style="display: none;">
            <div class="dashboard-nav">
                <button class="nav-action-btn active" id="btnUploadTab" onclick="switchDashboardTab('upload')">➕ ವಸ್ತು ಅಪ್ಲೋಡ್</button>
                <button class="nav-action-btn" id="btnOrdersTab" onclick="switchDashboardTab('orders')">📦 ಆರ್ಡರ್ ನೋಡಿ</button>
            </div>

            <!-- UPLOAD FORM TAB -->
            <div id="uploadTabContent">
                <div class="card">
                    <h3 class="card-title">➕ ಹೊಸ ವಸ್ತುವಿನ ವಿವರ ಮತ್ತು ಫೋಟೋ ಹಾಕಿ</h3>

                    <div class="form-group">
                        <label>ವಸ್ತುವಿನ ಪ್ರಕಾರ (Category):</label>
                        <select id="itemCategory" onchange="updateSizeOptions()">
                            <option value="shirts">ಶರ್ಟ್ / ಟೀ-ಶರ್ಟ್ (Shirt / T-Shirt)</option>
                            <option value="pants">ಪ್ಯಾಂಟ್ (Pants / Jeans)</option>
                            <option value="footwear">ಚಪ್ಪಲಿ / ಶೂಸ್ (Footwear)</option>
                            <option value="gifts">ಗಿಫ್ಟ್ / ಜನರಲ್ ಸ್ಟೋರ್</option>
                            <option value="other">ಇತರೆ ವಸ್ತುಗಳು</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>ವಸ್ತುವಿನ ಹೆಸರು:</label>
                        <input type="text" id="prodName" placeholder="ಉದಾ: ಜೀನ್ಸ್ ಪ್ಯಾಂಟ್, ಸ್ಪೋರ್ಟ್ಸ್ ಶೂಸ್">
                    </div>

                    <!-- DYNAMIC SIZE OPTIONS -->
                    <div class="form-group">
                        <label>ಸೈಜ್ / ಅಳತೆ ಆಯ್ಕೆ ಮಾಡಿ (Size):</label>
                        <div id="sizeOptionsContainer" class="size-box-container">
                            <!-- JS Code builds buttons here dynamically -->
                        </div>
                    </div>

                    <div class="row">
                        <div class="form-group">
                            <label>ಹಳೆಯ ರೇಟ್ (₹):</label>
                            <input type="number" id="prodOldPrice" placeholder="500">
                        </div>
                        <div class="form-group">
                            <label>ಈಗಿನ ರೇಟ್ (₹):</label>
                            <input type="number" id="prodNewPrice" placeholder="350">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>ಎಷ್ಟು ಪೀಸ್ ಕೊಡ್ತಾ ಇದ್ದೀರಾ (ಕ್ವಾಂಟಿಟಿ)?</label>
                        <select id="prodQuantity">
                            <option value="1 ಪೀಸ್">1 ಪೀಸ್</option>
                            <option value="2 ಪೀಸ್">2 ಪೀಸ್</option>
                            <option value="3 ಪೀಸ್">3 ಪೀಸ್</option>
                            <option value="4 ಪೀಸ್">4 ಪೀಸ್</option>
                            <option value="10 ಪೀಸ್">10 ಪೀಸ್</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>ಮುಂಭಾಗದ ಫೋಟೋ (Front View):</label>
                        <input type="file" id="prodFrontImg" accept="image/*" capture="environment">
                    </div>

                    <div class="form-group">
                        <label>ಹಿಂಭಾಗದ ಫೋಟೋ (Back View):</label>
                        <input type="file" id="prodBackImg" accept="image/*" capture="environment">
                    </div>

                    <button class="btn btn-success" onclick="uploadProduct()">ವಸ್ತು ಪ್ರಕಟಿಸಿ (Publish)</button>
                </div>

                <div class="card">
                    <h3 class="card-title">📦 ನಿಮ್ಮ ಅಂಗಡಿಯಲ್ಲಿರುವ ವಸ್ತುಗಳು</h3>
                    <div id="productGrid" class="product-grid"></div>
                </div>
            </div>

            <!-- ORDERS TAB -->
            <div id="ordersTabContent" style="display: none;">
                <div class="card">
                    <h3 class="card-title">📥 ಗ್ರಾಹಕರಿಂದ ಬಂದಿರುವ ಆರ್ಡರ್‌ಗಳು</h3>
                    <div id="ordersListContainer">
                        <p style="text-align: center; color: #777; padding: 20px;">ಸದ್ಯಕ್ಕೆ ಯಾವುದೇ ಹೊಸ ಆರ್ಡರ್‌ಗಳಿಲ್ಲ.</p>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- POPUP MODAL -->
    <div id="customModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle" style="color: #2ed573; margin-bottom: 10px;">ಸಂದೇಶ</h3>
            <p id="modalMessage"></p>
            <div id="modalExtra"></div>
            <button class="btn btn-primary" style="margin-top: 15px;" onclick="closeModal()">ಸರಿ (OK)</button>
        </div>
    </div>

    <!-- FULL IMAGE ZOOM MODAL -->
    <div id="zoomModal" class="zoom-modal" onclick="closeZoom()">
        <span class="close-zoom">&times;</span>
        <img id="zoomImage" src="" alt="Zoomed Image">
    </div>

    <script>
        let currentVendorId = localStorage.getItem('activeVendorCode') || null;
        let selectedSize = "";

        window.onload = function() {
            updateSizeOptions();
            if (currentVendorId) {
                showDashboard();
            }
        };

        // Category vs Size Mapping
        function updateSizeOptions() {
            const cat = document.getElementById('itemCategory').value;
            const container = document.getElementById('sizeOptionsContainer');
            container.innerHTML = '';
            selectedSize = "";

            let sizes = [];
            if (cat === 'shirts') {
                sizes = ['S', 'M', 'L', 'XL', '2XL', '3XL'];
            } else if (cat === 'pants') {
                sizes = ['28', '30', '32', '34', '36', '38'];
            } else if (cat === 'footwear') {
                sizes = ['5 UK', '6 UK', '7 UK', '8 UK', '9 UK', '10 UK', '11 UK', '12 UK'];
            } else if (cat === 'gifts') {
                sizes = ['3.7 inch', '4 inch', '5.3 inch', 'Standard'];
            } else {
                sizes = ['Free Size', 'Standard'];
            }

            sizes.forEach((s, idx) => {
                const btn = document.createElement('button');
                btn.className = 'size-btn';
                btn.type = 'button';
                btn.innerText = s;
                if (idx === 0) {
                    btn.classList.add('selected');
                    selectedSize = s;
                }
                btn.onclick = function() {
                    document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectedSize = s;
                };
                container.appendChild(btn);
            });
        }

        function switchDashboardTab(tab) {
            const btnUpload = document.getElementById('btnUploadTab');
            const btnOrders = document.getElementById('btnOrdersTab');
            const uploadContent = document.getElementById('uploadTabContent');
            const ordersContent = document.getElementById('ordersTabContent');

            if(tab === 'upload') {
                btnUpload.classList.add('active');
                btnOrders.classList.remove('active');
                uploadContent.style.display = 'block';
                ordersContent.style.display = 'none';
            } else {
                btnOrders.classList.add('active');
                btnUpload.classList.remove('active');
                uploadContent.style.display = 'none';
                ordersContent.style.display = 'block';
                renderVendorOrders();
            }
        }

        function handleVendorRegister() {
            const name = document.getElementById('regName').value;
            const phone = document.getElementById('regPhone').value;
            const shopName = document.getElementById('regShopName').value;

            if(!name || !phone || !shopName) {
                alert("ದಯವಿಟ್ಟು ಎಲ್ಲಾ ಅಗತ್ಯ ವಿವರಗಳನ್ನು ಭರ್ತಿ ಮಾಡಿ!");
                return;
            }

            const vendorCode = Math.floor(1000 + Math.random() * 9000);
            localStorage.setItem('activeVendorCode', vendorCode);
            currentVendorId = vendorCode;

            showModal(
                "ನೋಂದಣಿ ಯಶಸ್ವಿಯಾಗಿದೆ! 🎉",
                "ನಿಮ್ಮ ವೆಂಡರ್ ಡಿಜಿಟಲ್ ಐಡಿ ಕೋಡ್ ಇಲ್ಲಿದೆ. ಇದನ್ನು ಗಮನದಲ್ಲಿಡಿ:",
                `<div class="id-badge">${vendorCode}</div>`
            );
        }

        function handleVendorLogin() {
            const code = document.getElementById('vendorLoginId').value;
            if(!code || code.length !== 4) {
                alert("ಸರಿಯಾದ 4 ಅಂಕಿಗಳ ಕೋಡ್ ಹಾಕಿ!");
                return;
            }
            localStorage.setItem('activeVendorCode', code);
            currentVendorId = code;
            showDashboard();
        }

        function showDashboard() {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('vendorDashboardSection').style.display = 'block';
            document.getElementById('logoutBtn').style.display = 'block';
            document.getElementById('headerSubtitle').innerText = "ಅಂಗಡಿ ಮಾಲೀಕರ ಆಪ್ (ಕೋಡ್: " + currentVendorId + ")";
            renderVendorProducts();
        }

        function logout() {
            localStorage.removeItem('activeVendorCode');
            location.reload();
        }

        // Photo Base64 Uploader Function
        function uploadProduct() {
            const name = document.getElementById('prodName').value;
            const oldPrice = document.getElementById('prodOldPrice').value;
            const newPrice = document.getElementById('prodNewPrice').value;
            const qty = document.getElementById('prodQuantity').value;
            const frontFile = document.getElementById('prodFrontImg').files[0];

            if(!name || !newPrice) {
                alert("ವಸ್ತುವಿನ ಹೆಸರು ಮತ್ತು ಹೊಸ ಬೆಲೆ ನಮೂದಿಸಿ!");
                return;
            }

            const saveItem = (base64Img) => {
                const newProduct = {
                    id: Date.now(),
                    vendorCode: currentVendorId,
                    name: name,
                    size: selectedSize,
                    oldPrice: oldPrice,
                    newPrice: newPrice,
                    qty: qty,
                    img: base64Img
                };

                let products = JSON.parse(localStorage.getItem('products')) || [];
                products.push(newProduct);
                localStorage.setItem('products', JSON.stringify(products));

                // Clear Form
                document.getElementById('prodName').value = '';
                document.getElementById('prodOldPrice').value = '';
                document.getElementById('prodNewPrice').value = '';
                document.getElementById('prodFrontImg').value = '';
                document.getElementById('prodBackImg').value = '';

                renderVendorProducts();

                showModal(
                    "ಸಕ್ಸೆಸ್‌ಫುಲ್! 🟢",
                    "ನಿಮ್ಮ ಫೋಟೋ ಹಾಗೂ ವಸ್ತುವಿನ ವಿವರಗಳನ್ನು ಯಶಸ್ವಿಯಾಗಿ ಅಪ್ಲೋಡ್ ಮಾಡಲಾಗಿದೆ.",
                    ""
                );
            };

            if (frontFile) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    saveItem(e.target.result);
                };
                reader.readAsDataURL(frontFile);
            } else {
                saveItem("https://via.placeholder.com/150");
            }
        }

        function renderVendorProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            let products = JSON.parse(localStorage.getItem('products')) || [];
            const myProds = products.filter(p => p.vendorCode == currentVendorId);

            if(myProds.length === 0) {
                grid.innerHTML = '<p style="grid-column: span 2; text-align: center; color: #777;">ಯಾವುದೇ ವಸ್ತುಗಳಿಲ್ಲ.</p>';
                return;
            }

            myProds.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card">
                        <div class="image-container" onclick="openZoom('${p.img}')">
                            <img src="${p.img}" alt="${p.name}">
                        </div>
                        <div class="product-title">${p.name}</div>
                        <div style="font-size: 11px; color: #007185; font-weight: bold;">ಸೈಜ್: ${p.size || 'Standard'}</div>
                        <div>
                            ${p.oldPrice ? `<span class="product-old-price">₹${p.oldPrice}</span>` : ''}
                            <span class="product-price">₹${p.newPrice}</span>
                        </div>
                        <div style="font-size: 11px; color: #64748b;">(${p.qty})</div>
                        <button class="delete-btn" onclick="deleteProduct(${p.id})">ಡಿಲೀಟ್ (Delete)</button>
                    </div>
                `;
            });
        }

        function renderVendorOrders() {
            const container = document.getElementById('ordersListContainer');
            container.innerHTML = '';
            let orders = JSON.parse(localStorage.getItem('orders')) || [];
            const myOrders = orders.filter(o => o.vendorCode == currentVendorId);

            if(myOrders.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #777; padding: 20px;">ಸದ್ಯಕ್ಕೆ ಯಾವುದೇ ಹೊಸ ಆರ್ಡರ್‌ಗಳಿಲ್ಲ.</p>';
                return;
            }

            myOrders.forEach(o => {
                container.innerHTML += `
                    <div style="background: #f8fafc; padding: 12px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #4a3aff;">
                        <p><b>ವಸ್ತು:</b> ${o.productName}</p>
                        <p><b>ಬೆಲೆ:</b> ₹${o.price}</p>
                        <p><b>ಗ್ರಾಹಕ ಕೋಡ್:</b> ${o.customerCode}</p>
                        <p><b>ಸ್ಥಿತಿ:</b> <span style="color: #4a3aff; font-weight: bold;">${o.status || 'ಹೊಸ ಆರ್ಡರ್'}</span></p>
                        <button class="btn btn-primary" style="padding: 8px; font-size: 13px; margin-top: 8px;" onclick="sendToDelivery(${o.id})">🛵 ಪ್ಯಾಕ್ ಮಾಡಿ ಡೆಲಿವರಿ ಬಾಯ್‌ಗೆ ತಲುಪಿಸಿ</button>
                    </div>
                `;
            });
        }

        function sendToDelivery(orderId) {
            let orders = JSON.parse(localStorage.getItem('orders')) || [];
            orders = orders.map(o => {
                if(o.id === orderId) {
                    o.status = "ಪ್ಯಾಕ್ ಆಗಿದೆ - ಡೆಲಿವರಿ ಬಾಯ್ 3:00 ಗಂಟೆಗೆ ತಲುಪಿಸುತ್ತಾರೆ 🛵";
                }
                return o;
            });
            localStorage.setItem('orders', JSON.stringify(orders));
            alert("ಆರ್ಡರ್ ಯಶಸ್ವಿಯಾಗಿ ಪ್ಯಾಕ್ ಮಾಡಿ ಡೆಲಿವರಿ ಬಾಯ್‌ಗೆ ರವಾನಿಸಲಾಗಿದೆ! 🛵");
            renderVendorOrders();
        }

        function deleteProduct(id) {
            let products = JSON.parse(localStorage.getItem('products')) || [];
            products = products.filter(p => p.id !== id);
            localStorage.setItem('products', JSON.stringify(products));
            renderVendorProducts();
        }

        function openZoom(imgSrc) {
            document.getElementById('zoomImage').src = imgSrc;
            document.getElementById('zoomModal').style.display = 'flex';
        }

        function closeZoom() {
            document.getElementById('zoomModal').style.display = 'none';
        }

        function closeModal() {
            document.getElementById('customModal').style.display = 'none';
            if(currentVendorId) showDashboard();
        }

        function showModal(title, message, extraHtml) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            document.getElementById('modalExtra').innerHTML = extraHtml;
            document.getElementById('customModal').style.display = 'flex';
        }
    </script>
</body>
</html>
