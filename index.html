<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಅಂಗಡಿ ಮಾಲೀಕರ ಆಪ್ - Shop Owner Panel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-border {
            0%, 100% { border-color: #ef4444; }
            50% { border-color: #f59e0b; }
        }
        .new-order-pulse { animation: pulse-border 1.2s infinite; }
    </style>
</head>
<body class="bg-slate-100 font-sans min-h-screen text-slate-800 pb-10">

    <!-- ========================================== -->
    <!-- SECTION 1: ಲಾಗಿನ್ / ನೋಂದಣಿ ಪೇಜ್ (LOGIN PAGE) -->
    <!-- ========================================== -->
    <div id="loginPage" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl p-6 overflow-y-auto max-h-[95vh]">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-black text-indigo-700">🏪 ನನ್ನ ಲೋಕಲ್ ಶಾಪ್</h1>
                <p class="text-xs text-slate-500 mt-1">ಅಂಗಡಿ ಮಾಲೀಕರ ಸುರಕ್ಷಿತ ಲಾಗಿನ್ ವ್ಯವಸ್ಥೆ</p>
            </div>

            <!-- Tabs: ಲಾಗಿನ್ / ಹೊಸ ನೋಂದಣಿ -->
            <div class="flex bg-slate-100 p-1 rounded-xl mb-6">
                <button onclick="switchTab('login')" id="tabLoginBtn" class="flex-1 py-2 text-xs font-bold rounded-lg bg-indigo-600 text-white shadow">
                    🔐 4-ಡಿಜಿಟ್ ಪಿನ್ ಲಾಗಿನ್
                </button>
                <button onclick="switchTab('register')" id="tabRegBtn" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-600">
                    ಹೊಸ ನೋಂದಣಿ
                </button>
            </div>

            <!-- Tab 1: 4-Digit Login Form -->
            <div id="loginTab">
                <form onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">ನಿಮ್ಮ 4-ಡಿಜಿಟ್ ಲಾಗಿನ್ ಪಿನ್ ಕೋಡ್</label>
                        <input type="password" id="loginPin" maxlength="4" placeholder="****" required class="w-full text-center tracking-widest text-xl font-bold p-3 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl text-sm transition-all shadow-md">
                        ಲಾಗಿನ್ ಮಾಡಿ (Enter Shop)
                    </button>
                </form>
            </div>

            <!-- Tab 2: New Registration Form -->
            <div id="registerTab" class="hidden space-y-3">
                <form onsubmit="handleRegister(event)" class="space-y-3">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-700">ಮಾಲೀಕರ ಹೆಸರು</label>
                        <input type="text" id="regOwnerName" required placeholder="ಉದಾ: ಆನಂದ್" class="w-full p-2 border rounded-xl text-xs outline-none">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[11px] font-bold text-slate-700">ಮೊಬೈಲ್ ನಂಬರ್</label>
                            <input type="tel" id="regPhone" required placeholder="9876543210" class="w-full p-2 border rounded-xl text-xs outline-none">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-slate-700">ಅಂಗಡಿಯ ಹೆಸರು</label>
                            <input type="text" id="regShopName" required placeholder="ಶ್ರೀ ರಾಮ ಟ್ರೇಡರ್ಸ್" class="w-full p-2 border rounded-xl text-xs outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-slate-700">ಅಂಗಡಿಯ ಪ್ರಕಾರ (Category)</label>
                        <select id="regCategory" required class="w-full p-2 border rounded-xl text-xs outline-none bg-white">
                            <option value="">ಅಂಗಡಿ ಆಯ್ಕೆ ಮಾಡಿ...</option>
                            <option value="👗 ಬಟ್ಟೆ ಅಂಗಡಿ">👗 ಬಟ್ಟೆ ಅಂಗಡಿ</option>
                            <option value="👟 ಚಪ್ಪಲಿ ಮತ್ತು ಶೂಸ್">👟 ಚಪ್ಪಲಿ ಮತ್ತು ಶೂಸ್</option>
                            <option value="🎁 ಗಿಫ್ಟ್ ಮತ್ತು ಸ್ಟೇಷನರಿ">🎁 ಗಿಫ್ಟ್ ಮತ್ತು ಸ್ಟೇಷನರಿ</option>
                            <option value="⚡ ಎಲೆಕ್ಟ್ರಾನಿಕ್ಸ್">⚡ ಎಲೆಕ್ಟ್ರಾನಿಕ್ಸ್ & ಗ್ಯಾಡ್ಜೆಟ್ಸ್</option>
                            <option value="🛒 ಕಿರಾಣಿ/ದಿನಸಿ">🛒 ಕಿರಾಣಿ/ದಿನಸಿ</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="block text-[11px] font-bold text-slate-700">ಜಿಲ್ಲೆ</label>
                            <input type="text" required placeholder="ಕೊಪ್ಪಳ" class="w-full p-2 border rounded-xl text-xs outline-none">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-slate-700">ತಾಲೂಕು</label>
                            <input type="text" required placeholder="ತಾಲೂಕು" class="w-full p-2 border rounded-xl text-xs outline-none">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-slate-700">ಪಿನ್ ಕೋಡ್</label>
                            <input type="text" required placeholder="583231" class="w-full p-2 border rounded-xl text-xs outline-none">
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-xs transition-all shadow-md mt-2">
                        📝 ನೋಂದಾಯಿಸಿ & 4-ಡಿಜಿಟ್ ಐಡಿ ಪಡೆಯಿರಿ
                    </button>
                </form>
            </div>
        </div>
    </div>


    <!-- ========================================== -->
    <!-- SECTION 2: ಮುಖ್ಯ ಡ್ಯಾಶ್‌ಬೋರ್ಡ್ (MAIN DASHBOARD) -->
    <!-- ========================================== -->
    <header class="bg-indigo-700 text-white p-4 shadow-lg sticky top-0 z-40">
        <div class="max-w-6xl mx-auto flex justify-between items-center flex-wrap gap-2">
            <div>
                <h1 id="shopHeaderTitle" class="text-lg font-bold flex items-center gap-2">🏪 ನನ್ನ ಲೋಕಲ್ ಶಾಪ್ Panel</h1>
                <p id="shopHeaderCategory" class="text-xs text-indigo-200">ಐಡಿ: #8492 | ಕಿರಾಣಿ ಅಂಗಡಿ</p>
            </div>
            
            <div class="flex items-center gap-2">
                <button onclick="openOrdersModal()" class="bg-amber-400 hover:bg-amber-500 text-indigo-950 font-bold text-xs px-3 py-2 rounded-xl shadow flex items-center gap-1 transition-all">
                    📋 ಆರ್ಡರ್ ನೋಡಿ (<span id="topOrderBadge">0</span>)
                </button>
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white text-xs px-2.5 py-2 rounded-xl font-bold shadow-sm">
                    🚪 ಲಾಗ್ ಔಟ್
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 space-y-6">

        <!-- ತಿಂಗಳ ಲೆಕ್ಕಾಚಾರಗಳು -->
        <section class="grid grid-cols-3 gap-3">
            <div class="bg-white p-3.5 rounded-2xl border shadow-sm text-center">
                <p class="text-[11px] font-bold text-slate-500">ತಿಂಗಳ ಆರ್ಡರ್</p>
                <p id="statTotalOrders" class="text-lg font-black text-indigo-700 mt-1">0</p>
            </div>
            <div class="bg-white p-3.5 rounded-2xl border shadow-sm text-center">
                <p class="text-[11px] font-bold text-slate-500">ರಿಟರ್ನ್ ಬಂದದ್ದು</p>
                <p id="statReturns" class="text-lg font-black text-red-600 mt-1">0</p>
            </div>
            <div class="bg-white p-3.5 rounded-2xl border shadow-sm text-center">
                <p class="text-[11px] font-bold text-slate-500">ಒಟ್ಟು ಸಂಪಾದನೆ</p>
                <p id="statEarnings" class="text-lg font-black text-emerald-600 mt-1">₹0</p>
            </div>
        </section>

        <!-- ಆಕ್ಷನ್ ಬಟನ್‌ಗಳು -->
        <section class="flex gap-3">
            <button onclick="openAddProductModal()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-2xl shadow-md text-sm flex items-center justify-center gap-2 transition-all">
                ➕ ಹೊಸ ಪ್ರಾಡಕ್ಟ್ / ಫೋಟೋ ಹಾಕಿ
            </button>
            <button onclick="simulateCustomerOrder()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-2xl shadow-md text-xs transition-all">
                🚨 ಟೆಸ್ಟ್ ಆರ್ಡರ್ (ಸೈರನ್ ಆನ್)
            </button>
        </section>

        <!-- ಅಪ್‌ಲೋಡ್ ಮಾಡಿದ ಚಿಕ್ಕ ಫೋಟೋಗಳ ಗ್ಯಾಲರಿ -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-3 border-b pb-2">
                <h2 class="text-sm font-bold text-slate-900 flex items-center gap-2">
                    📦 ಅಂಗಡಿಯ ಫೋಟೋಗಳು/ಸಾಮಗ್ರಿಗಳು (<span id="productCount">0</span>)
                </h2>
                <span class="text-[10px] text-slate-400">*ಮಾಲೀಕರು ಡಿಲೀಟ್ ಮಾಡುವವರೆಗೆ ಕಣ್ಮರೆಯಾಗುವುದಿಲ್ಲ</span>
            </div>
            
            <div id="productList" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2.5">
                <!-- Permanently Stored Micro Thumbnails Populated Here -->
            </div>
        </section>

    </main>


    <!-- ========================================== -->
    <!-- MODAL 1: ಆರ್ಡರ್ ನೋಡಿ ಪಾಪ್-ಅಪ್ (ORDERS MODAL) -->
    <!-- ========================================== -->
    <div id="ordersModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-xl rounded-3xl shadow-2xl max-h-[90vh] flex flex-col overflow-hidden">
            
            <div class="bg-indigo-700 text-white p-4 flex justify-between items-center">
                <h2 class="text-base font-bold flex items-center gap-2">
                    📋 ಬಂದಿರುವ ಆರ್ಡರ್‌ಗಳು (<span id="modalOrderCount">0</span>)
                </h2>
                <button onclick="closeOrdersModal()" class="bg-indigo-800 hover:bg-indigo-900 text-white w-8 h-8 rounded-full font-bold text-sm flex items-center justify-center">
                    ✕
                </button>
            </div>

            <div id="ordersContainer" class="p-4 space-y-3 overflow-y-auto flex-1">
                <!-- Orders populate here -->
            </div>
        </div>
    </div>


    <!-- ========================================== -->
    <!-- MODAL 2: ಪ್ರಾಡಕ್ಟ್ / ಫೋಟೋ ಹಾಕುವ ಪಾಪ್-ಅಪ್ (UPLOAD) -->
    <!-- ========================================== -->
    <div id="addProductModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden p-5 relative">
            <button onclick="closeAddProductModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-lg font-bold">
                ✕
            </button>
            <h2 class="text-base font-bold mb-3 text-indigo-900 border-b pb-2">➕ ಪ್ರಾಡಕ್ಟ್ / ಫೋಟೋ ಅಪ್‌ಲೋಡ್</h2>

            <form id="productForm" class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">ವಸ್ತುವಿನ ಹೆಸರು</label>
                    <input type="text" id="itemName" required placeholder="ಉದಾ: ಜೀನ್ಸ್ ಪ್ಯಾಂಟ್ / ಟೊಮೇಟೊ" class="w-full p-2 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">ಹಳೆಯ ಬೆಲೆ (₹)</label>
                        <input type="number" id="oldPrice" placeholder="500" class="w-full p-2 border rounded-xl text-xs outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-emerald-700 mb-1">ಪ್ರೆಸೆಂಟ್ ರೇಟ್ (₹)</label>
                        <input type="number" id="newPrice" required placeholder="400" class="w-full p-2 border border-emerald-400 rounded-xl text-xs font-bold bg-emerald-50/30">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">ಎಷ್ಟು ಪೀಸ್ / ಪ್ರಮಾಣ?</label>
                        <select id="itemUnit" required class="w-full p-2 border rounded-xl text-xs outline-none bg-white">
                            <option value="1 Piece">1 Piece (ಒಂದು)</option>
                            <option value="2 Pieces">2 Pieces</option>
                            <option value="3 Pieces">3 Pieces</option>
                            <option value="6 Pieces">6 Pieces (ಅರ್ಧ ಡಜನ್)</option>
                            <option value="1 KG">1 KG</option>
                            <option value="1 Pack">1 Pack</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">ರಿಟರ್ನ್ ಆಪ್ಷನ್ ಇದೆಯೇ?</label>
                        <select id="itemReturn" class="w-full p-2 border rounded-xl text-xs outline-none bg-white font-bold">
                            <option value="ರಿಟರ್ನ್ ಇದೆ" class="text-emerald-600">✅ ರಿಟರ್ನ್ ಇದೆ</option>
                            <option value="ರಿಟರ್ನ್ ಇಲ್ಲ" class="text-red-600">❌ ರಿಟರ್ನ್ ಇಲ್ಲ</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">ಫೋಟೋ ಆಯ್ಕೆ ಮಾಡಿ</label>
                    <input type="file" id="itemImage" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-indigo-50 file:text-indigo-700 cursor-pointer">
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-xs transition-all shadow-md mt-2">
                    🚀 ಆಪ್‌ಗೆ ಸೇರಿಸಿ (Publish)
                </button>
            </form>
        </div>
    </div>

    <!-- Web Audio Siren Synthesizer for High Volume Alert -->
    <script>
        // Permanent LocalStorage Keys
        const STORE_KEY_PRODUCTS = "LOCAL_SHOP_PRODUCTS_V2";
        const STORE_KEY_ORDERS = "LOCAL_SHOP_ORDERS_V2";
        const STORE_KEY_USER = "LOCAL_SHOP_USER_PIN";

        let products = JSON.parse(localStorage.getItem(STORE_KEY_PRODUCTS)) || [
            { id: 1, name: "ತಾಜಾ ಟೊಮೇಟೊ", oldPrice: "50", newPrice: "40", unit: "1 KG", returnOption: "ರಿಟರ್ನ್ ಇಲ್ಲ", image: "https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=150" }
        ];

        let orders = JSON.parse(localStorage.getItem(STORE_KEY_ORDERS)) || [];

        // Check Login Session on Page Load
        window.addEventListener('DOMContentLoaded', () => {
            const savedPin = localStorage.getItem(STORE_KEY_USER);
            if(savedPin) {
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('shopHeaderCategory').innerText = `ಐಡಿ: #${savedPin} | ಲಾಗಿನ್ ಆಗಿದೆ`;
            } else {
                document.getElementById('loginPage').classList.remove('hidden');
            }
            renderProducts();
            renderOrders();
            calculateStats();
        });

        function saveState() {
            localStorage.setItem(STORE_KEY_PRODUCTS, JSON.stringify(products));
            localStorage.setItem(STORE_KEY_ORDERS, JSON.stringify(orders));
        }

        // Tab Switcher
        function switchTab(tab) {
            if(tab === 'login') {
                document.getElementById('loginTab').classList.remove('hidden');
                document.getElementById('registerTab').classList.add('hidden');
                document.getElementById('tabLoginBtn').className = "flex-1 py-2 text-xs font-bold rounded-lg bg-indigo-600 text-white shadow";
                document.getElementById('tabRegBtn').className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-600";
            } else {
                document.getElementById('loginTab').classList.add('hidden');
                document.getElementById('registerTab').classList.remove('hidden');
                document.getElementById('tabRegBtn').className = "flex-1 py-2 text-xs font-bold rounded-lg bg-indigo-600 text-white shadow";
                document.getElementById('tabLoginBtn').className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-600";
            }
        }

        // Handle Login
        function handleLogin(e) {
            e.preventDefault();
            const inputPin = document.getElementById('loginPin').value;
            if(inputPin.length === 4) {
                localStorage.setItem(STORE_KEY_USER, inputPin);
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('shopHeaderCategory').innerText = `ಐಡಿ: #${inputPin} | ಲಾಗಿನ್ ಆಗಿದೆ`;
            } else {
                alert("❌ ದಯವಿಟ್ಟು ಸರಿಯಾದ 4-ಡಿಜಿಟ್ ಪಿನ್ ಹಾಕಿ!");
            }
        }

        // Handle Register
        function handleRegister(e) {
            e.preventDefault();
            const shopName = document.getElementById('regShopName').value;
            const category = document.getElementById('regCategory').value;
            const randomPin = Math.floor(1000 + Math.random() * 9000).toString();

            localStorage.setItem(STORE_KEY_USER, randomPin);
            alert(`🎉 ನೋಂದಣಿ ಯಶಸ್ವಿಯಾಗಿದೆ!\n\nಅಂಗಡಿ: ${shopName}\nನಿಮ್ಮ 4-ಡಿಜಿಟ್ ಶಾಪ್ ಪಿನ್ ಕೋಡ್: #${randomPin}`);
            
            document.getElementById('shopHeaderTitle').innerText = `🏪 ${shopName}`;
            document.getElementById('shopHeaderCategory').innerText = `ಐಡಿ: #${randomPin} | ${category}`;
            document.getElementById('loginPage').classList.add('hidden');
        }

        function logout() {
            if(confirm("ನೀವು ಲಾಗ್ ಔಟ್ ಮಾಡಲು ಬಯಸುತ್ತೀರಾ?")) {
                localStorage.removeItem(STORE_KEY_USER);
                location.reload();
            }
        }

        // Modals
        function openOrdersModal() { document.getElementById('ordersModal').classList.remove('hidden'); }
        function closeOrdersModal() { document.getElementById('ordersModal').classList.add('hidden'); }
        function openAddProductModal() { document.getElementById('addProductModal').classList.remove('hidden'); }
        function closeAddProductModal() { document.getElementById('addProductModal').classList.add('hidden'); }

        // Handle Product Upload (Convert to Base64 Image to Save Permanently)
        document.getElementById('productForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('itemName').value;
            const oldPrice = document.getElementById('oldPrice').value;
            const newPrice = document.getElementById('newPrice').value;
            const unit = document.getElementById('itemUnit').value;
            const returnOption = document.getElementById('itemReturn').value;
            const imageInput = document.getElementById('itemImage');

            const saveProductObj = (imgData) => {
                products.push({ id: Date.now(), name, oldPrice, newPrice, unit, returnOption, image: imgData });
                saveState();
                renderProducts();
                this.reset();
                closeAddProductModal();
            };

            if (imageInput.files && imageInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) { saveProductObj(e.target.result); };
                reader.readAsDataURL(imageInput.files[0]);
            } else {
                saveProductObj("https://images.unsplash.com/photo-1542838132-92c53300491e?w=150");
            }
        });

        // Render Permanent Compact Product Gallery
        function renderProducts() {
            const list = document.getElementById('productList');
            document.getElementById('productCount').innerText = products.length;

            list.innerHTML = products.map((item) => `
                <div class="border rounded-xl p-1.5 bg-slate-50 relative shadow-sm flex flex-col items-center text-center">
                    <button onclick="deleteProduct(${item.id})" class="absolute -top-1.5 -right-1.5 bg-red-500 hover:bg-red-600 text-white w-5 h-5 rounded-full text-[10px] font-bold shadow flex items-center justify-center z-10" title="ಡಿಲೀಟ್ ಮಾಡಿ">
                        ✕
                    </button>
                    <img src="${item.image}" class="w-12 h-12 object-cover rounded-lg border bg-white mb-1">
                    <h3 class="font-bold text-[10px] text-slate-800 line-clamp-1">${item.name}</h3>
                    <p class="text-[9px] text-slate-500">${item.unit}</p>
                    <p class="text-emerald-700 font-bold text-[10px] mt-0.5">₹${item.newPrice}</p>
                    <span class="text-[8px] ${item.returnOption === 'ರಿಟರ್ನ್ ಇದೆ' ? 'text-emerald-600' : 'text-red-500'} font-semibold">${item.returnOption}</span>
                </div>
            `).join('');
        }

        // Delete Product (Only Shop Owner can Delete)
        function deleteProduct(id) {
            if(confirm("ಈ ಫೋಟೋವನ್ನು ಶಾಶ್ವತವಾಗಿ ಡಿಲೀಟ್ ಮಾಡಬೇಕೇ?")) {
                products = products.filter(p => p.id !== id);
                saveState();
                renderProducts();
            }
        }

        // Render Orders List
        function renderOrders() {
            const container = document.getElementById('ordersContainer');
            document.getElementById('modalOrderCount').innerText = orders.length;
            document.getElementById('topOrderBadge').innerText = orders.length;

            if(orders.length === 0) {
                container.innerHTML = `<p class="text-center text-xs text-slate-400 py-8">ಯಾವುದೇ ಹೊಸ ಆರ್ಡರ್‌ಗಳು ಇಲ್ಲ</p>`;
                return;
            }

            container.innerHTML = orders.slice().reverse().map((ord) => {
                let statusTag = '';
                let buttonBox = '';

                if (ord.statusStep === 1) {
                    statusTag = `<span class="text-[10px] font-bold text-amber-800 bg-amber-100 border border-amber-300 px-2 py-0.5 rounded-lg">⏳ ಹೊಸ ಆರ್ಡರ್ ಬಂದಿದೆ!</span>`;
                    buttonBox = `<button onclick="acceptAndLockOrder(${ord.id})" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs py-2 rounded-xl font-bold shadow">✅ ಆರ್ಡರ್ ಸ್ವೀಕರಿಸಿ & ಲಾಕ್ ಮಾಡಿ</button>`;
                } else if (ord.statusStep === 2) {
                    statusTag = `<span class="text-[10px] font-bold text-blue-800 bg-blue-100 border border-blue-300 px-2 py-0.5 rounded-lg">👍 ಸ್ವೀಕರಿಸಲಾಗಿದೆ & ಲಾಕ್ ಆಗಿದೆ</span>`;
                    buttonBox = `<button onclick="updateStep(${ord.id}, 3)" class="w-full bg-amber-600 hover:bg-amber-700 text-white text-xs py-2 rounded-xl font-bold shadow">📦 ಪ್ಯಾಕಿಂಗ್ ಆಗಿದೆ (Notify Delivery)</button>`;
                } else if (ord.statusStep === 3) {
                    statusTag = `<span class="text-[10px] font-bold text-purple-800 bg-purple-100 border border-purple-300 px-2 py-0.5 rounded-lg">📦 Pickup Ready</span>`;
                    buttonBox = `<button onclick="updateStep(${ord.id}, 4)" class="w-full bg-purple-600 hover:bg-purple-700 text-white text-xs py-2 rounded-xl font-bold shadow">🚴‍♂️ ಡೆಲಿವರಿ ಬಾಯ್ ಪಿಕ್ ಮಾಡಿಕೊಂಡರು</button>`;
                } else if (ord.statusStep === 4) {
                    statusTag = `<span class="text-[10px] font-bold text-orange-800 bg-orange-100 border border-orange-300 px-2 py-0.5 rounded-lg">🚚 ಡೆಲಿವರಿಗೆ ಕಳುಹಿಸಲಾಗಿದೆ - Payment Pending</span>`;
                    buttonBox = `<button onclick="updateStep(${ord.id}, 5)" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs py-2 rounded-xl font-bold shadow">💰 ಪೇಮೆಂಟ್ ಬಂತು - OK</button>`;
                } else {
                    statusTag = `<span class="text-[10px] font-bold text-emerald-800 bg-emerald-100 border border-emerald-300 px-2 py-0.5 rounded-lg">✅ ಸಕ್ಸಸ್‌ಫುಲ್!</span>`;
                    buttonBox = `<div class="w-full bg-emerald-200 text-emerald-900 text-xs p-1.5 rounded-xl text-center font-bold">🎉 ಆರ್ಡರ್ ಪೂರ್ಣಗೊಂಡಿದೆ</div>`;
                }

                return `
                    <div class="border-2 ${ord.statusStep === 1 ? 'border-amber-400 bg-amber-50/50 new-order-pulse' : 'border-slate-200 bg-white'} p-3 rounded-2xl shadow-sm">
                        <div class="flex justify-between items-start flex-wrap gap-1">
                            <div>
                                <span class="text-[10px] bg-indigo-100 text-indigo-900 font-bold px-1.5 py-0.5 rounded">ಆರ್ಡರ್ #${ord.id}</span>
                                <p class="font-bold text-xs mt-1">${ord.customer}</p>
                            </div>
                            ${statusTag}
                        </div>
                        
                        <div class="my-2 border-t border-b border-slate-100 py-1.5 text-xs space-y-0.5">
                            <div class="flex justify-between"><span>• ${ord.item}</span> <span class="font-semibold">₹${ord.amount}</span></div>
                        </div>

                        <div class="mt-2">${buttonBox}</div>
                    </div>
                `;
            }).join('');
        }

        function acceptAndLockOrder(orderId) {
            updateStep(orderId, 2);
            alert("🔒 ಆರ್ಡರ್ ನಿಮಗೆ ಲಾಕ್ ಆಗಿದೆ! ಇತರ ಶಾಪ್‌ಗಳಿಗೆ ಇದು ಲಭ್ಯವಿರುವುದಿಲ್ಲ.");
        }

        function updateStep(orderId, newStep) {
            const ord = orders.find(o => o.id === orderId);
            if(ord) {
                ord.statusStep = newStep;
                saveState();
                renderOrders();
                calculateStats();
            }
        }

        function calculateStats() {
            document.getElementById('statTotalOrders').innerText = orders.length;
            const totalEarned = orders.filter(o => o.statusStep === 5).reduce((sum, o) => sum + Number(o.amount), 0);
            document.getElementById('statEarnings').innerText = `₹${totalEarned}`;
        }

        // Loud Loud Siren Audio Generator (Web Audio Synthesizer)
        function playSirenSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.4);

                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.8);
            } catch(e) {
                console.log("Audio Alert Triggered");
            }
        }

        // Simulate Real Customer Order with Siren Sound
        let orderCounter = 102;
        function simulateCustomerOrder() {
            const activeItem = products[0] || { name: 'ಸಾಮಗ್ರಿ', newPrice: '100' };
            orders.push({
                id: orderCounter++,
                customer: "ಗ್ರಾಹಕರು (ಮಲ್ಲೇಶ್ವರಂ)",
                phone: "+91 99000 11223",
                item: `${activeItem.name} (${activeItem.unit})`,
                amount: activeItem.newPrice,
                statusStep: 1
            });

            saveState();
            renderOrders();
            calculateStats();
            playSirenSound(); // ಸೈರನ್ ಸೌಂಡ್ ಪ್ಲೇ ಆಗುತ್ತದೆ
            openOrdersModal();
        }
    </script>
</body>
</html>
