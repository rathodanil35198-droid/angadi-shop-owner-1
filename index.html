<!DOCTYPE html>
<html lang="kn" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <meta name="google-site-verification" content="ZgEiG1KeQR2v__zpU2O3CpOBqjORyCDkBn5yInF902c" />

  <title id="pageTitle">ನಮ್ಮ ಊರು ಪಾರ್ಟ್ನರ್ ಆ್ಯಪ್ | ಅಂಗಡಿ ಮಾಲೀಕರ ಆಪ್ - Shop Owner Panel</title>
  
  <link rel="icon" type="image/png" sizes="192x192" href="logo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e88e5">

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, deleteDoc, getDocs, setDoc, getDoc, serverTimestamp, query, where, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAm3HFKu101wex1b025-zJZ2BJ_o1Xvw",
      authDomain: "ar-taxi-booking-shahapur.firebaseapp.com",
      projectId: "ar-taxi-booking-shahapur",
      storageBucket: "ar-taxi-booking-shahapur.appspot.com",
      messagingSenderId: "585815710897",
      appId: "1:586815710897:web:ab7138b9c016843db95dsa"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    window.db = db;
    window.collection = collection;
    window.addDoc = addDoc;
    window.setDoc = setDoc;
    window.getDoc = getDoc;
    window.onSnapshot = onSnapshot;
    window.updateDoc = updateDoc;
    window.doc = doc;
    window.deleteDoc = deleteDoc;
    window.getDocs = getDocs;
    window.query = query;
    window.where = where;
    window.orderBy = orderBy;
    window.limit = limit;
    window.serverTimestamp = serverTimestamp;

    window.initFirebaseShopApp();
  </script>

  <style>
    :root { --primary: #1e88e5; --secondary: #26a69a; --bg: #f4f7f6; --text: #333; --success: #4caf50; --danger: #e53935; --warning: #fb8c00; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: manipulation; }
    html, body { width: 100%; height: 100%; overflow-x: hidden; background-color: var(--bg); color: var(--text); padding: 8px; }
    .container { width: 100%; max-width: 500px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 30px; }

    header { background-color: var(--primary); color: white; padding: 12px 15px; text-align: center; border-radius: 10px; margin-bottom: 15px; }
    h2 { font-size: 1rem; margin-bottom: 10px; color: var(--primary); border-bottom: 2px solid var(--primary); padding-bottom: 5px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 4px; color: #4a5568; }
    input, select { width: 100%; padding: 10px; border: 2px solid #cbd5e0; border-radius: 8px; font-size: 0.9rem; background: #fff; }

    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.95rem; color: white; background: var(--primary); }
    .btn-success { background: var(--success); }
    .btn-danger { background: var(--danger); }
    .btn-warning { background: var(--warning); }
    .btn-call-cust { background: #388e3c; color: #fff; padding: 6px 12px; border-radius: 4px; text-decoration: none; font-size: 0.75rem; font-weight: bold; display: inline-block; margin-top: 4px; }
    .btn-map-loc { background: #0288d1; color: #fff; padding: 6px 12px; border-radius: 4px; text-decoration: none; font-size: 0.75rem; font-weight: bold; display: inline-block; margin-top: 4px; margin-left: 4px; }
    .btn-pack { background: #ff9f00; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; cursor: pointer; margin-top: 6px; width: 100%; }
    .btn-confirm { background: #2874f0; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; cursor: pointer; margin-top: 6px; width: 100%; }
    .btn-print { background: #00838f; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; cursor: pointer; margin-top: 6px; width: 100%; }

    .id-card { background: linear-gradient(135deg, #1e88e5, #1565c0); color: white; border-radius: 10px; padding: 15px; margin-bottom: 15px; display: flex; gap: 15px; align-items: center; }
    .id-card img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; }
    .order-item { border-left: 5px solid var(--primary); background: #f9f9f9; padding: 12px; margin-bottom: 12px; border-radius: 6px; font-size: 0.85rem; border: 1px solid #e0e0e0; border-left-width: 5px; }
    .cust-address-box { background: #e8f5e9; border: 1px dashed #2e7d32; border-radius: 8px; padding: 10px; margin: 8px 0; font-size: 0.85rem; line-height: 1.4; color: #1b5e20; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🏪 ನಮ್ಮ ಊರು ಪಾರ್ಟ್ನರ್ ಆ್ಯಪ್</h1>
      <p style="font-size: 0.8rem;">ಅಂಗಡಿ ಮಾಲೀಕರ ಪ್ಯಾನೆಲ್</p>
    </header>

    <!-- ಲಾಗಿನ್ ಸೆಕ್ಷನ್ -->
    <div id="loginSection" style="background:#f1f8e9; padding:15px; border-radius:10px;">
      <h2>🔑 ಲಾಗಿನ್ ಮಾಡಿ</h2>
      <div style="display:flex; gap:8px;">
        <input type="number" id="existingIdInput" placeholder="4-ಡಿಜಿಟ್ ಐಡಿ ಹಾಕಿ" style="flex:1; padding:12px; font-size:1.2rem; text-align:center; border:2px solid #1e88e5; border-radius:8px;">
        <button type="button" class="btn" style="width:auto; padding:10px 20px;" onclick="loginWithExistingId()">ಲಾಗಿನ್</button>
      </div>
    </div>

    <!-- ಡ್ಯಾಶ್‌ಬೋರ್ಡ್ ಸೆಕ್ಷನ್ -->
    <div id="dashboardSection" style="display:none;">
      <div class="id-card">
        <img id="displayShopPhoto" src="https://via.placeholder.com/100" alt="Shop">
        <div>
          <h3 id="displayShopName">ಅಂಗಡಿ ಹೆಸರು</h3>
          <p>ಮಾಲೀಕರು: <span id="displayOwnerName"></span></p>
          <div style="background:#fff; color:#1e88e5; padding:2px 8px; border-radius:4px; font-weight:bold; display:inline-block; margin-top:4px;">ID: <span id="displayId">0000</span></div>
        </div>
      </div>

      <h3>📦 ಪ್ರಸ್ತುತ ಹೊಸ ಆರ್ಡರ್‌ಗಳು</h3>
      <div id="shopOrdersList" style="margin-top:10px;"></div>
    </div>
  </div>

  <script>
    let shopOwner = JSON.parse(localStorage.getItem('my_shop_owner_session')) || null;

    window.initFirebaseShopApp = function() {
      if (shopOwner) {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('dashboardSection').style.display = 'block';
        renderIDCard();
        startRealtimeSync();
      }
    };

    async function loginWithExistingId() {
      const idVal = document.getElementById('existingIdInput').value.trim();
      if (!idVal) { alert("ದಯವಿಟ್ಟು ಐಡಿ ಹಾಕಿ."); return; }
      try {
        const docRef = window.doc(window.db, "shop_owners", String(idVal));
        const docSnap = await window.getDoc(docRef);
        if (docSnap.exists()) {
          shopOwner = docSnap.data();
          localStorage.setItem('my_shop_owner_session', JSON.stringify(shopOwner));
          document.getElementById('loginSection').style.display = 'none';
          document.getElementById('dashboardSection').style.display = 'block';
          renderIDCard();
          startRealtimeSync();
          alert("ಲಾಗಿನ್ ಯಶಸ್ವಿಯಾಗಿದೆ!");
        } else {
          alert("ಐಡಿ ಸಿಕ್ಕಿಲ್ಲ.");
        }
      } catch (e) { alert("Error: " + e.message); }
    }

    function renderIDCard() {
      document.getElementById('displayShopName').innerText = shopOwner.shopName;
      document.getElementById('displayOwnerName').innerText = shopOwner.name;
      document.getElementById('displayId').innerText = shopOwner.id;
      if (shopOwner.photo) document.getElementById('displayShopPhoto').src = shopOwner.photo;
    }

    function startRealtimeSync() {
      window.onSnapshot(window.collection(window.db, "orders"), (snapshot) => {
        let orders = [];
        snapshot.forEach(docSnap => {
          const o = docSnap.data();
          if (o.shopId === shopOwner.id) {
            orders.push({ docId: docSnap.id, ...o });
          }
        });
        renderOrders(orders);
      });
    }

    function renderOrders(orders) {
      const listDiv = document.getElementById('shopOrdersList');
      if (orders.length === 0) {
        listDiv.innerHTML = '<p style="font-size:0.8rem; color:#777;">ಯಾವುದೇ ಆರ್ಡರ್‌ಗಳಿಲ್ಲ.</p>';
        return;
      }

      listDiv.innerHTML = orders.map(o => {
        let status = o.status || 'PENDING';
        let actionButtonHTML = '';

        // 1. ಮೊದಲು ಕನ್ಫರ್ಮ್ ಬಟನ್ ಮಾತ್ರ ಕಾಣಿಸುತ್ತದೆ. ಒಮ್ಮೆ ಒಕೆ ಮಾಡಿದರೆ ಅದು ಮಾಯವಾಗಿ ಪ್ಯಾಕಿಂಗ್ ಬಟನ್ ಬರುತ್ತದೆ[span_2](start_span)[span_2](end_span).
        if (status === 'PENDING' || status === 'STEP_1') {
          actionButtonHTML = `<button onclick="updateOrderStatus('${o.docId}', 'CONFIRMED')" class="btn-confirm">✅ ಆರ್ಡರ್ ಕನ್ಫರ್ಮ್ ಮಾಡಿ (Confirm)</button>`;
        } else if (status === 'CONFIRMED' || status === 'STEP_2') {
          let generatedOtp = o.pickupOtp || Math.floor(1000 + Math.random() * 9000).toString();
          actionButtonHTML = `
            <button onclick="updateOrderStatus('${o.docId}', 'STEP_3', '${generatedOtp}')" class="btn-pack">📦 ಪ್ಯಾಕಿಂಗ್ ಆಗಿದೆ (ಡೆಲಿವರಿ ಬಾಯ್‌ಗೆ ಕಳಿಸಿ)</button>
          `;
        } else {
          actionButtonHTML = `<p style="color:var(--success); font-weight:bold; margin-top:6px;">✅ ಡೆಲಿವರಿ ಬಾಯ್ಸ್‌ಗೆ ಕಳುಹಿಸಲಾಗಿದೆ</p>`;
        }

        let custName = o.customer?.name || 'ಗ್ರಾಹಕರು';
        let custPhone = o.customer?.phone || '';
        let custVillage = o.customer?.village || o.customer?.address || 'ಶಹಾಪುರ';
        let custTaluk = o.customer?.taluk || 'ಸುರಪುರ';
        let custDistrict = o.customer?.district || 'ರೈಚೂರು';
        let custPincode = o.customer?.pincode || '585287';
        let custLandmark = o.customer?.landmark ? ` (ಲ್ಯಾಂಡ್‌ಮಾರ್ಕ್: ${o.customer.landmark})` : '';

        let mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(custVillage + ' ' + custTaluk + ' ' + custDistrict)}`;

        return `
          <div class="order-item">
            <div style="background:#e3f2fd; padding:6px; border-radius:4px; margin-bottom:6px; font-size:0.75rem; font-weight:bold; color:#1565c0;">
              ಆರ್ಡರ್ ಐಡಿ: ${o.orderId || o.id}
            </div>
            
            <div style="display:flex; gap:10px; align-items:center;">
              <img src="${o.productPhoto || 'https://via.placeholder.com/60'}" style="width:60px; height:60px; object-fit:cover; border-radius:6px;">
              <div>
                <b>${o.productName}</b><br>
                <span style="color:#2e7d32; font-weight:bold;">₹${o.totalPrice || 0}</span>
              </div>
            </div>

            <div class="cust-address-box">
              <p style="font-weight:bold; margin-bottom:4px;">📍 ಗ್ರಾಹಕರ ಸಂಪೂರ್ಣ ವಿಳಾಸ:</p>
              <p><b>ಹೆಸರು:</b> ${custName}</p>
              <p><b>ಮೊಬೈಲ್:</b> ${custPhone}</p>
              <p><b>ಜಿಲ್ಲೆ:</b> ${custDistrict}</p>
              <p><b>ತಾಲೂಕು:</b> ${custTaluk}</p>
              <p><b>ಊರು:</b> ${custVillage}${custLandmark}</p>
              <p><b>ಪಿನ್ ಕೋಡ್:</b> ${custPincode}</p>
            </div>

            <div style="display:flex; gap:6px;">
              ${custPhone ? `<a href="tel:${custPhone}" class="btn-call-cust">📞 ಕಾಲ್ ಮಾಡಿ</a>` : ''}
              <a href="${mapsUrl}" target="_blank" class="btn-map-loc">🗺️ ಗೂಗಲ್ ಜಿಪಿಎಸ್ ಲೊಕೇಶನ್</a>
            </div>

            <p style="margin-top:6px; font-size:0.75rem; color:#555;"><b>ಪ್ರಸ್ತುತ ಸ್ಥಿತಿ:</b> ${status}</p>
            ${actionButtonHTML}
          </div>
        `;
      }).join('');
    }

    async function updateOrderStatus(orderId, newStatus, existingOtp) {
      try {
        let updateData = { status: newStatus };
        if (newStatus === 'STEP_3' && existingOtp) {
          updateData.pickupOtp = existingOtp;
        }
        await window.updateDoc(window.doc(window.db, "orders", orderId), updateData);
        alert("✅ ಯಶಸ್ವಿಯಾಗಿ ಅಪ್‌ಡೇಟ್ ಆಗಿದೆ ಮತ್ತು ಡೆಲಿವರಿ ಸಿಸ್ಟಮ್‌ಗೆ ಕಳುಹಿಸಲಾಗಿದೆ!");
      } catch (e) { alert("ದೋಷ: " + e.message); }
    }
  </script>
</body>
</html>
