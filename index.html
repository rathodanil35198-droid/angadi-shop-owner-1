<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Market Multi-Role App (Flipkart Model)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Navigation / Role Switcher -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex flex-wrap justify-between items-center">
            <h1 class="text-xl font-bold">🛒 LocalMarket App</h1>
            <div class="space-x-2 mt-2 sm:mt-0">
                <button onclick="switchRole('customer')" class="bg-blue-700 px-3 py-1 rounded text-sm hover:bg-blue-800">Customer</button>
                <button onclick="switchRole('vendor')" class="bg-blue-700 px-3 py-1 rounded text-sm hover:bg-blue-800">Vendor</button>
                <button onclick="switchRole('delivery')" class="bg-blue-700 px-3 py-1 rounded text-sm hover:bg-blue-800">Delivery</button>
                <button onclick="switchRole('admin')" class="bg-blue-700 px-3 py-1 rounded text-sm hover:bg-blue-800">Admin</button>
            </div>
        </div>
    </header>

    <main class="container mx-auto p-4 max-w-4xl">

        <!-- 1. CUSTOMER VIEW -->
        <section id="customer-view" class="role-section space-y-6">
            <div class="bg-white p-4 rounded shadow">
                <h2 class="text-lg font-bold text-blue-600 mb-3">🛍️ Customer Shopping App</h2>
                <div id="customer-products" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Products loaded dynamically -->
                </div>
            </div>
            <div class="bg-white p-4 rounded shadow">
                <h3 class="font-bold text-md mb-2">My Orders & Live Tracking</h3>
                <div id="customer-orders" class="space-y-2 text-sm"></div>
            </div>
        </section>

        <!-- 2. VENDOR VIEW -->
        <section id="vendor-view" class="role-section hidden space-y-6">
            <div class="bg-white p-4 rounded shadow">
                <h2 class="text-lg font-bold text-green-600 mb-3">🏪 Vendor / Shop Keeper Panel</h2>
                <form id="product-form" onsubmit="addProduct(event)" class="space-y-3">
                    <input type="text" id="p-name" placeholder="Product Name" required class="w-full p-2 border rounded">
                    <input type="number" id="p-price" placeholder="Price (₹)" required class="w-full p-2 border rounded">
                    <input type="text" id="p-image" placeholder="Image URL (optional)" class="w-full p-2 border rounded">
                    <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded w-full">Upload Product</button>
                </form>
            </div>
            <div class="bg-white p-4 rounded shadow">
                <h3 class="font-bold text-md mb-2">Incoming Orders (Pack Items)</h3>
                <div id="vendor-orders" class="space-y-2 text-sm"></div>
            </div>
        </section>

        <!-- 3. DELIVERY PARTNER VIEW -->
        <section id="delivery-view" class="role-section hidden space-y-6">
            <div class="bg-white p-4 rounded shadow">
                <h2 class="text-lg font-bold text-orange-600 mb-3">🚚 Delivery Partner App</h2>
                <p class="text-sm text-gray-600 mb-3">Orders ready for pickup from shops:</p>
                <div id="delivery-orders" class="space-y-3"></div>
            </div>
        </section>

        <!-- 4. MASTER ADMIN VIEW -->
        <section id="admin-view" class="role-section hidden space-y-6">
            <div class="bg-white p-4 rounded shadow">
                <h2 class="text-lg font-bold text-purple-600 mb-3">👑 Master Admin Panel (Owner)</h2>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div class="bg-purple-50 p-3 rounded text-center">
                        <p class="text-gray-500 text-sm">Total Sales</p>
                        <p id="admin-sales" class="text-xl font-bold text-purple-700">₹0</p>
                    </div>
                    <div class="bg-purple-50 p-3 rounded text-center">
                        <p class="text-gray-500 text-sm">My Commission (10%)</p>
                        <p id="admin-commission" class="text-xl font-bold text-purple-700">₹0</p>
                    </div>
                </div>
                <h3 class="font-bold text-md mb-2">All Platform Orders</h3>
                <div id="admin-orders" class="space-y-2 text-sm"></div>
            </div>
        </section>

    </main>

    <!-- JavaScript Logic -->
    <script>
        // Initial Mock Data
        let products = JSON.parse(localStorage.getItem('products')) || [
            { id: 1, name: 'Fresh Organic Tomatoes (1kg)', price: 40, image: 'https://via.placeholder.com/150' },
            { id: 2, name: 'Milky Mist Curd (500g)', price: 35, image: 'https://via.placeholder.com/150' }
        ];

        let orders = JSON.parse(localStorage.getItem('orders')) || [];

        function switchRole(role) {
            document.querySelectorAll('.role-section').forEach(sec => sec.classList.add('hidden'));
            document.getElementById(`${role}-view`).classList.remove('hidden');
            renderAll();
        }

        function addProduct(e) {
            e.preventDefault();
            const name = document.getElementById('p-name').value;
            const price = parseFloat(document.getElementById('p-price').value);
            const image = document.getElementById('p-image').value || 'https://via.placeholder.com/150';

            products.push({ id: Date.now(), name, price, image });
            localStorage.setItem('products', JSON.stringify(products));
            document.getElementById('product-form').reset();
            alert('Product Uploaded Successfully!');
            renderAll();
        }

        function placeOrder(productId) {
            const product = products.find(p => p.id === productId);
            const newOrder = {
                id: 'ORD' + Math.floor(1000 + Math.random() * 9000),
                productName: product.name,
                price: product.price,
                status: 'Order Placed (Waiting for Vendor)' // Placed -> Packed -> Out for Delivery -> Delivered
            };
            orders.push(newOrder);
            localStorage.setItem('orders', JSON.stringify(orders));
            alert('Order Placed Successfully!');
            renderAll();
        }

        function updateOrderStatus(orderId, newStatus) {
            orders = orders.map(o => o.id === orderId ? {...o, status: newStatus} : o);
            localStorage.setItem('orders', JSON.stringify(orders));
            renderAll();
        }

        function renderAll() {
            // 1. Render Customer Products
            const custProdDiv = document.getElementById('customer-products');
            custProdDiv.innerHTML = products.map(p => `
                <div class="border p-3 rounded flex justify-between items-center">
                    <div>
                        <h4 class="font-bold">${p.name}</h4>
                        <p class="text-green-600 font-semibold">₹${p.price}</p>
                    </div>
                    <button onclick="placeOrder(${p.id})" class="bg-blue-600 text-white px-3 py-1 rounded text-sm">Buy Now</button>
                </div>
            `).join('') || '<p class="text-gray-500">No products available.</p>';

            // 2. Render Customer Orders
            const custOrdDiv = document.getElementById('customer-orders');
            custOrdDiv.innerHTML = orders.map(o => `
                <div class="border p-2 rounded flex justify-between items-center">
                    <div><b>${o.id}</b>: ${o.productName} (₹${o.price})</div>
                    <span class="px-2 py-1 bg-yellow-100 text-yellow-800 rounded text-xs font-bold">${o.status}</span>
                </div>
            `).join('') || '<p class="text-gray-500">No orders yet.</p>';

            // 3. Render Vendor Orders
            const vendOrdDiv = document.getElementById('vendor-orders');
            vendOrdDiv.innerHTML = orders.map(o => `
                <div class="border p-2 rounded flex justify-between items-center">
                    <div><b>${o.id}</b>: ${o.productName}</div>
                    <div>
                        <span class="text-xs mr-2 font-semibold">Status: ${o.status}</span>
                        ${o.status.includes('Placed') ? `<button onclick="updateOrderStatus('${o.id}', 'Packed by Vendor')" class="bg-green-600 text-white px-2 py-1 rounded text-xs">Pack Item</button>` : ''}
                    </div>
                </div>
            `).join('') || '<p class="text-gray-500">No incoming orders.</p>';

            // 4. Render Delivery Orders
            const delOrdDiv = document.getElementById('delivery-orders');
            delOrdDiv.innerHTML = orders.map(o => `
                <div class="border p-2 rounded flex justify-between items-center">
                    <div><b>${o.id}</b>: ${o.productName} <br><small class="text-gray-500">Status: ${o.status}</small></div>
                    <div>
                        ${o.status.includes('Packed') ? `<button onclick="updateOrderStatus('${o.id}', 'Out for Delivery')" class="bg-orange-600 text-white px-2 py-1 rounded text-xs mr-1">Accept</button>` : ''}
                        ${o.status.includes('Out for Delivery') ? `<button onclick="updateOrderStatus('${o.id}', 'Delivered ✅')" class="bg-blue-600 text-white px-2 py-1 rounded text-xs">Mark Delivered</button>` : ''}
                    </div>
                </div>
            `).join('') || '<p class="text-gray-500">No delivery tasks.</p>';

            // 5. Render Admin Panel Stats
            let totalSales = orders.filter(o => o.status.includes('Delivered')).reduce((sum, o) => sum + o.price, 0);
            let commission = totalSales * 0.10; // 10% commission
            document.getElementById('admin-sales').innerText = `₹${totalSales}`;
            document.getElementById('admin-commission').innerText = `₹${commission}`;

            const adminOrdDiv = document.getElementById('admin-orders');
            adminOrdDiv.innerHTML = orders.map(o => `
                <div class="border p-2 rounded flex justify-between items-center">
                    <div><b>${o.id}</b> - ${o.productName} (₹${o.price})</div>
                    <span class="text-xs font-bold text-purple-700">${o.status}</span>
                </div>
            `).join('') || '<p class="text-gray-500">No platform orders.</p>';
        }

        // Initial render on load
        renderAll();
    </script>
</body>
</html>
